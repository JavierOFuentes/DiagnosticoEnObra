<style>
:root{
  --bg:#E4E8EB; --sup:#FFFFFF; --sup2:#F3F6F8; --sup3:#EAEFF2;
  --ink:#1B2733; --ink2:#5D6E7C; --ink3:#8496A2;
  --line:#C9D2D9; --line2:#E1E7EB;
  --amar:#F2C200; --amar-b:#8A6E00; --amar-sup:#FFF6D0;
  --cel:#2E7FA8; --cel-bg:#E3F0F7;
  --ok:#146B35; --ok-bg:#E4F2E9;
  --mal:#B3261E; --mal-bg:#FBE7E5;
  --ojo:#8A5A00; --ojo-bg:#FBF1DC;
  --barra:#1B2733; --barra2:#2C3B49; --barra-txt:#FFFFFF; --barra-sub:#9FB2C0;
  --sombra:0 1px 2px rgba(27,39,51,.06),0 2px 8px rgba(27,39,51,.05);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --fs:1;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
html[data-tema="oscuro"]{
  --bg:#0F171E; --sup:#182430; --sup2:#1E2C3A; --sup3:#243546;
  --ink:#E8EEF2; --ink2:#A3B4C0; --ink3:#7C8F9C;
  --line:#33465A; --line2:#2A3A4A;
  --amar:#E8BE1F; --amar-b:#F0CE5A; --amar-sup:#3A310C;
  --cel:#6FB6DA; --cel-bg:#16303E;
  --ok:#5FD38F; --ok-bg:#12301F;
  --mal:#FF8A80; --mal-bg:#3A1614;
  --ojo:#F0C069; --ojo-bg:#33260C;
  --barra:#0A1119; --barra2:#22323F; --barra-txt:#EAF1F6; --barra-sub:#8FA6B6;
  --sombra:0 1px 2px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:calc(17px * var(--fs)); line-height:1.5; -webkit-text-size-adjust:100%;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}
h1,h2,h3,h4,p,ul,ol{margin:0}
button{font:inherit;color:inherit;font-family:inherit}
input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--cel); outline-offset:2px}
[hidden]{display:none!important}

/* ---------- estructura ---------- */
.wrap{max-width:760px;margin:0 auto;padding:0 var(--s4) var(--s6)}
.barra{
  position:sticky;top:0;z-index:50;background:var(--barra);color:var(--barra-txt);
  padding:calc(env(safe-area-inset-top) + 10px) var(--s4) 10px;
}
.barra-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:var(--s3)}
.barra h1{font-size:calc(15px * var(--fs));font-weight:600;letter-spacing:.01em;line-height:1.25;min-width:0;flex:1}
.barra h1{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.barra h1 span{display:block;font-size:calc(12.5px * var(--fs));font-weight:400;color:var(--barra-sub);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.volver,.icb{
  flex:0 0 auto;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;
  background:var(--barra2);border:0;border-radius:var(--s1);cursor:pointer;padding:0 var(--s3);
  font-size:calc(15px * var(--fs));font-weight:600;color:var(--barra-txt);
}
.volver:active,.icb:active{filter:brightness(1.35)}
.icb svg{width:20px;height:20px;display:block}
.crono{font-family:var(--mono);font-size:calc(15px * var(--fs));color:var(--amar);
  font-variant-numeric:tabular-nums;flex:0 0 auto;text-align:right}
.crono:empty{display:none}

/* ---------- triage ---------- */
.hero{padding:var(--s5) 0 var(--s3)}
.hero p{color:var(--ink2);font-size:calc(15px * var(--fs));margin-top:var(--s2);max-width:56ch}
.hero h2{font-size:calc(27px * var(--fs));line-height:1.15;font-weight:700;letter-spacing:-.02em}
.buscar{
  width:100%;margin:var(--s4) 0 var(--s4);padding:14px var(--s4);font-size:calc(17px * var(--fs));
  border:2px solid var(--ink);border-radius:var(--s1);background:var(--sup);color:var(--ink);
}
.buscar::placeholder{color:var(--ink3)}
.rot{font-size:calc(13px * var(--fs));font-weight:700;color:var(--ink2);letter-spacing:.04em;
  margin:var(--s5) 0 var(--s3);text-transform:uppercase}
.rot:first-child{margin-top:0}
.grilla{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
@media(max-width:430px){.grilla{grid-template-columns:1fr}}
.tri{
  background:var(--sup);border:1px solid var(--line);border-left:5px solid var(--cel);
  border-radius:var(--s1);padding:var(--s3) var(--s4);text-align:left;cursor:pointer;
  min-height:64px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--sombra);
}
.tri:active{background:var(--sup2)}
.tri b{display:block;font-size:calc(16px * var(--fs));font-weight:600;line-height:1.25}
.tri i{display:block;font-style:normal;font-size:calc(13px * var(--fs));color:var(--ink2);margin-top:2px}
.tri.rojo{border-left-color:var(--mal)}
.tri.ambar{border-left-color:var(--ojo)}

/* chips de acceso rápido */
.chips{display:flex;gap:var(--s2);flex-wrap:wrap}
.chip{
  background:var(--sup);border:1px solid var(--line);border-radius:999px;
  padding:10px 15px;font-size:calc(14px * var(--fs));cursor:pointer;display:inline-block;
  min-height:42px;line-height:1.45;text-align:left;max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chip:active{background:var(--sup2)}
.chip .cod{font-family:var(--mono);font-size:calc(12px * var(--fs));color:var(--ink2);margin-right:7px}
.chip.on{background:var(--ink);color:var(--sup);border-color:var(--ink)}
.chip.on .cod{color:var(--sup2)}

/* ---------- familias ---------- */
.fam{margin-top:var(--s5)}
.fam-cab{
  display:flex;align-items:center;gap:var(--s2);padding:var(--s2) 0;width:100%;
  border-bottom:2px solid var(--ink);margin-bottom:var(--s2);background:none;border-top:0;
  border-left:0;border-right:0;cursor:pointer;text-align:left;
}
.fam-cab h3{font-size:calc(17px * var(--fs));font-weight:700;flex:1;min-width:0}
.fam-cab em{font-style:normal;font-size:calc(13px * var(--fs));color:var(--ink2);font-family:var(--mono)}
.fam-cab .car{color:var(--ink3);font-size:calc(13px * var(--fs));width:14px;text-align:center}
.fam.tierra .fam-cab{border-bottom:0;position:relative;padding-bottom:10px}
.fam.tierra .fam-cab::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
  background:repeating-linear-gradient(115deg,#1E7A2E 0 9px,#F2C200 9px 18px);
}
.lista{list-style:none;padding:0;margin:0}
.lista li{border-bottom:1px solid var(--line2)}
.item{
  width:100%;background:none;border:0;padding:13px 0;text-align:left;cursor:pointer;
  display:flex;align-items:center;gap:var(--s3);min-height:48px;
}
.item:active{background:var(--sup2)}
.item .cod{font-family:var(--mono);font-size:calc(12px * var(--fs));color:var(--ink2);flex:0 0 36px}
.item .txt{flex:1;font-size:calc(16px * var(--fs));line-height:1.3;min-width:0}
.item .fl{color:var(--ink3);font-size:calc(20px * var(--fs));line-height:1}
.item mark{background:var(--amar);color:#3d2a00;border-radius:2px;padding:0 1px}
html[data-tema="oscuro"] .item mark{background:var(--amar);color:#241d00}
.vacio{padding:var(--s5) 0;color:var(--ink2);font-size:calc(15px * var(--fs))}

/* estrella de favorito */
.fav{
  flex:0 0 auto;background:none;border:0;cursor:pointer;padding:6px;margin:-6px -6px -6px 0;
  color:var(--ink3);font-size:calc(18px * var(--fs));line-height:1;min-width:36px;min-height:36px;
}
.fav[aria-pressed="true"]{color:var(--amar-b)}
html[data-tema="oscuro"] .fav[aria-pressed="true"]{color:var(--amar)}

/* ---------- ficha ---------- */
.ficha{padding-top:var(--s4)}
.ficha h2{font-size:calc(23px * var(--fs));line-height:1.2;font-weight:700;letter-spacing:-.015em}
.migas{font-family:var(--mono);font-size:calc(12px * var(--fs));color:var(--ink2);margin-bottom:var(--s2);
  display:flex;align-items:center;gap:var(--s2)}
.migas .fav{margin-left:auto}
.sint{
  background:var(--sup);border:1px solid var(--line);border-radius:var(--s1);
  padding:var(--s3) var(--s4);margin-top:var(--s3);font-size:calc(15.5px * var(--fs));color:var(--ink);
}
.bloque{margin-top:var(--s5)}
.bloque > h3{
  font-size:calc(15px * var(--fs));font-weight:700;padding-bottom:6px;border-bottom:2px solid var(--ink);
  margin-bottom:var(--s3);display:flex;align-items:baseline;gap:var(--s2);
}
.bloque > h3 small{font-weight:400;color:var(--ink2);font-size:calc(13px * var(--fs));margin-left:auto;text-align:right}
.causas{list-style:none;padding:0;counter-reset:c}
.causas li{padding:7px 0 7px 30px;position:relative;font-size:calc(15.5px * var(--fs));border-bottom:1px solid var(--line2)}
.causas li::before{
  counter-increment:c;content:counter(c);position:absolute;left:0;top:8px;
  font-family:var(--mono);font-size:calc(12px * var(--fs));color:var(--ink2);
  border:1px solid var(--line);border-radius:50%;width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
}
.eq{background:var(--sup);border:1px solid var(--line);border-radius:var(--s1);padding:var(--s3) var(--s4);margin-bottom:var(--s2)}
.eq b{font-size:calc(15.5px * var(--fs));display:block}
.eq .cfg{font-family:var(--mono);font-size:calc(13.5px * var(--fs));color:var(--ink);background:var(--sup2);
  border-left:3px solid var(--cel);padding:8px 10px;margin-top:8px;line-height:1.45;
  white-space:pre-wrap;border-radius:0 var(--s1) var(--s1) 0}
.pasos{padding-left:0;list-style:none;counter-reset:p}
.pasos li{position:relative;padding:0 0 var(--s3) 34px;font-size:calc(15.5px * var(--fs));line-height:1.45}
.pasos li::before{
  counter-increment:p;content:counter(p);position:absolute;left:0;top:0;
  width:24px;height:24px;background:var(--ink);color:var(--sup);border-radius:50%;
  font-family:var(--mono);font-size:calc(12px * var(--fs));display:flex;align-items:center;justify-content:center;
}
.pasos li:last-child{padding-bottom:0}

/* ---------- zona de medición ---------- */
.medir{background:var(--amar);border:2px solid var(--ink);border-radius:var(--s1);padding:var(--s4);margin-top:var(--s3);color:#1B2733}
.medir h4{margin:0 0 var(--s3);font-size:calc(15px * var(--fs));font-weight:700}
.campo{margin-bottom:var(--s3)}
.campo:last-of-type{margin-bottom:0}
.campo label{display:block;font-size:calc(14.5px * var(--fs));font-weight:600;margin-bottom:5px;line-height:1.3}
.campo .ayuda{display:block;font-weight:400;font-size:calc(13px * var(--fs));color:#5C4A00;margin-top:2px}
.entrada{
  width:100%;padding:13px var(--s3);font-family:var(--mono);font-size:calc(19px * var(--fs));
  border:2px solid #1B2733;border-radius:var(--s1);background:#fff;color:#1B2733;
  font-variant-numeric:tabular-nums;
}
select.entrada{font-family:var(--sans);font-size:calc(16px * var(--fs))}
.uni{display:flex;align-items:center;gap:var(--s2)}
.uni .entrada{flex:1;min-width:0}
.uni .u{font-family:var(--mono);font-size:calc(15px * var(--fs));font-weight:700;min-width:38px}
.sino{display:flex;gap:var(--s2)}
.sino button{
  flex:1;min-height:48px;border:2px solid #1B2733;background:#fff;border-radius:var(--s1);
  font-size:calc(16px * var(--fs));font-weight:600;cursor:pointer;color:#1B2733;
}
.sino button[aria-pressed="true"]{background:#1B2733;color:#fff}
.btn-eval{
  width:100%;min-height:54px;margin-top:var(--s4);background:#1B2733;color:#fff;
  border:0;border-radius:var(--s1);font-size:calc(17px * var(--fs));font-weight:700;cursor:pointer;
}
.btn-eval:active{filter:brightness(1.4)}
.limpiar{width:100%;min-height:42px;margin-top:var(--s2);background:transparent;border:1px solid #8A6E00;
  color:#5C4A00;border-radius:var(--s1);font-size:calc(14px * var(--fs));font-weight:600;cursor:pointer}

/* ---------- veredicto ---------- */
.ver{border:2px solid;border-radius:var(--s1);padding:var(--s4);margin-top:var(--s3)}
@media (prefers-reduced-motion:no-preference){
  .ver{animation:sube .18s ease-out}
  @keyframes sube{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
.ver.ok{border-color:var(--ok);background:var(--ok-bg)}
.ver.mal{border-color:var(--mal);background:var(--mal-bg)}
.ver.ojo{border-color:var(--ojo);background:var(--ojo-bg)}
.ver.info{border-color:var(--cel);background:var(--cel-bg)}
.ver .tit{font-size:calc(19px * var(--fs));font-weight:700;line-height:1.2}
.ver.ok .tit{color:var(--ok)} .ver.mal .tit{color:var(--mal)}
.ver.ojo .tit{color:var(--ojo)} .ver.info .tit{color:var(--cel)}
.ver .det{margin-top:var(--s2);font-size:calc(15.5px * var(--fs));line-height:1.5}
.ver .num{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.ver ul{margin:var(--s2) 0 0;padding-left:20px;font-size:calc(15px * var(--fs))}
.ver li{margin-bottom:5px}
.btn-reg{
  margin-top:var(--s3);width:100%;min-height:46px;background:var(--sup);border:2px solid var(--ink);
  color:var(--ink);border-radius:var(--s1);font-size:calc(15px * var(--fs));font-weight:600;cursor:pointer;
}
.btn-reg[disabled]{opacity:.55;cursor:default}

.sol{list-style:none;padding:0}
.sol li{padding:10px 0 10px 26px;position:relative;font-size:calc(15.5px * var(--fs));
  border-bottom:1px solid var(--line2);line-height:1.45}
.sol li::before{content:"";position:absolute;left:6px;top:19px;width:8px;height:8px;
  background:var(--ink);transform:rotate(45deg)}
.cita{margin-top:var(--s5);padding:var(--s3) var(--s4);background:var(--sup);
  border-left:4px solid var(--ink);font-size:calc(14px * var(--fs));line-height:1.5;color:var(--ink2);
  border-radius:0 var(--s1) var(--s1) 0}
.cita b{color:var(--ink)}
.alerta{background:var(--mal-bg);border:1px solid var(--mal);border-radius:var(--s1);
  padding:var(--s3) var(--s4);margin-top:var(--s3);font-size:calc(15px * var(--fs));line-height:1.45}
.alerta b{color:var(--mal)}
.nota{background:var(--ojo-bg);border:1px solid var(--ojo);border-radius:var(--s1);
  padding:var(--s3) var(--s4);margin-top:var(--s3);font-size:calc(14.5px * var(--fs));line-height:1.45}
.info{background:var(--cel-bg);border:1px solid var(--cel);border-radius:var(--s1);
  padding:var(--s3) var(--s4);margin-top:var(--s3);font-size:calc(14.5px * var(--fs));line-height:1.45}

/* ---------- gráficos ---------- */
.graf{margin-top:var(--s3);background:var(--sup);border:1px solid var(--line);
  border-radius:var(--s1);padding:var(--s3);overflow-x:auto}
.graf svg{display:block;width:100%;height:auto;max-width:100%}
.graf .ley{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);margin-top:var(--s2);
  font-size:calc(12.5px * var(--fs));color:var(--ink2)}
.graf .ley span{display:flex;align-items:center;gap:6px}
.graf .ley i{width:11px;height:11px;border-radius:2px;display:block}
.ver .graf{background:rgba(255,255,255,.55);border-color:rgba(0,0,0,.12)}
html[data-tema="oscuro"] .ver .graf{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.14)}
.ver .det svg{display:block;width:100%;max-width:100%;height:auto;border-radius:8px;margin:10px 0}

/* tarjetas de resultado numérico */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--s2);margin-top:var(--s3)}
.kpi{background:var(--sup);border:1px solid var(--line);border-radius:var(--s1);padding:var(--s3)}
.kpi .k{font-size:calc(12px * var(--fs));color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;
  line-height:1.25}
.kpi .v{font-family:var(--mono);font-size:calc(23px * var(--fs));font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1.15;margin-top:3px}
.kpi .u{font-size:calc(13px * var(--fs));font-weight:400;color:var(--ink2);font-family:var(--sans)}
.kpi.ok .v{color:var(--ok)} .kpi.mal .v{color:var(--mal)} .kpi.ojo .v{color:var(--ojo)}
.ver .kpi{background:rgba(255,255,255,.6);border-color:rgba(0,0,0,.1)}
html[data-tema="oscuro"] .ver .kpi{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.14)}

/* ---------- cálculo ---------- */
.calc-lista{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s3)}
.calc-b{
  width:100%;background:var(--sup);border:1px solid var(--line);border-left:5px solid var(--amar-b);
  border-radius:var(--s1);padding:var(--s3) var(--s4);text-align:left;cursor:pointer;display:flex;
  align-items:center;gap:var(--s3);min-height:60px;box-shadow:var(--sombra);
}
.calc-b:active{background:var(--sup2)}
.calc-b .n{flex:1;min-width:0}
.calc-b b{display:block;font-size:calc(16px * var(--fs));font-weight:600;line-height:1.25}
.calc-b i{display:block;font-style:normal;font-size:calc(13px * var(--fs));color:var(--ink2);margin-top:2px}
.calc-b .fl{color:var(--ink3);font-size:calc(20px * var(--fs))}

/* ---------- informe ---------- */
.obra{background:var(--sup);border:1px solid var(--line);border-radius:var(--s1);padding:var(--s4);margin-top:var(--s3)}
.obra .campo label{color:var(--ink)}
.obra .entrada{background:var(--sup2);color:var(--ink);border-color:var(--line);font-family:var(--sans);
  font-size:calc(16px * var(--fs))}
.obra textarea.entrada{min-height:76px;resize:vertical}
.reg-item{background:var(--sup);border:1px solid var(--line);border-radius:var(--s1);
  padding:var(--s3) var(--s4);margin-bottom:var(--s2);font-size:calc(15px * var(--fs));
  border-left:5px solid var(--line)}
.reg-item.ok{border-left-color:var(--ok)} .reg-item.mal{border-left-color:var(--mal)}
.reg-item.ojo{border-left-color:var(--ojo)} .reg-item.info{border-left-color:var(--cel)}
.reg-item .h{font-weight:600;display:flex;gap:var(--s2);align-items:baseline}
.reg-item .h time{font-family:var(--mono);font-size:calc(12px * var(--fs));color:var(--ink2);margin-left:auto}
.reg-item .v{margin-top:4px;font-size:calc(14.5px * var(--fs))}
.reg-item .v.ok{color:var(--ok)} .reg-item .v.mal{color:var(--mal)}
.reg-item .v.ojo{color:var(--ojo)} .reg-item .v.info{color:var(--cel)}
.reg-item .m{font-family:var(--mono);font-size:calc(13px * var(--fs));color:var(--ink2);margin-top:3px;
  line-height:1.45;word-break:break-word}
.reg-item .acc{display:flex;gap:var(--s2);margin-top:var(--s2)}
.reg-item .acc button{background:none;border:1px solid var(--line);border-radius:var(--s1);
  padding:6px 10px;font-size:calc(13px * var(--fs));color:var(--ink2);cursor:pointer;min-height:36px}
.acciones{display:flex;gap:var(--s2);margin:var(--s3) 0;flex-wrap:wrap}
.acciones button{
  flex:1 1 45%;min-height:50px;border:2px solid var(--ink);background:var(--sup);color:var(--ink);
  border-radius:var(--s1);font-size:calc(15px * var(--fs));font-weight:600;cursor:pointer;
}
.acciones button.pri{background:var(--ink);color:var(--sup)}
.acciones button.peligro{border-color:var(--mal);color:var(--mal)}
.pie{margin-top:var(--s6);padding-top:var(--s4);border-top:1px solid var(--line);
  font-size:calc(13px * var(--fs));color:var(--ink2);line-height:1.5}
.pie b{color:var(--ink)}
.toast{
  position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:99;
  background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:var(--s1);
  font-size:calc(15px * var(--fs));box-shadow:0 6px 20px rgba(27,39,51,.35);max-width:90vw;text-align:center;
}

/* ---------- navegación inferior fija ---------- */
.nav-inf{
  position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  background:var(--sup);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-inf button{
  flex:1;min-height:60px;border:0;background:none;cursor:pointer;color:var(--ink2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:calc(11px * var(--fs));font-weight:600;padding:6px 2px;position:relative;
}
.nav-inf button svg{width:22px;height:22px;display:block}
.nav-inf button[aria-current="page"]{color:var(--ink)}
.nav-inf button[aria-current="page"]::before{
  content:"";position:absolute;top:0;left:18%;right:18%;height:3px;background:var(--amar-b);border-radius:0 0 3px 3px;
}
html[data-tema="oscuro"] .nav-inf button[aria-current="page"]::before{background:var(--amar)}
.nav-inf .badge{
  position:absolute;top:7px;left:50%;margin-left:5px;background:var(--mal);color:#fff;
  font-size:calc(10px * var(--fs));font-weight:700;border-radius:999px;padding:1px 5px;line-height:1.4;
  min-width:17px;text-align:center;font-family:var(--mono);
}

/* ---------- ajustes ---------- */
.seg{display:flex;gap:0;border:2px solid var(--ink);border-radius:var(--s1);overflow:hidden;margin-top:6px}
.seg button{
  flex:1;min-height:46px;border:0;background:var(--sup);color:var(--ink);cursor:pointer;
  font-size:calc(14.5px * var(--fs));font-weight:600;border-right:1px solid var(--line);
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sup)}
.aj{background:var(--sup);border:1px solid var(--line);border-radius:var(--s1);padding:var(--s4);margin-bottom:var(--s2)}
.aj > b{display:block;font-size:calc(15px * var(--fs))}
.aj > p{font-size:calc(13.5px * var(--fs));color:var(--ink2);margin-top:3px;line-height:1.4}

/* enlaces entre fichas */
.xref{background:transparent;border:1px solid currentColor;border-radius:5px;
  color:inherit;font:inherit;font-weight:600;font-size:.86em;padding:0 5px;margin:0 1px;
  cursor:pointer;line-height:1.5;vertical-align:baseline}
.xref:active{background:rgba(127,127,127,.25)}

.solo-print{display:none}
.tobra{width:100%;border-collapse:collapse;font-size:calc(14px * var(--fs))}
.tobra th{text-align:left;font-weight:600;padding:3px 12px 3px 0;vertical-align:top;white-space:nowrap;width:1%}
.tobra td{padding:3px 0;vertical-align:top}
.encab-print{border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
.encab-print span{display:block;font-size:11px;color:#444;margin-top:2px}

@media print{
  :root{--fs:0.92}
  body{background:#fff;color:#000;padding-bottom:0}
  .barra,.nav-inf,.buscar,.btn-eval,.btn-reg,.tri,.grilla,.toast,.acciones,.chips,.limpiar,
  #btnVolver,.fav,.reg-item .acc,.no-print{display:none!important}
  .ficha,.ver,.bloque,.cita,.reg-item,.graf,.kpi{border-color:#999;background:#fff;color:#000;break-inside:avoid}
  .obra{display:none!important}
  .solo-print{display:block!important}
  .reg-item{border-left-width:4px;margin-bottom:6px;padding:8px 10px}
  .bloque{margin-top:14px}
  .graf{padding:0;border:0;max-width:360px}
  .graf .ley{font-size:10px}
  .kpis{grid-template-columns:repeat(4,1fr);gap:4px}
  .kpi{padding:6px}
  .kpi .v{font-size:15px}
  h2{font-size:19px}
  .wrap{max-width:none;padding:0}
  a[href]:after{content:''}
}
/* ---------- lista de aparatos del tablero (K7) ---------- */
.apar{margin-top:6px}
.apar-lista{list-style:none;padding:0;margin:0 0 var(--s2)}
.apar-lista li{display:flex;align-items:center;gap:var(--s2);padding:6px 8px;background:rgba(255,255,255,.62);
  border:1px solid rgba(0,0,0,.18);border-radius:var(--s1);margin-bottom:5px;font-size:calc(13.5px * var(--fs));line-height:1.3}
.apar-lista li .d{flex:1;min-width:0}
.apar-lista li .w{font-family:var(--mono);font-weight:700;white-space:nowrap}
.apar-lista li button{background:none;border:0;color:#8A1E14;font-size:calc(19px * var(--fs));line-height:1;
  padding:0 2px;min-width:30px;min-height:30px}
.apar-alta{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.apar-alta label{display:block;font-size:calc(12.5px * var(--fs));font-weight:600;margin-bottom:3px}
.apar-alta .full{grid-column:1 / -1}
.apar-add{width:100%;min-height:42px;background:#1B2733;color:#fff;border:0;border-radius:var(--s1);
  font-size:calc(15px * var(--fs));font-weight:600}
.apar-add:active{filter:brightness(1.4)}
.apar-sum{margin-top:var(--s2);padding-top:6px;border-top:1px dashed rgba(0,0,0,.3);
  font-family:var(--mono);font-size:calc(14px * var(--fs));font-weight:700}
/* ---------- respaldo ---------- */
.resp{background:var(--sup2);border:1px solid var(--line);border-radius:var(--s1);
  padding:var(--s3) var(--s4);margin-top:var(--s2);font-size:calc(14px * var(--fs))}
.resp b{display:block;margin-bottom:4px}
</style>

(function(){

 {id:'uln', lbl:'Tensión L–N en la boca', u:'V'},
 {id:'ulpe', lbl:'Tensión L–PE en la boca', u:'V'},
 {id:'unpe', lbl:'Tensión N–PE en la boca', u:'V'}
], ev:function(v){
 if(v.up===null) return null;
 if(v.up < 50) return {e:'mal', t:'La falla está aguas arriba de la boca',
   d:'Con <span class="num">'+f(v.up)+' V</span> a la salida de la protección, el circuito no está alimentado. El problema está en el tablero o antes.',
   li:['Verificar que el interruptor esté realmente cerrado y no en posición intermedia de disparo: abrirlo por completo y volver a cerrarlo.','Medir entrada del interruptor contra neutro. Si ahí hay 230 V y a la salida no, el interruptor está fallado o el borne de salida está flojo o quemado.','Si tampoco hay tensión en la entrada, subir al diferencial y al principal.','Revisar el apriete de los bornes con el circuito sin tensión. Un borne flojo es la causa más frecuente y la que más recalienta.']};
 if(v.uln===null) return null;
 if(v.uln >= 190) return {e:'ojo', t:'La boca tiene tensión: la falla es del punto en adelante',
   d:'Llegan <span class="num">'+f(v.uln)+' V</span> a los bornes. El circuito está sano hasta acá.',
   li:['Revisar la llave de efecto: medir entre sus bornes con la llave cerrada. Debe dar 0 V. Si da 230 V, la llave está abierta internamente.','Revisar el módulo del tomacorriente: los de resorte flojo pierden contacto con la ficha aunque midan bien en vacío.','Probar el artefacto en otra boca antes de seguir buscando en la instalación.','Si es una luminaria, verificar el portalámparas y el retorno.']};
 if(v.ulpe!==null && v.ulpe >= 190 && v.uln < 50) return {e:'mal', t:'Neutro interrumpido',
   d:'La fase llega (<span class="num">'+f(v.ulpe)+' V</span> contra PE) pero L–N da <span class="num">'+f(v.uln)+' V</span>. El conductor neutro está cortado o desconectado entre el tablero y esta boca.',
   li:['Buscar el corte por bipartición: abrir la caja de paso intermedia y medir N–PE. Donde el neutro reaparece, el tramo sano quedó atrás.','Revisar primero las cajas de derivación y los empalmes. Un neutro compartido mal empalmado se corta antes que la fase porque casi siempre lleva más aprietes en serie.','Controlar la barra de neutro del tablero: tornillo flojo o borne oxidado.','Peligro: con el neutro abierto y una carga conectada, la boca queda a potencial de fase. No dar por seguro el conductor celeste.'],
   pel:true};
 if(v.uln < 50 && (v.ulpe===null || v.ulpe < 50)){
   if(v.unpe!==null && v.unpe >= 190) return {e:'mal', t:'Anomalía: el neutro está a potencial de fase',
     d:'L–N da <span class="num">'+f(v.uln)+' V</span> pero N–PE da <span class="num">'+f(v.unpe)+' V</span>. Los dos conductores activos de la boca están al mismo potencial y ese potencial es el de fase.',
     li:['Hay una permutación o un puente indebido: en algún punto el conductor que llega al borne de neutro está tomado de una fase.','Desconectar el circuito y verificar continuidad de cada conductor hasta el tablero, uno por vez, con el Fluke en Ω.','No energizar de nuevo hasta corregirlo: cualquier carga que se conecte queda con las dos patas en fase.'],
     pel:true};
   return {e:'mal', t:'Fase interrumpida',
     d:'No hay tensión contra ninguna referencia en la boca, y sí la hay en el tablero. El conductor de fase está cortado o desconectado en el tramo.',
     li:['Sin tensión y con el circuito seccionado, medir continuidad con el Fluke en Ω entre el borne de salida de la protección y el borne de la boca.','Aplicar bipartición: ir a la caja intermedia y repetir. Cada medición divide el tramo sospechoso a la mitad.','Revisar empalmes y bornes de las llaves de efecto en el camino: un retorno abierto deja sin fase toda la derivación siguiente.','Si el conductor está cortado dentro del caño, no se repara con empalme escondido: se pasa un conductor nuevo, 771.13 exige empalmes accesibles en caja.']};
 }
 return {e:'ojo', t:'Tensión anómala en la boca',
   d:'L–N mide <span class="num">'+f(v.uln)+' V</span>, un valor que no es ni tensión plena ni ausencia de tensión.',
   li:['Repetir la medición con LoZ activado en el Fluke. Si cae a casi cero era tensión fantasma y el conductor en realidad está abierto.','Si con LoZ se mantiene, hay una carga en serie o un conductor con contacto parcial: buscar el borne flojo o el empalme oxidado.','Medir la caída con el circuito cargado: un contacto parcial se delata porque la tensión se hunde al conectar carga.']};
}},
sol:['Reapretar todo borne intervenido con el circuito sin tensión y verificar después con la cámara bajo carga.','Reemplazar módulos de tomacorriente cuyos contactos ya no sujeten la ficha, no repararlos.','Todo empalme queda dentro de caja y accesible, con borne o conector, nunca retorcido y cintado dentro del caño.','Antes de restablecer, verificar continuidad de PE en la boca reparada.'],
cita:'AEA 90364-7-771, 771.23.6 y 7-770, 770.19.6: la actuación sin causa conocida de los dispositivos de protección obliga a una revisión detallada de la instalación antes de restablecer el servicio. 771.23.3.1 d) exige que línea, neutro y protección estén cada uno en el borne destinado a tal fin.'
});

F.push({
id:'A2', fam:'alim', t:'No hay tensión en toda la instalación',
sint:'Se cortó todo. Ninguna protección del tablero parece disparada, o disparó el principal y no rearma.',
causas:['Corte de la distribuidora o fusible de acometida abierto','Interruptor principal o diferencial general disparado','Neutro de acometida flojo o cortado','Termomagnética principal fallada internamente','Falla franca aguas abajo que mantiene el disparo'],
eq:[EQ.ut219, EQ.f117v],
pasos:[
 'Confirmar con el vecino o con la vía pública si el corte es general. Ahorra media hora.',
 'Con el UT-219p (CAT IV, el que corresponde en acometida) medir entre bornes de entrada del medidor o de la caja de toma: fase contra neutro y fase contra tierra.',
 'Medir la misma tensión a la salida del medidor y a la entrada del interruptor principal.',
 'Si hay tensión en la entrada del principal, abrirlo y cerrarlo completo; medir a la salida.',

],
med:{campos:[
 {id:'uacom', lbl:'Tensión L–N en la acometida o entrada del medidor', u:'V'},
 {id:'uent', lbl:'Tensión L–N en la entrada del interruptor principal', u:'V'},
 {id:'usal', lbl:'Tensión L–N en la salida del interruptor principal', u:'V'},
 {id:'sostiene', lbl:'¿El principal sostiene con todos los circuitos abiertos?', tipo:'bool'}
], ev:function(v){
 if(v.uacom===null) return null;

   d:'La acometida mide <span class="num">'+f(v.uacom)+' V</span>. El problema está fuera de la instalación del cliente.',
   li:['Verificar el fusible o el limitador de la caja de toma si es accesible y está dentro de la incumbencia.','Reclamar a la distribuidora y dejar registrado el número de reclamo.','Antes de irse: dejar el tablero seguro y avisar que al volver la tensión conviene revisar equipos electrónicos.']};
 if(v.uent!==null && v.uent < 50) return {e:'mal', t:'Se pierde la tensión entre el medidor y el tablero',
   d:'Hay <span class="num">'+f(v.uacom)+' V</span> en la acometida y <span class="num">'+f(v.uent)+' V</span> en la entrada del principal.',
   li:['Revisar la línea de alimentación del medidor al tablero y sus bornes intermedios.','Prestar especial atención al neutro: si el que se abrió es el neutro, contra tierra puede seguir midiendo casi 230 V y confundir.','Con el circuito seccionado, verificar continuidad de cada conductor del tramo.','Revisar el apriete: en esa línea circula toda la corriente de la instalación y es donde más recalienta un borne flojo.']};
 if(v.usal!==null && v.usal < 50 && v.uent >= 190){
   if(v.sostiene===false) return {e:'mal', t:'Hay una falla franca aguas abajo',
     d:'Con todos los circuitos abiertos el principal no sostiene: la falla está en la propia cabecera del tablero.',
     li:['Revisar el cableado interno del tablero entre el principal y las barras: un conductor pellizcado contra el gabinete metálico es lo más común.','Verificar la barra de neutro contra la de PE: si están unidas y el esquema es TT, hay un puente indebido.','Medir aislación del tramo con el UT-511 en 500 V antes de volver a cerrar.']};
   return {e:'mal', t:'El interruptor principal no entrega tensión',
     d:'Entra <span class="num">'+f(v.uent)+' V</span> y sale <span class="num">'+f(v.usal)+' V</span>.',
     li:['Abrirlo por completo y volver a cerrarlo: puede haber quedado en posición intermedia de disparo.','Si sigue sin entregar tensión con todos los circuitos abiertos, el interruptor está fallado y se reemplaza.','Antes de reemplazarlo, revisar por qué se dañó: casi siempre hay un borne flojo o una falla repetida atrás.']};
 }
 if(v.sostiene===false) return {e:'mal', t:'Hay tensión pero algo mantiene el disparo',
   d:'Cerrar los circuitos de a uno y observar cuál produce el disparo.',
   li:['Cerrar uno por vez y esperar. Si dispara al instante, es cortocircuito o falla franca a tierra en ese circuito.','Si dispara después de un rato, es sobrecarga: medir corriente con la pinza.','Sobre el circuito señalado, medir aislación con el UT-511 antes de rearmar.']};
 return {e:'ok', t:'La cabecera está sana',
   d:'Llega tensión y el principal sostiene. El problema es de un circuito en particular.',
   li:['Cerrar los circuitos de a uno para identificar cuál falla.','Seguir con la ficha que corresponda: A1 si un circuito quedó sin tensión, P1 a P3 si dispara la térmica, D1 si dispara el diferencial.']};
}},
sol:['Reapretar bornes de la cabecera con torquímetro o al menos con la llave adecuada, nunca con pinza.','Dejar identificado el tablero y verificar que el neutro y el PE estén en barras separadas si el esquema es TT.','Documentar el evento: un principal que dispara sin causa conocida obliga a revisión antes de restablecer.'],
cita:'AEA 90364-7-771, 771.23.6 · 7-770, 770.19.6. En esquema TT las barras de neutro y de protección van separadas (771.18).'
});

F.push({
id:'A3', fam:'alim', t:'Tensión baja en la boca — caída de tensión',
sint:'Las luces bajan cuando arranca un motor o un equipo. Los aparatos calientan más de lo normal o rinden menos.',
causas:['Sección de conductor insuficiente para la longitud del circuito','Longitud real mayor que la de proyecto','Bornes flojos u oxidados que suman resistencia','Circuito sobrecargado con cargas que no le correspondían','Caída ya presente en la acometida (problema de la distribuidora)'],
eq:[EQ.f117v, EQ.ut204],
pasos:[
 'Poner el circuito en su condición más desfavorable: todas las cargas habituales encendidas y en régimen.',
 'Medir con el Fluke la tensión en el origen (borne de salida de la protección en el tablero) y anotarla.',
 'Medir la tensión en la boca más alejada del mismo circuito, sin apagar nada.',
 'Con el UT-204+ medir la corriente que está circulando por ese circuito en ese momento.',
 'Cargar los valores. La caída se evalúa contra el 3 % que fija la reglamentación.'
],
med:{campos:[
 {id:'uo', lbl:'Tensión en el origen del circuito, en el tablero', ayuda:'Con las cargas encendidas', u:'V'},
 {id:'uc', lbl:'Tensión en la boca más desfavorable', u:'V'},
 {id:'ic', lbl:'Corriente del circuito en ese momento', u:'A'},
 {id:'tipo', lbl:'Tipo de carga del circuito', tipo:'sel', opts:[['gen','Uso general (luz, tomas)'],['mot','Motor en régimen'],['arr','Motor durante el arranque']]}
], ev:function(v){
 if(v.uo===null||v.uc===null) return null;
 if(!(v.uo>0)) return null;
 var d = v.uo - v.uc, p = d/v.uo*100;
 var lim = v.tipo==='arr' ? 15 : (v.tipo==='mot' ? 5 : 3);
 var etq = v.tipo==='arr' ? 'arranque de motor' : (v.tipo==='mot' ? 'motor en régimen' : 'uso general');
 var base = 'Caída medida <span class="num">'+f(d)+' V</span> = <span class="num">'+f(p,2)+' %</span> sobre los '+f(v.uo)+' V medidos en el tablero. Límite para '+etq+': <span class="num">'+lim+' %</span>.';
 if(p <= lim) return {e:'ok', t:'La caída de tensión verifica', d:base,
   li:['Si el usuario igual percibe parpadeo, mirar la fluctuación durante el arranque, no el régimen.','Comparar contra la caída calculada en la planilla de cargas: si la medida es bastante mayor, hay resistencia de contacto acumulada aunque el total verifique.']};
 return {e:'mal', t:'La caída de tensión supera el límite', d:base,
   li:['Primero descartar lo barato: reapretar todos los bornes del circuito, del tablero a la boca. Una caída que baja mucho al reapretar era resistencia de contacto, no sección.','Con <span class="num">'+(v.ic!==null?f(v.ic)+' A':'la corriente medida')+'</span> circulando, calcular la resistencia aparente del tramo: R = ΔU / I'+(v.ic? ' = '+f(d/v.ic,3)+' Ω':'')+'. Compararla con la resistencia teórica del conductor por su longitud y sección.','Si la resistencia medida es mucho mayor que la teórica, hay un punto caliente: recorrer con la cámara bajo carga.','Si coincide con la teórica, el conductor está subdimensionado para la longitud: aumentar sección o dividir el circuito.','Verificar también la caída en el seccional: la del circuito terminal se suma a la del alimentador.']};
}},
sol:['Reapretar y, si hay borne quemado, reemplazar el aparato completo, no sólo el tornillo.','Aumentar la sección del tramo o desdoblar el circuito para repartir la carga.','Si el motor arranca mal, verificar por separado la caída durante el arranque: el límite ahí es 15 %.','Recalcular en la planilla de cargas con la longitud real medida, no con la de proyecto.'],
cita:'AEA 90364-7-771 y 7-770: caída de tensión total admisible 3 % desde el origen. Para motores se admite 5 % en régimen y 15 % durante el arranque.'
});

F.push({
id:'A4', fam:'alim', t:'Sobretensión o subtensión permanente',
sint:'Las lámparas duran poco, las fuentes se queman, o al revés: todo funciona con poca fuerza. La tensión está fuera de rango sin carga.',
causas:['Tensión entregada por la distribuidora fuera de tolerancia','Neutro de acometida con mala conexión (una fase sube y la otra baja)','Desbalance fuerte entre fases en un suministro trifásico','Transformador de la zona con relación mal ajustada'],
eq:[EQ.f117v, EQ.ut219],
pasos:[
 'Medir en el tablero principal, con la instalación en condición normal de uso.',
 'Anotar la tensión en cada fase disponible contra neutro y, si es trifásico, entre fases.',
 'Volver a medir con la mayor parte de la carga apagada. Si al descargar la tensión se recompone mucho, hay caída en la acometida, no sobretensión de red.',
 'Si es trifásico y una fase sube mientras otra baja, sospechar del neutro de acometida antes que de la distribuidora.'
],
med:{campos:[
 {id:'u1', lbl:'Tensión fase–neutro, fase 1', u:'V'},
 {id:'u2', lbl:'Fase 2 (dejar vacío si es monofásico)', u:'V'},
 {id:'u3', lbl:'Fase 3 (dejar vacío si es monofásico)', u:'V'}
], ev:function(v){
 if(v.u1===null) return null;
 var us=[v.u1,v.u2,v.u3].filter(function(x){return x!==null});
 var mx=Math.max.apply(null,us), mn=Math.min.apply(null,us);
 var sup=253, inf=207; // ±10 % de 230 V, referencia práctica
 var disp = us.length>1 ? mx-mn : 0;
 var txt='Máxima <span class="num">'+f(mx)+' V</span>'+(us.length>1?', mínima <span class="num">'+f(mn)+' V</span>, dispersión <span class="num">'+f(disp)+' V</span>':'')+'. Referencia práctica: 207 a 253 V (±10 % de 230 V).';
 if(us.length>1 && disp > 15) return {e:'mal', t:'Fuerte desbalance de tensión entre fases', d:txt,
   li:['Una fase alta con otra baja es la firma del neutro de acometida flojo o corroído. Verificarlo antes que nada: es peligroso y quema equipos.','Con la pinza, medir la corriente de neutro y compararla con las de fase (ver ficha B1 y B2).','Si el neutro está sano, repartir mejor las cargas monofásicas entre fases.','Si el desbalance persiste sin carga propia que lo explique, es de la red: reclamar a la distribuidora.'], pel:true};
 if(mx > sup) return {e:'mal', t:'Sobretensión', d:txt,
   li:['Registrar fecha, hora y valor. La distribuidora responde por daños si la tensión está fuera del rango contractual.','Medir en varios momentos del día: la sobretensión típica de barrio aparece de madrugada, con poca demanda.','Mientras tanto, proteger los equipos sensibles con protector de sobretensión permanente en el tablero.','Verificar que no haya neutro flojo propio antes de atribuirlo a la red.']};
 if(mn < inf) return {e:'ojo', t:'Subtensión', d:txt,
   li:['Repetir la medición con la instalación descargada. Si se recompone, la caída es propia: seguir con la ficha A3.','Si con todo apagado sigue baja, el problema es la acometida o la red.','Revisar el apriete de los bornes de acometida y del medidor a la vista.']};
 return {e:'ok', t:'La tensión está dentro del rango habitual', d:txt,
   li:['Si el usuario reporta lámparas que se queman, ver la ficha G4: el problema puede ser térmico o de calidad de la lámpara, no de tensión.','Si el síntoma es intermitente, dejar un registrador o repetir la medición en el horario en que ocurre.']};
}},
sol:['Corregir primero cualquier neutro flojo propio: es la causa que más daño hace y la más barata de arreglar.','Instalar protección contra sobretensiones permanentes en el tablero si la red de la zona es inestable.','Documentar las mediciones con fecha y hora para el reclamo a la distribuidora.'],
cita:'El rango contractual de tensión lo fija el ente regulador y la distribuidora; el ±10 % usado acá es una referencia práctica de campo, no un valor de la AEA 90364.'
});

F.push({

 return {e:'ojo', t:'Tensión parcial: hay una carga o una resistencia en serie', d:txt+' Ni se derrumba ni se sostiene en valor pleno.',

}},

cita:'La tensión fantasma es un efecto de acople capacitivo, no una condición de la instalación; la función LoZ del Fluke 117 la elimina bajando la impedancia de entrada.'

F.push({
id:'A6', fam:'alim', t:'Neutro abierto o flojo',
sint:'Las tensiones cambian solas al encender o apagar cargas. Luces que brillan más en una habitación cuando se enciende algo en otra. Equipos que se queman sin explicación.',
causas:['Borne de neutro flojo en la barra del tablero','Neutro de acometida corroído o mal apretado','Empalme de neutro retorcido y oxidado en caja de paso','Neutro compartido entre circuitos, cortado en un punto intermedio'],
eq:[EQ.f117v, EQ.ut204, EQ.ir],
pasos:[
 'Medir N–PE en el tablero y en la boca afectada, con la instalación cargada normalmente.',
 'Encender una carga apreciable en el circuito y volver a medir N–PE. Si la tensión sube claramente, el neutro tiene resistencia.',
 'Medir la corriente de neutro con la pinza en la barra o en el conductor de neutro del circuito.',
 'Recorrer los bornes de neutro con la cámara bajo carga: el borne flojo es el punto caliente.'

med:{campos:[
 {id:'npe0', lbl:'Tensión N–PE sin carga', u:'V'},
 {id:'npe1', lbl:'Tensión N–PE con la carga encendida', u:'V'},
 {id:'inp', lbl:'Corriente por el neutro en ese momento', u:'A'}
], ev:function(v){
 if(v.npe1===null) return null;
 var salto = (v.npe0!==null) ? v.npe1-v.npe0 : null;

     li.push('La aislación del circuito señalado está en <span class="num">'+f(v.ais,2)+' MΩ</span>, por encima del mínimo. La falla puede estar en un aparato conectado y no en el cableado: desenchufar todo de ese circuito y volver a probar.');

F.push({

eq:[EQ.ut511],

],
med:{campos:[

   li.push('Medido todo el circuito de una vez, los '+tramos+' tramos quedan en paralelo y el valor baja aunque cada tramo esté sano: como referencia, '+f(lim/tramos,3)+' MΩ en el conjunto equivalen a '+f(lim,2)+' MΩ por tramo. Es una equivalencia de cálculo, no un límite que la Reglamentación autorice: el criterio de aceptación es cada circuito contra la tabla. Para el detalle, ver el cálculo K10.');

F.push({

F.push({

causas:['Verificación programada','Instalación nueva antes de la puesta en servicio','Sospecha de jabalina seca, corroída o desconectada','Después de una obra que pudo afectar el electrodo'],
eq:[EQ.telu],
pasos:[
 'Desconectar el electrodo de la instalación: el borne de medición o la caja de inspección de la jabalina existe justamente para esto. Sin desconectarlo se mide el paralelo con otras tierras y da un valor falsamente bajo.',

 {id:'ibat', lbl:'Corriente que toma la batería de condensadores', ayuda:'Dejar vacío si no hay batería', u:'A'},
 {id:'inom', lbl:'Corriente nominal de la batería', u:'A'}
], ev:function(v){
 if(v.fp===null) return null;
 var d='Factor de potencia medido: <span class="num">'+f(v.fp,3)+'</span>. Umbral habitual de penalización de las distribuidoras: 0,95.';
 var li=[];
 if(v.ibat!==null && v.inom!==null && v.inom>0){
   var rb=v.ibat/v.inom;
   d+=' La batería toma <span class="num">'+f(v.ibat)+' A</span> de <span class="num">'+f(v.inom)+' A</span> nominales = <span class="num">'+f(rb*100,0)+' %</span>.';
   if(rb<0.7) li.push('La batería toma mucho menos de lo nominal: hay capacitores agotados o escalones que no enganchan. Verificar escalón por escalón, midiendo la corriente de cada uno con el regulador forzado en manual.');
   else li.push('La batería toma una corriente coherente con su capacidad nominal.');
 }
 if(v.fp < 0.95){
   li.unshift('El factor de potencia está por debajo del umbral habitual de penalización.');
   li.push('Si no hay compensación, dimensionar una batería con la potencia reactiva que resulte de la medición. Conviene medir a lo largo de un día antes de dimensionar: el reactivo varía con la actividad.','Si hay batería, revisar capacitores, contactores y regulador antes de agrandarla.','Verificar si hay motores muy sobredimensionados trabajando en vacío: un motor al 20 % de su carga tiene un factor de potencia muy pobre y la solución es cambiar el motor, no compensar.','Atención con la compensación en instalaciones con muchos armónicos: los capacitores pueden entrar en resonancia con la red y sobrecargarse. En ese caso corresponde compensación con reactor de desintonía.');
   return {e:'mal', t:'Factor de potencia por debajo del umbral', d:d, li:li};
 }
 li.unshift('El factor de potencia está por encima del umbral habitual de penalización.');
 li.push('Si igual hay penalización en la factura, verificar el período y el criterio de medición de la distribuidora: la penalización se calcula sobre el consumo del período, no sobre una medición puntual.','Repetir la medición en distintos horarios para tener el panorama del día.');
 return {e:'ok', t:'Factor de potencia adecuado', d:d, li:li};
}},
sol:['Reemplazar los capacitores agotados y los contactores que no enganchan antes de ampliar la batería.','Dimensionar la compensación con mediciones a lo largo de la jornada, no con un valor puntual.','Evaluar reactores de desintonía si la instalación tiene contenido armónico importante.','Revisar los motores sobredimensionados: el mejor reactivo es el que no se genera.'],
cita:'El umbral de penalización por factor de potencia y su forma de cálculo los fija el ente regulador y la distribuidora, no la AEA 90364.'
});

F.push({
id:'B5', fam:'tab', t:'Tablero sin identificación ni esquema unifilar',
sint:'Nadie sabe qué corta cada llave. Ante una falla se pierde media hora sólo en identificar el circuito.',
causas:['Tablero ejecutado sin documentación','Ampliaciones sucesivas sin actualizar el esquema','Etiquetas caídas o ilegibles','Cambio de uso del inmueble'],
eq:[EQ.ut204, EQ.f117v],
pasos:[
 'Relevar circuito por circuito: abrir uno, recorrer el inmueble y anotar qué quedó sin tensión. Es lento pero se hace una sola vez.',
 'Anotar para cada circuito: calibre, curva, IΔn del diferencial que lo protege, sección del conductor, y qué alimenta.',
 'Medir la corriente de cada circuito en actividad normal y anotarla.',
 'Confeccionar el esquema unifilar y dejarlo dentro del tablero, plastificado.',
 'Etiquetar cada interruptor con una identificación que sirva a quien no conoce la instalación.'
],
med:{campos:[
 {id:'ncirc', lbl:'Cantidad de circuitos del tablero', u:''},
 {id:'nid', lbl:'Cantidad de circuitos ya identificados y verificados', u:''},
 {id:'uni', lbl:'¿Hay esquema unifilar dentro del tablero?', tipo:'bool'}
], ev:function(v){
 if(v.ncirc===null) return null;
 var nid=v.nid||0;
 var d='<span class="num">'+f(nid,0)+'</span> de <span class="num">'+f(v.ncirc,0)+'</span> circuitos identificados y verificados.';
 var li=[];
 if(v.uni===false) li.push('Falta el esquema unifilar dentro del tablero. Es documentación exigible y, en la práctica, es lo que hace que la próxima falla se resuelva en minutos en vez de en horas.');
 if(nid < v.ncirc){

 }
 li.push('El relevamiento está completo. Volcarlo al unifilar y a las etiquetas.','Dejar además la planilla de cargas actualizada con lo relevado: secciones, longitudes, calibres y corrientes medidas.','Entregar copia al usuario y dejar copia dentro del tablero.');
 return {e: v.uni===false?'ojo':'ok', t: v.uni===false?'Relevamiento completo, falta el unifilar':'Tablero identificado y documentado', d:d, li:li};
}},
sol:['Etiquetar cada interruptor con una identificación clara y durable.','Dejar el esquema unifilar dentro del tablero, plastificado y actualizado.','Volcar el relevamiento a la planilla de cargas.','Entregar copia de la documentación al usuario.'],
cita:'AEA 90364-7-771, Anexo de documentación técnica y 771.22: los materiales deben disponerse de forma que permitan operación, prueba, inspección, mantenimiento y reparación. La documentación del tablero es parte de la instalación.'
});

F.push({
id:'B6', fam:'tab', t:'Iluminación de emergencia que no funciona',
sint:'En un local de pública concurrencia, los artefactos de emergencia no encienden al cortar la alimentación, o duran unos minutos.',
causas:['Baterías agotadas por antigüedad','Artefactos que nunca se ensayaron','Circuito de carga sin alimentación permanente','Cantidad o ubicación de artefactos insuficiente','Artefactos alimentados desde un circuito que se corta con la llave general de iluminación'],
eq:[EQ.f117v, EQ.ut204],
pasos:[
 'Verificar que cada artefacto tenga alimentación permanente para la carga: medir tensión en su borne de alimentación con la iluminación general apagada.',
 'Cortar la alimentación general y verificar que todos enciendan.',

 if(v.auto!==null && v.auto < 60){ mal=true; li.push('La autonomía medida es de '+f(v.auto,0)+' minutos. Verificar la autonomía exigida para el tipo de local contra la 7-718 y la reglamentación local de habilitación: si no llega, reemplazar las baterías.'); }
 li.push('Dejar el ensayo asentado con fecha, cantidad de artefactos, cuáles fallaron y la autonomía medida. En un local de pública concurrencia ese registro es lo que se pide en la inspección.','Con el equipamiento disponible no se puede verificar el nivel de iluminación alcanzado: haría falta un luxómetro. Dejarlo aclarado en el informe.','Verificar la ubicación de los artefactos respecto de las vías de evacuación, las salidas y los cambios de nivel.');
 if(mal) return {e:'mal', t:'La iluminación de emergencia no cumple', d:d, li:li};
 return {e:'ok', t:'Los artefactos responden correctamente', d:d,

}},
sol:['Reemplazar baterías y artefactos que no respondan.','Corregir la alimentación permanente de los que no cargan.','Verificar cantidad, ubicación y autonomía contra la 7-718 y la reglamentación de habilitación del local.','Dejar el registro del ensayo con fecha, para la inspección.'],

});

F.push({
id:'L1', fam:'loc', t:'Cámara de frío, heladera exhibidora o freezer',
sint:'El equipo dispara la protección, no llega a temperatura, o el compresor arranca y se corta a los segundos. En un local, cada hora sin frío es mercadería.',
causas:['Caída de tensión excesiva durante el arranque del compresor','Compresor con el bobinado degradado o con fuga a masa','Protector térmico del compresor que corta por sobrecarga mecánica','Condensador sucio o ventilador parado: el compresor trabaja contra presión alta','Capacitor de arranque agotado en equipos monofásicos','Equipo compartiendo circuito con otras cargas'],
eq:[EQ.f117v, EQ.ut204, EQ.ut251, EQ.ut511, EQ.ir],
pasos:[
 'Antes de tocar la parte eléctrica: mirar el condensador y el ventilador. Un condensador tapado de grasa o pelusa hace que el compresor trabaje contra presión alta, tome más corriente y corte por térmico. Es la causa más frecuente y la más barata.',
 'Medir la tensión en los bornes del equipo en reposo y durante el intento de arranque. La caída en el arranque es la que decide.',
 'Medir la corriente en régimen con el UT-204+ y compararla con la de chapa del compresor.',
 'Medir la fuga con el UT-251A, abrazando fase y neutro juntos del cable de alimentación del equipo solo.',
 'Con el equipo desconectado y sin tensión, medir la aislación entre las patas de la ficha unidas y la carcasa, con el UT-511 a 500 V.',
 'Con la cámara, medir la temperatura de la bornera del equipo y del borne en el tablero: en un consumo permanente el borne flojo se delata rápido.',
 'El UT-204+ no tiene INRUSH, así que la corriente de arranque no se captura: el diagnóstico de la alimentación se hace por la caída de tensión.'
],
med:{campos:[
 {id:'ur', lbl:'Tensión en bornes del equipo en reposo', u:'V'},
 {id:'ua', lbl:'Tensión en bornes durante el arranque del compresor', u:'V'},
 {id:'ireg', lbl:'Corriente en régimen', u:'A'},
 {id:'ichapa', lbl:'Corriente nominal de chapa del compresor', u:'A'},
 {id:'ifug', lbl:'Fuga del equipo medido solo', u:'mA'},
 {id:'ais', lbl:'Aislación del equipo, patas contra carcasa (500 V)', u:'MΩ'},
 {id:'propio', lbl:'¿El equipo tiene circuito y diferencial propios?', tipo:'bool'}
], ev:function(v){
 var li=[], e='ojo', t='Continuar el diagnóstico', d='';
 if(v.ais!==null && v.ais<0.5) return {e:'mal', t:'El compresor tiene falla de aislación',
   d:'Aislación patas–carcasa <span class="num">'+f(v.ais,2)+' MΩ</span>, por debajo del mínimo de 0,5 MΩ a 500 V.',
   li:['El equipo hace fuga a masa. Sacarlo de servicio: además de disparar el diferencial, la carcasa metálica queda accesible al público.','Si el equipo estuvo parado en ambiente húmedo, a veces recupera secando el motocompresor; volver a medir después. Si no recupera, el compresor se reemplaza.','Verificar que la boca tenga PE con continuidad antes de volver a conectar: en una heladera exhibidora la carcasa está al alcance de cualquiera.'], pel:true};
 if(v.ur!==null && v.ua!==null){
   var du=v.ur-v.ua, p=(v.ur>0)?du/v.ur*100:0;
   d+='Tensión en reposo <span class="num">'+f(v.ur)+' V</span>, en el arranque <span class="num">'+f(v.ua)+' V</span>: cae <span class="num">'+f(du)+' V</span> = <span class="num">'+f(p,1)+' %</span> (límite en arranque 15 %). ';
   if(p>15){ e='mal'; t='La alimentación no soporta el arranque';
     li.push('La caída en el arranque supera el 15 %. El compresor no alcanza el par para vencer la presión y el protector térmico lo corta: el equipo "arranca y se corta" sin tener nada roto.','Aumentar la sección del circuito o acortar el recorrido. Reapretar todos los bornes del camino: con la corriente de arranque, una resistencia de contacto pesa mucho más que en régimen.','Si el equipo comparte circuito con otras cargas, darle circuito propio. Es la solución más directa en un local.'); }
   else li.push('La caída en el arranque está dentro del 15 %: la alimentación no es el problema.');
 }
 if(v.ireg!==null && v.ichapa!==null && v.ichapa>0){
   var rc=v.ireg/v.ichapa;
   d+='Corriente en régimen <span class="num">'+f(v.ireg)+' A</span> sobre <span class="num">'+f(v.ichapa)+' A</span> de chapa = <span class="num">'+f(rc*100,0)+' %</span>. ';
   if(rc>1.15){ e='mal'; t='El compresor toma más corriente de la nominal';
     li.push('Con '+f(rc*100,0)+' % del nominal el compresor está trabajando forzado. Antes de condenarlo: limpiar el condensador, verificar que el ventilador gire y que haya espacio de ventilación alrededor del equipo.','Si después de limpiar la corriente no baja, el circuito frigorífico tiene problema (carga de gas, válvula, obstrucción) o el compresor está degradado. Eso ya es del técnico en refrigeración.','Si es trifásico, verificar las tres corrientes: con una fase faltante las otras dos suben mucho. Ver ficha B3.'); }
   else if(rc<0.35) li.push('La corriente es muy baja para el nominal: el compresor no está arrancando. En monofásico, el capacitor de arranque agotado es el primer sospechoso; también el relé de arranque o el protector térmico abierto.');
   else li.push('La corriente en régimen es coherente con la de chapa.');
 }
 if(v.ifug!==null){
   d+='Fuga del equipo <span class="num">'+f(v.ifug,1)+' mA</span>. ';
   if(v.ifug>15){ if(e!=='mal'){e='mal'; t='Fuga alta del equipo';}
     li.push('La fuga del equipo solo es alta: aunque la aislación en continua dé aceptable, en servicio está aportando lo suficiente para hacer disparar un diferencial de 30 mA compartido.','Darle circuito y diferencial propios, y revisar el equipo.'); }
   else if(v.ifug>8) li.push('Fuga apreciable. Sumada al resto del local puede completar el disparo: conviene darle diferencial propio.');
 }
 if(v.propio===false) li.push('El equipo no tiene circuito ni diferencial propios. En un local comercial esto se resuelve siempre: la cámara de frío es la carga que no puede quedar apagada por una falla en un enchufe del salón, y es la que más aporta a la fuga y a la corriente de arranque.');
 if(!d && !li.length) return null;
 if(e==='ojo' && !li.length) li.push('Cargar más lecturas para cerrar el diagnóstico.');
 return {e:e, t:t, d:d, li:li};
}},
sol:['Limpiar condensador y verificar el ventilador antes de intervenir la parte eléctrica: resuelve la mayoría de los casos.','Dar circuito, protección y diferencial propios al equipo de frío. Es continuidad de servicio y también seguridad.','Corregir sección y aprietes si la caída en el arranque supera el 15 %.','Reemplazar el capacitor de arranque agotado en equipos monofásicos.','Sacar de servicio y reparar el compresor con aislación por debajo del mínimo.','Verificar el PE de la boca: la carcasa está al alcance del público.'],
cita:'AEA 90364-7-771 y 7-770: caída de tensión admisible en motores, 5 % en régimen y 15 % durante el arranque. Aislación mínima 0,5 MΩ para ensayo a 500 V (Tabla 771.23.I). 771.17.3.2: los interruptores automáticos no son aplicables a la protección contra sobrecarga de motores; corresponde guardamotor o relé térmico.'
});

F.push({
id:'L2', fam:'loc', t:'Cartel luminoso, marquesina o iluminación de vidriera',
sint:'El cartel se apaga solo, dispara el diferencial cuando llueve, tiene sectores apagados, o los drivers se queman seguido.',
causas:['Ingreso de agua por caja, prensacables o perfil, con grado IP inadecuado','Aislación degradada del tramo a la intemperie','Drivers de LED trabajando dentro del perfil sin ventilación','Alimentación tomada del circuito de iluminación del salón, sin circuito propio','Fuga capacitiva acumulada de muchos drivers','Conductor común para exterior en lugar del apto para intemperie'],
eq:[EQ.ut511, EQ.ut251, EQ.ir],
pasos:[
 'Seccionar el circuito del cartel y verificar ausencia de tensión.',

 'Mojar la zona sospechosa —caja de conexión, entrada del perfil, prensacables— esperar unos minutos y repetir la medición.',

 'Revisar el grado IP de cada elemento a la intemperie y el estado de las juntas.'
],
med:{campos:[
 {id:'aseco', lbl:'Aislación en seco, con los drivers desconectados (500 V)', u:'MΩ'},
 {id:'amoj', lbl:'Aislación con la zona mojada', u:'MΩ'},
 {id:'ifug', lbl:'Fuga del cartel en servicio', u:'mA'},
 {id:'idn', lbl:'IΔn del diferencial que lo protege', tipo:'sel', opts:[['30','30 mA'],['100','100 mA'],['300','300 mA']]},
 {id:'tdrv', lbl:'Temperatura de los drivers en régimen', u:'°C'},
 {id:'propio', lbl:'¿El cartel tiene circuito propio?', tipo:'bool'}
], ev:function(v){
 var li=[], e='ok', t='', d='';
 if(v.aseco!==null){ d+='Aislación en seco <span class="num">'+f(v.aseco,2)+' MΩ</span>'+(v.amoj!==null?', mojada <span class="num">'+f(v.amoj,2)+' MΩ</span>':'')+' (mínimo 0,5 MΩ a 500 V). ';
   if(v.aseco<0.5){ e='mal'; li.push('La aislación no cumple ni en seco: la falla es permanente, no depende de la lluvia. Localizar el tramo por bipartición (ficha I2) y reemplazarlo.'); }
   else if(v.amoj!==null && (v.amoj<0.5 || v.amoj < v.aseco*0.5)){ e='mal'; li.push('La aislación se derrumba al mojar: el punto de ingreso de agua quedó identificado en la zona ensayada. Abrir, secar y reemplazar el elemento que dejó entrar el agua.','Secar no alcanza: vuelve con la próxima lluvia. Si el perfil junta agua, hay que darle drenaje en el punto bajo.'); }
   else li.push('La aislación se sostiene en seco y en mojado.'); }
 if(v.ifug!==null && v.idn){ var idn=parseFloat(v.idn), r=v.ifug/idn;
   d+='Fuga <span class="num">'+f(v.ifug,1)+' mA</span> sobre IΔn de <span class="num">'+idn+' mA</span> = <span class="num">'+f(r*100,0)+' %</span>. ';
   if(r>0.5){ if(e!=='mal') e='mal'; li.push('La fuga supera la mitad del IΔn. Si la aislación da bien, buena parte es capacitiva de los drivers y es normal en un cartel con muchos módulos: la solución es circuito y diferencial propios, no perseguir una falla inexistente.'); }
   else if(r>0.3){ if(e==='ok') e='ojo'; li.push('Fuga entre el 30 % y el 50 % del IΔn: compartiendo diferencial con el resto del local, cualquier día de humedad completa el disparo.'); } }
 if(v.tdrv!==null){ d+='Drivers a <span class="num">'+f(v.tdrv)+' °C</span>. ';
   if(v.tdrv>=70){ if(e==='ok') e='ojo'; li.push('Los drivers trabajan a '+f(v.tdrv)+' °C o más: por eso se queman. Sacarlos del perfil a una caja ventilada, o ventilar el perfil. La mayoría de los drivers se muere por temperatura, no por tensión.'); } }
 if(v.propio===false) li.push('El cartel no tiene circuito propio. Conviene dárselo: es la carga que está a la intemperie, la que más fuga aporta y la que más falla. Colgada del circuito de iluminación del salón, una falla en el cartel deja el local a oscuras.');
 if(!d) return null;
 if(e==='mal') t='El cartel tiene una falla que hay que corregir';
 else if(e==='ojo') t='Funciona, pero con condiciones que van a fallar';
 else { t='El cartel está en condiciones'; li.push('Revisar las juntas y los prensacables en cada mantenimiento: se endurecen y pierden estanqueidad.'); }
 li.push('Verificar que los conductores del tramo a la intemperie sean aptos para ese emplazamiento, y que las cajas, prensacables y perfiles tengan el grado IP que corresponde.');

}},

cita:'AEA 90364-7-771, 771.8 (selección de materiales según las influencias externas del emplazamiento y grado IP) y 771.23.5.1 con Tabla 771.23.I (aislación mínima 0,5 MΩ a 500 V). 771.13: empalmes en cajas accesibles.'
});

F.push({
id:'L3', fam:'loc', t:'Cortina metálica o portón automático',

eq:[EQ.f117v, EQ.f117cont, EQ.ut204, EQ.ut511],
pasos:[
 'PRIMERO la seguridad: medir con el Fluke la tensión entre la cortina y un punto de tierra confiable, sin apoyar la mano. Una cortina metálica es una masa grande, accesible desde la vereda y muchas veces tocada con las manos mojadas.',

F.push({

],
med:{campos:[
 {id:'tipo', lbl:'Tipo de iluminación que se verifica', tipo:'sel', opts:[
   ['evac','Seguridad, de evacuación o escape'],
   ['amb','Seguridad, ambiente o anti-pánico'],
   ['riesgo','Seguridad, en zona de alto riesgo'],
   ['reem','De reemplazo'],
   ['punto','Punto con equipo manual de extinción o tablero de distribución']]},
 {id:'tresp', lbl:'Tiempo de respuesta medido', ayuda:'Desde el corte de la alimentación normal hasta el encendido', u:'s'},
 {id:'auto', lbl:'Autonomía medida, la de la peor luminaria', u:'min'},
 {id:'luxnorm', lbl:'Iluminancia normal de la zona, si se conoce', ayuda:'Sólo para zona de alto riesgo: el criterio es el mayor entre 30 lux y el 10 % de este valor', u:'lux'},
 {id:'desc', lbl:'¿La iluminación de emergencia se desconecta sola al volver la alimentación normal?', tipo:'bool'}
], ev:function(v){
 if(!v.tipo) return null;
 var C={evac:{lux:'1 lux horizontal mínimo a nivel del solado, en el eje de la ruta, con una relación entre iluminancia máxima y mínima menor a 40 veces', t:0.5, tn:'corte breve, 0,5 s', a:60},
   amb:{lux:'0,5 lux horizontal mínimo en todo el espacio considerado, desde el suelo hasta 1 m de altura, con relación máxima a mínima menor a 40 veces', t:0.5, tn:'corte breve, 0,5 s', a:60},
   riesgo:{lux:'30 lux a 80 cm del suelo, o el 10 % de la iluminancia normal, tomando siempre el mayor de los dos, con relación máxima a mínima menor a 10 veces', t:0.5, tn:'corte breve, 0,5 s', a:null},
   reem:{lux:'no menor de 30 lux a 80 cm del suelo, según el Decreto 351/79', t:15, tn:'corte mediano, 15 s', a:null},
   punto:{lux:'5 lux mínimo a nivel del plano de trabajo', t:0.5, tn:'corte breve, 0,5 s', a:60}}[v.tipo];
 var lux = C.lux;
 if(v.tipo==='riesgo' && v.luxnorm!==null) lux += '. Con una iluminancia normal de '+f(v.luxnorm,0)+' lux, el 10 % da '+f(v.luxnorm*0.1,0)+' lux, así que el criterio aplicable es '+f(Math.max(30,v.luxnorm*0.1),0)+' lux';
 var d='Exigencia de nivel: '+lux+'. Tiempo de respuesta: '+C.tn+'.'+(C.a?' Autonomía mínima: '+C.a+' minutos.':' Autonomía: el tiempo necesario para concluir la actividad en forma segura y abandonar la zona.');
 var li=[], e='ok', t='Cumple lo que se puede verificar';
 if(v.tresp!==null){
   if(v.tresp > C.t){ e='mal'; li.push('El tiempo de respuesta medido es de '+f(v.tresp,2)+' s, por encima de los '+f(C.t,1)+' s admitidos ('+C.tn+'). Reemplazar el artefacto o revisar el dispositivo de transferencia.'); }
   else li.push('El tiempo de respuesta de '+f(v.tresp,2)+' s está dentro de los '+f(C.t,1)+' s admitidos.');
 }
 if(v.auto!==null && C.a){
   if(v.auto < C.a){ e='mal'; li.push('La autonomía medida es de '+f(v.auto,0)+' minutos, por debajo de los '+C.a+' exigidos. Las baterías están agotadas: reemplazarlas y volver a ensayar.'); }
   else li.push('La autonomía de '+f(v.auto,0)+' minutos supera el mínimo de '+C.a+'.');
 } else if(v.auto!==null) li.push('Autonomía medida: '+f(v.auto,0)+' minutos. En zona de alto riesgo y en iluminación de reemplazo el criterio no es un valor fijo sino el tiempo necesario para terminar la tarea con seguridad; dejarlo justificado en la memoria.');
 if(v.desc===false){ if(e!=='mal') e='ojo'; li.push('La iluminación de emergencia no se desconecta sola al volver la alimentación normal. Debe hacerlo automáticamente, contemplando el tiempo que tardan las lámparas del sistema normal en alcanzar su iluminancia nominal. Si no se desconecta, las baterías se descargan sin necesidad.'); }
 li.push('El nivel de iluminancia en lux NO se puede verificar con este equipamiento: hace falta un luxómetro. Dejarlo aclarado en el informe y, si la habilitación lo exige, contratar la medición.');
 if(v.tipo==='amb') li.push('Si el sistema de iluminación usa lámparas de descarga con tiempos de reencendido mayores a 10 s, entre el 10 % y el 20 % de las luminarias, bien distribuidas, deben quedar encendidas alimentadas desde una fuente sin corte, o bien tener lámparas incandescentes.');
 if(v.tipo==='evac') li.push('Donde sea esperable la presencia de humos opacos, hay que prever luminarias de evacuación a una altura máxima de 0,3 m desde el solado, que no sobresalgan de la pared más de 0,1 m. Eso no impide que además haya luminarias en el cielorraso.');
 if(e==='mal') t='No cumple';
 else if(e==='ojo') t='Cumple con observaciones';
 return {e:e, t:t, d:d, li:li};
}},
sol:['Reemplazar las baterías cuya autonomía medida no llegue a una hora.','Reemplazar los artefactos que no encienden dentro del tiempo de corte que corresponde.','Contratar la medición de iluminancia con luxómetro si la habilitación la exige: con este maletín no se puede.','Agregar luminarias bajas donde sea esperable humo opaco, a no más de 0,3 m del solado.','Dejar el ensayo asentado con fecha, tiempos medidos y cuáles fallaron.'],
cita:'AEA 90364-7-718 (2008), 718.556.2.1.2.1 (evacuación: 1 lux en el eje, relación menor a 40, corte breve 0,5 s, mínimo 1 hora), 718.556.2.1.2.2 (ambiente: 0,5 lux hasta 1 m de altura, corte breve, mínimo 1 hora), 718.556.2.1.2.3 (alto riesgo: 30 lux a 80 cm o el 10 % de la normal, relación menor a 10), 718.556.2.1.3 (reemplazo: 30 lux a 80 cm, corte mediano 15 s) y 718.556.2.6. Los 5 lux de los puntos con extintores y tableros surgen de la Nota 2 de 718.556.2.1.1.2.1.'
});

F.push({
id:'E4', fam:'eme', t:'Circuitos terminales de iluminación de seguridad',
sint:'Verificar el circuito que alimenta las luminarias de emergencia: cuántas cuelgan de él, cuánta corriente lleva y cómo están repartidas.',
causas:['Circuito con más luminarias de las admitidas','Circuito cargado por encima del 70 % de su protección','Ambiente grande con una sola boca de seguridad','Luminarias al alcance de la mano sin MBTS'],
eq:[EQ.ut204],
pasos:[
 'Contar cuántas luminarias de emergencia alimenta el circuito terminal. El límite es 15.',
 'Medir la corriente del circuito con la pinza, con todas las luminarias en funcionamiento, o calcular la demanda de potencia máxima simultánea.',
 'Leer la corriente asignada del dispositivo de protección del circuito. La demanda no puede superar el 70 % de ese valor.',
