function textoInforme(fuente){
  var obra = fuente?fuente.obra:ST.obra, reg = fuente?fuente.registro:ST.registro;
  var t='INFORME DE INTERVENCIÓN — Diagnóstico en obra AEA 90364\n';
  t+='='.repeat(58)+'\n';
  if(obra.cliente) t+='Cliente: '+obra.cliente+'\n';
  if(obra.dir)     t+='Domicilio: '+obra.dir+'\n';
  t+='Fecha: '+fechaAR(obra.fecha||hoyISO())+'\n';
  if(obra.tipo)    t+='Tipo: '+obra.tipo+'\n';
  if(obra.inst)    t+='Instalador: '+obra.inst+(obra.mat?' — Matrícula '+obra.mat:'')+'\n';
  t+='Registros: '+reg.length+'\n\n';
  var r={ok:0,ojo:0,mal:0,info:0};
  for(var i=0;i<reg.length;i++){
    var x=reg[i];
    if(r[x.e]!==undefined) r[x.e]++; else r.info++;
    t+=(i+1)+'. ['+x.hora+'] '+x.id+' — '+x.t+'\n';
    t+='   Resultado: '+(x.e==='mal'?'NO CUMPLE / CORREGIR':(x.e==='ojo'?'REVISAR':(x.e==='ok'?'CUMPLE':'DATO')))+' — '+x.ver+'\n';
    if(x.lect && x.lect.length) t+='   '+x.lect.join('\n   ')+'\n';
    t+='\n';
  }
  t+='RESUMEN: '+r.ok+' cumplen · '+r.ojo+' a revisar · '+r.mal+' a corregir · '+r.info+' informativos\n';
  if(obra.obs) t+='\nObservaciones: '+obra.obs+'\n';
  t+='\nCriterios: AEA 90364-7-770 / 7-771 / 7-701 / 7-718. UL = 24 V.\n';
  t+='Borrador de obra. No reemplaza al protocolo de medición firmado.\n';
  return t;
}
function copiarTexto(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast('Informe copiado'); }, function(){ mostrarTexto(txt); });
  } else mostrarTexto(txt);
}
function compartirInforme(){
  var txt=textoInforme();
  if(navigator.share){ navigator.share({title:'Informe de la intervención', text:txt}).catch(function(){}); }
  else { copiarTexto(txt); }
}
function mostrarTexto(txt){
  var w=window.open('','_blank');
  if(w){ w.document.write('<meta charset="utf-8"><pre style="font:14px/1.5 monospace;white-space:pre-wrap;padding:16px">'+esc(txt)+'</pre>'); w.document.close(); }
  else toast('No se pudo copiar: seleccioná el texto a mano');
}
function descargarInforme(){
  var txt=textoInforme();
  var nombre='informe-'+(ST.obra.cliente?ST.obra.cliente.replace(/[^\wáéíóúñÁÉÍÓÚÑ ]/g,'').replace(/\s+/g,'-').toLowerCase()+'-':'')+
             (ST.obra.fecha||hoyISO())+'.txt';
  try{
    var b=new Blob([txt], {type:'text/plain;charset=utf-8'});
    var u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u; a.download=nombre; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); }, 1500);
    toast('Descargado: '+nombre);
  }catch(e){ mostrarTexto(txt); }
}

/* ---------- respaldo: exportar e importar todo lo guardado ---------- */
var RESP_FORMATO = 3;
function exportarRespaldo(){
  var d = {
    app:'diagAEA', formato:RESP_FORMATO, titulo:'Diagnóstico en obra — AEA 90364',
    exportado:new Date().toISOString(),
    datos:{
      obra:ST.obra, registro:ST.registro, t0:ST.t0, favoritos:ST.favoritos,
      recientes:ST.recientes, valores:ST.guardados, ajustes:ST.ajustes, archivo:ST.archivo
    }
  };
  var txt;
  try{ txt=JSON.stringify(d); }catch(e){ toast('No se pudo armar el respaldo'); return; }
  var nombre='respaldo-diagnostico-'+hoyISO()+'.json';
  try{
    var b=new Blob([txt], {type:'application/json;charset=utf-8'});
    var u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u; a.download=nombre; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); }, 1500);
    toast('Descargado: '+nombre);
  }catch(e){ mostrarTexto(txt); }
}
function leerRespaldo(texto){
  var d=null;
  try{ d=JSON.parse(texto); }catch(e){ return {error:'El archivo no es un JSON válido.'}; }
  if(!d || typeof d!=='object') return {error:'El archivo no tiene el formato esperado.'};
  if(d.app && d.app!=='diagAEA') return {error:'El respaldo es de otra aplicación.'};
  if(d.formato && d.formato>RESP_FORMATO) return {error:'El respaldo viene de una versión más nueva de la app (formato '+String(d.formato).slice(0,4)+'). Actualizá la app antes de importarlo.'};
  var n = (d.datos && typeof d.datos==='object') ? d.datos : d;
  if(!n.registro && !n.archivo && !n.valores && !n.favoritos && !n.obra)
    return {error:'El archivo no parece un respaldo de esta app.'};
  return {datos:n, exportado:d.exportado||null};
}
function aplicarRespaldo(n, modo){
  function arr(x){ return Array.isArray(x)?x:[]; }
  if(modo==='reemplazar'){
    ST.obra = Object.assign({cliente:'', dir:'', tipo:'', inst:'', mat:'', obs:'', fecha:hoyISO()}, n.obra||{});
    ST.registro = arr(n.registro);
    ST.archivo = arr(n.archivo).slice(-20);
    ST.t0 = n.t0 || null;
    ST.favoritos = arr(n.favoritos);
    ST.recientes = arr(n.recientes).slice(0,8);
    ST.guardados = (n.valores && typeof n.valores==='object') ? n.valores : {};
    if(n.ajustes) ST.ajustes = Object.assign(ST.ajustes, n.ajustes);
  } else {
    var vistos={}, k;
    ST.registro.forEach(function(x){ if(x) vistos[x.id+'@'+x.ts]=1; });
    arr(n.registro).forEach(function(x){
      if(x && !vistos[x.id+'@'+x.ts]){ ST.registro.push(x); vistos[x.id+'@'+x.ts]=1; }
    });
    var cerr={};
    ST.archivo.forEach(function(x){ if(x) cerr[x.cerrada]=1; });
    arr(n.archivo).forEach(function(x){ if(x && !cerr[x.cerrada]){ ST.archivo.push(x); cerr[x.cerrada]=1; } });
    ST.archivo.sort(function(a,b){ return (a.cerrada||0)-(b.cerrada||0); });
    if(ST.archivo.length>20) ST.archivo=ST.archivo.slice(-20);
    arr(n.favoritos).forEach(function(x){ if(ST.favoritos.indexOf(x)<0) ST.favoritos.push(x); });
    arr(n.recientes).forEach(function(x){ if(ST.recientes.indexOf(x)<0) ST.recientes.push(x); });
    ST.recientes=ST.recientes.slice(0,8);
    if(n.valores && typeof n.valores==='object'){
      for(k in n.valores){
        if(Object.prototype.hasOwnProperty.call(n.valores,k) && ST.guardados[k]===undefined) ST.guardados[k]=n.valores[k];
      }
    }
    if(!ST.t0 && n.t0) ST.t0=n.t0;
    if(n.obra){
      var o=n.obra, c;
      for(c in o){ if(Object.prototype.hasOwnProperty.call(o,c) && !ST.obra[c] && o[c]) ST.obra[c]=o[c]; }
    }
  }
  guardar();
}

     '<li><b>Elegir paleta y modo de imagen.</b> Ironbow para recorrer, Rainbow HC para separar diferencias chicas, blanco caliente para la foto del informe. Para documentar, fusión o PiP: a 256 × 192 una imagen puramente térmica de un tablero es un manchón de rectángulos, y sin la imagen visual superpuesta después no se sabe cuál era el borne.</li>'+
     '<li><b>Fijar la alarma alta</b> en el umbral del caso antes de empezar el barrido, para que el equipo avise sin tener que ir leyendo el número.</li>'+
     '<li><b>Abrir el frente y medir dentro de los primeros minutos.</b> Apenas se destapa, las piezas empiezan a enfriarse por convección. Y no tocar ni reapretar nada antes de medir: un borne apretado borra la evidencia y la ficha se queda sin diagnóstico.</li>'+
     '<li><b>Trabajar entre 30 y 50 cm, lo más perpendicular posible.</b> El blanco necesita unos 3 × 3 píxeles para que el valor sea confiable: 3,4 mm a 30 cm y 5,7 mm a 50 cm. Un borne de termomagnética mide unos 6 mm, así que a 50 cm entra justo y más lejos el número sale por debajo del real. Pasados unos 45° de inclinación, la emisividad efectiva cae y la lectura también. La lente es de foco fijo: el encuadre se corrige caminando, no con un anillo.</li>'+
     '<li><b>Barrer siempre en el mismo orden:</b> acometida, interruptor general, barras y borneras, diferenciales, termomagnéticas, bornes de salida y conductores en la canaleta. El orden fijo es lo que evita saltearse un tercio del tablero.</li>'+
     '<li><b>Comparar entre iguales.</b> Fase contra fase, polo contra polo, termomagnética contra su vecina de carga parecida. La comparación cancela a la vez el error de emisividad y el de reflejo, que es el error grande de este método.</li>'+
     '<li><b>Descartar el reflejo antes de dar por bueno un hallazgo.</b> Si el punto caliente se corre al cambiar de ángulo, es un reflejo y no calor. Una barra pulida devuelve la imagen térmica del operador.</li>'+
     '<li><b>Anotar los tres números de cada hallazgo:</b> la temperatura del punto, la del componente vecino comparable y la del ambiente. Son los tres que piden las fichas C2 y P3, y sin el tercero el ΔT sobre ambiente no se puede calcular.</li>'+
     '<li><b>Corregir por carga si no se llegó al 40 %.</b> La disipación va con el cuadrado de la corriente: ΔT a plena carga ≈ ΔT medido × (In / I medida)². Un ΔT de 5 °C tomado con el 30 % de la carga son del orden de 55 °C a corriente nominal, que ya es reparación inmediata.</li>'+
     '<li><b>Capturar imagen térmica y visual del hallazgo</b> con el punto o la zona de análisis puestos encima. El BMP guarda la matriz radiométrica: con el software de PC se puede recalcular después con otra emisividad, cosa que con un número anotado en un papel no se puede.</li>'+
     '<li><b>Cerrar el tablero antes de reparar.</b> La reparación es trabajo sin tensión y va con los cinco pasos de la consignación. Terminada, repetir la termografía con la misma carga y a la misma distancia: es la verificación que piden las fichas A6, P3, C1, C5, N1 y N2.</li>'+
     '</ol>';
  h+='</div>';
  h+='<div class="bloque"><h3>Criterio de veredicto <small>ΔT · criterio práctico, no reglamentario</small></h3><ul class="sol">'+
     '<li><b>ΔT de 1 a 3 °C</b> contra un componente comparable con carga parecida, o de <b>1 a 10 °C</b> sobre el ambiente: posible deficiencia, corresponde investigar.</li>'+
     '<li><b>ΔT de 4 a 15 °C</b> contra el comparable, o de <b>11 a 20 °C</b> sobre el ambiente: deficiencia probable, reparar en la próxima intervención programada.</li>'+
     '<li><b>ΔT de 21 a 40 °C</b> sobre el ambiente: vigilar hasta poder corregir.</li>'+
     '<li><b>ΔT mayor a 15 °C</b> contra el comparable, o mayor a <b>40 °C</b> sobre el ambiente: discrepancia mayor, reparar de inmediato.</li>'+
     '<li><b>Límite del conductor:</b> 70 °C en aislación de PVC y 90 °C en XLPE, medidos sobre la vaina. Es el número contra el que evalúa la ficha C4.</li>'+
     '<li><b>Dentro del tablero:</b> 40 °C es la temperatura ambiente de referencia de la Tabla 771.16.I. Por encima, la Iz de tabla ya no vale y hay que aplicar el factor de la Tabla 771.16.II.a —45 °C → 0,91 y 50 °C → 0,82—, y además el bimetálico de la termomagnética dispara antes de su corriente nominal.</li>'+
     '</ul>';
  h+='<div class="nota">Los escalones de ΔT no salen de la AEA: son el criterio de mantenimiento de uso corriente en termografía eléctrica. La Reglamentación no fija umbrales termográficos ni incluye la termografía entre las verificaciones de recepción. Lo que sí es reglamentario son los 70 y 90 °C del conductor y los 40 °C de referencia de la Tabla 771.16.I.</div>';
  h+='</div>';
  h+='<div class="bloque"><h3>Material de seguridad <small>del listado reglamentario</small></h3><ul class="sol">'+
     '<li>ESTÁ · guantes aislantes, detectores y verificadores de tensión, herramientas aisladas y lámpara portátil.</li>'+
     '<li>FALTA · protector facial. Con la cámara termográfica en el maletín dejó de ser un faltante genérico y pasó a ser <b>prerrequisito</b>: la inspección térmica se hace con el tablero abierto y con tensión, que es exactamente la maniobra para la que corresponde. Exigirle ATPV en cal/cm² marcado según ASTM F2178 o IEC 61482-1-1, sobre casco sin ventilación clase E. Las gafas antivaho no lo reemplazan: no tienen clasificación de arco.</li>'+
     '<li>FALTA · alfombra o taburete aislante, y pértiga de maniobra. Es lo que separa del piso cuando el tablero no se puede dejar sin tensión.</li>'+
     '<li>FALTA · vainas y caperuzas aislantes para cubrir las partes activas vecinas al punto de trabajo.</li>'+
     '<li>FALTA · material de señalización para delimitar la zona. Sin eso, el paso 5 de la consignación no se puede cumplir.</li>'+
     '<li>FALTA · transformador de seguridad con salida de 24 V y transformador de relación 1:1. Para esto los autotransformadores están prohibidos.</li>'+
     '<li>FALTA · diferencial de alta sensibilidad portátil, para alimentar la herramienta en obra desde una boca ajena.</li>'+
     '</ul></div>';
  h+='<div class="cita"><b>Referencia.</b> AEA 90364-7-771, Anexo 771-J.1: transcripción de los puntos 1 y 2 del Capítulo 14 del Anexo VI del Decreto Reglamentario 351/79 de la Ley 19587. Tensión de seguridad, 1.1.2 · bloqueo, 1.1.3 · consignación, 1.1.4 · distancias de seguridad, 1.1.5 · material de seguridad, 2.1.2 · ejecución de trabajos sin tensión, 2.1.3. La clase 00 de los guantes y el marcado de 1000 V de las herramientas salen de las normas de producto, no de la AEA.</div>';
  h+='</div>';
  app.innerHTML=h; pintarNav();
}

/* ---------- criterios ---------- */
var CRITERIOS=[
 ['Tensión nominal','Se adopta 220 V entre fase y neutro y 380 V entre fases, que es lo que la Reglamentación escribe primero y lo que usa la planilla de cargas. Para el cálculo es además el criterio conservador. La banda de tolerancia de la red es aparte y se define sobre 230/400 V: ±10 % (207 a 253 V), y +6 / −10 % (207 a 244 V) durante el período de transición.','AEA 90364-7-771, 771.4.4 a) y 7-770, 770.4.2 b), con la Nota que remite a IRAM 2001 e IEC 60038'],
 ['Puesta a tierra','Ra ≤ 40 Ω. El objetivo de fondo es que Ra × IΔn no supere la tensión de contacto límite.','AEA 90364-7-771, 771.3.3.1 y Tabla 771.3.I'],
 ['Tensión de contacto límite','UL = 24 V. Por eso en el UT-582+ corresponde ajustar UL en 25 V y no en 50 V.','Ley 19587, Decretos 351/79 y 911/96'],
 ['Aislación','250 V de ensayo → ≥ 0,25 MΩ (MBTS y MBTF) · 500 V → ≥ 0,5 MΩ (hasta 500 V nominales) · 1000 V → ≥ 1,0 MΩ (sobre 500 V). Cuatro mediciones: entre activos y de cada activo contra tierra. En circuitos largos se agrega la regla de 1000 Ω/V por cada 100 m o fracción.','Tabla 770.19.I / 771.23.I'],
 ['Tiempo de desconexión','Esquema TT, circuitos terminales, 120 V < U0 ≤ 230 V → 0,06 s en corriente alterna. Circuitos seccionales en TT → 1 s.','Tabla 771.18.I'],
 ['Ensayo de diferenciales','×½ no debe disparar · ×1 ≤ 300 ms · ×5 ≤ 40 ms. Una falla real en TT lleva al diferencial a la zona del ensayo ×5, con margen sobre los 0,06 s exigidos.','IEC 61008 / 61009, coordinado con la Tabla 771.18.I'],
 ['Caída de tensión','3 % para iluminación (y tomacorrientes en la 7-770). Motores: 5 % en régimen y 15 % durante el arranque. En la 7-771 el circuito seccional no debe superar el 1 %, de donde salen el 2 % y el 4 % de los terminales medidos desde el tablero seccional; en la 7-770 el 1 % del seccional es una recomendación.','AEA 90364-7-770, 770.15.6 · AEA 90364-7-771, 771.13 b)'],
 ['Método de cálculo de la caída','ΔU = GDC · I · L / S, con GDC de 0,040 (monofásico, cobre, cos φ 0,8) y 0,035 (trifásico). Que el gradiente trifásico sea 0,875 veces el monofásico confirma que el coeficiente de la expresión general es √3 y no 3: el radical se pierde en la extracción del PDF.','AEA 90364-7-771, 771.19.7 a) y c), y Tabla 771.19.IV'],
 ['Coordinación de protecciones','IB ≤ In ≤ Iz, con la Iz corregida por agrupamiento y temperatura.','AEA 90364-7-771, 771.19.3 y 771.16'],
 ['Corriente admisible base','Conductores aislados PVC en cañería, a 40 °C: 1,5 mm² → 15 A · 2,5 → 21 A · 4 → 28 A · 6 → 36 A · 10 → 50 A · 16 → 66 A, con dos conductores cargados. Con tres cargados baja a 14 · 18 · 25 · 32 · 44 · 59 A.','Tabla 771.16.I, método B1'],
 ['Agrupamiento en caño','2 circuitos → 0,80 · 3 → 0,70. Para más de tres, la tabla específica de caño se queda corta y el factor sale de la de agrupamiento general, declarada aplicable al mismo método de instalación: 4 → 0,65 · 5 → 0,60 · 6 → 0,57 · 7 → 0,54 · 8 → 0,52 · 9 → 0,50.','Tabla 771.16.II.b y Tabla 771.16.IV, ítem 1'],
 ['Temperatura ambiente','Factor sobre la Iz de tabla, para PVC: 25 °C → 1,22 · 30 → 1,15 · 35 → 1,08 · 40 → 1,00 · 45 → 0,91 · 50 → 0,82 · 55 → 0,70 · 60 → 0,57. La columna de PVC termina en 60 °C.','Tabla 771.16.II.a'],
 ['Ocupación de cañerías','La cantidad de conductores por caño sale de tabla. Para los casos no previstos, el área ocupada incluida la aislación no supera el 35 % de la sección interna. Diámetro interno mínimo: 13 mm en circuitos terminales, 15 mm en principales y seccionales.','Tabla 771.12.IX y 771.12'],
 ['Secciones mínimas','Líneas principales 4 mm² · seccionales 2,5 · iluminación de usos generales 1,5 · tomacorrientes de usos generales 2,5 · usos especiales y específicos 2,5 · conductor de protección 2,5.','Tabla 771.13.I / Tabla 770.11.I'],
 ['Disipación del tablero','Ptot = Pdp + 0,2·Pdp + Pau ≤ Pde declarada del gabinete, con Pdp = Σ Pd × K². K por cantidad de salidas: 2-3 → 0,8 · 4-5 → 0,7 · 6-9 → 0,6 · ≥10 → 0,5.','Anexo 771-H, Tablas 771-H.XIII y 771-H.XIV, y Tabla 771.20.II'],
 ['Grados de electrificación, vivienda','Mínimo hasta 60 m² · Medio hasta 130 m² · Elevado hasta 200 m² · Superior sobre 200 m². La superficie es la cubierta más el 50 % de la semicubierta. En la 7-771 se agrega la DPMS: 3,7 / 7 / 11 kVA.','Tabla 770.7.I y Tabla 771.8.I'],
 ['Grados de electrificación, local u oficina','Mínimo hasta 30 m² y 4,5 kVA · Medio hasta 75 m² y 7,8 kVA · Elevado hasta 150 m² y 12,2 kVA · Superior por encima. Manda el criterio más exigente entre superficie y DPMS. Si el inmueble fue proyectado como vivienda, rigen los valores de vivienda.','Tabla 771.8.IV y 771.8.3.1'],
 ['Circuitos mínimos','Vivienda y local comercial: 2 / 3 / 5 / 6 circuitos según el grado. Locales de otras características: 3 / 4 / 6 / 8, y en todos los grados al menos dos circuitos de iluminación en diferenciales distintos.','Tablas 770.7.II, 771.8.II, 771.8.V y 771.8.X'],
 ['Continuidad de PE','Ensayo con fuente de menos de 12 V; se recomienda corriente mínima de 0,2 A. El criterio de 1 Ω es práctico, no reglamentario.','771.23.3.3 y 770.19.5.1'],
 ['Corriente de fuga','El límite de 50 % de IΔn es práctico, no reglamentario. Por encima de ese valor cualquier transitorio completa el disparo.','Criterio de campo'],
 ['Termografía','Contra un componente igual y de carga parecida: ΔT de 1 a 3 °C investigar · de 4 a 15 °C reparar programado · más de 15 °C reparar de inmediato. Contra la temperatura ambiente: de 1 a 10 °C investigar · de 11 a 20 °C reparar programado · de 21 a 40 °C vigilar hasta poder corregir · más de 40 °C reparar de inmediato. La medición sólo vale con el circuito al 40 % de su corriente nominal o más; con menos carga, ΔT a plena carga ≈ ΔT medido × (In / I medida)². Límite del conductor: 70 °C en PVC y 90 °C en XLPE sobre la vaina.','Criterio práctico de mantenimiento. La AEA no fija umbrales termográficos ni incluye la termografía entre las verificaciones de 771.23.3.3 y 770.19.3. Los 70 y 90 °C del conductor sí son reglamentarios, Tabla 771.16.I'],
 ['Protección por circuito','Cada circuito derivado lleva su propio interruptor automático con apertura por sobrecarga y cortocircuito.','771.20.5.2 b)'],
 ['Antes de restablecer','La actuación sin causa conocida de las protecciones obliga a una revisión detallada de la instalación antes de reponer el servicio.','771.23.6 y 770.19.6'],
 ['Bornes','Línea, neutro y protección deben estar conectados cada uno al borne destinado a tal fin.','771.23.3.1 d)'],
 ['Clasificación BD1','Local u oficina con afluencia simultánea de público y personal inferior a 100 personas, en edificios de hasta 12 pisos, excluyendo subsuelos. Por fuera de eso cambia la columna de cables y canalizaciones aplicable, y rige la Sección 718.','771.12.2.1, 771.12.2.2 y Tabla 771.12.I'],
 ['Alcance de la Sección 701','No es sólo el baño: se aplica a locales con bañeras, duchas con o sin receptáculo, hidromasajes, bidés, lavatorios y cualquier artefacto con chorros o grifería emisora de agua, y por extensión a bebederos, cocinas y lavaderos donde hay piletas y máquinas de lavado de vajilla o ropa. No se aplica a piscinas ni a duchas de emergencia industriales.','AEA 90364-7-701, 701.1'],
 ['Zonas 0 a 3','Zona 0: el interior del artefacto. Zona 1: hasta el más alto entre 2,25 m sobre el fondo de la bañera y el punto de salida de agua, y en horizontal hasta el artefacto (duchador fijo), 1,20 m del punto de conexión del flexible (móvil) o 0,60 m de la flor (ducha sin receptáculo, fijo). Zona 2: los 0,60 m siguientes, del solado al cielorraso. Zona 3: el resto. Las mamparas móviles no limitan zonas; las fijas, sólo si llegan a 225 cm.','701.30.1 a 701.30.5 y figuras 701.B.1 a 701.B.9'],
 ['Grados IP por zona','Zona 0 IPX7 · zona 1 IPX5 · zona 2 IPX4 · zona 3 IPX1. En baños públicos o donde se usen chorros de agua, zonas 2 y 3 pasan a IPX5. Fuera de las zonas 0, 1 y 2 dentro del baño, antebaño o baño vinculado a sauna: IPX1.','701.512.2'],
 ['Qué admite cada zona','Zona 0: ningún dispositivo; sólo aparatos aptos zona 0, IPX7, fijos y MBTS de 12 Vca o 24 Vcc. Zona 1: sólo MBTS con la fuente fuera de las zonas 0, 1 y 2, más la excepción de la caja de bornes de hasta 220 Vca de la bomba del hidromasaje debajo de la bañera. Zona 2: sólo dispositivos MBTS; aparatos fijos como extractores, secatoallas, calentadores, luminarias Clase II IPx4 y calefactores sin resistores a la vista. Zona 3: cualquiera. Nunca un tablero dentro del cuarto de baño.','701.512.4 y 701.55.1 a 701.55.4'],
 ['Diferencial de 30 mA','Todos los circuitos terminales de estos locales llevan protección complementaria por diferencial de 30 mA o menos, sin excepción. En hidromasaje la propia Sección sugiere evaluar 10 mA, aceptando la posible pérdida de selectividad. En los secundarios de MBTS no se exige diferencial.','701.412.5 y 701.55.2'],
 ['Medidas de protección prohibidas','No se admiten obstáculos ni puesta fuera de alcance por alejamiento contra contactos directos, ni locales no conductores ni interconexiones equipotenciales no conectadas a tierra contra contactos indirectos. La separación eléctrica sólo se admite para un aparato o un tomacorriente por circuito.','701.412.3, 701.412.4, 701.413.3, 701.413.4 y 701.413.5'],
 ['Conexión equipotencial suplementaria','Conductores aislados de 2,5 mm² como mínimo, o fleje de acero galvanizado de 20 mm² y 1 mm de espesor. Un único verde-amarillo puede hacer de PE y equipotencial si su sección iguala la del activo del circuito. Alcanza a cañerías de agua, cloacales, calefacción y aire, estructura, gas con consentimiento, y marcos metálicos de aberturas.','701.413.1.6 y 701.55.4'],
 ['Canalizaciones del baño','Zonas 0 y 1: embutidas y de material aislante. Zonas 2 y 3: embutidas, metálicas o aislantes. Las aislantes van a 5 cm como mínimo de la pared terminada, o con barrera de concreto 1:3 continua de 1 cm de espesor y más ancha que el caño. El hormigón colado in situ cumple solo.','701.512.3'],
 ['Hidromasaje','Alimentación fija y permanente desde circuito ACU o APM, canalización aislante, conexión IPX5 como mínimo, comando neumático y caja de bornes debajo de la bañera fuera del alcance del usuario. El equipo cumple IEC 60335-2-60.','701.55.2 y 701.512.4'],
 ['Fuentes de MBTS','Sólo transformador de seguridad IEC 61558-2-6 con salida no mayor a 12 Vca y separación de protección, o fuente electroquímica. Quedan excluidos autotransformadores, transformadores electrónicos y separadores de simple aislación sin pantalla. La fuente va fuera de las zonas 0, 1 y 2.','701.55.2 y 701.512.4'],
 ['Pisos y techos calefactores','Circuitos de uso especial de hasta 32 A por fase, corte multipolar y diferencial de 30 mA. Continuidad antes de cubrir y aislación a tierra igual o mayor a 250 000 Ω antes de colocar el solado. Malla o cubierta metálica al conductor de protección. Sin separación eléctrica. Superficie limitada a 35 °C donde se pisa y 80 °C como máximo.','701.55.7.7 y Anexo 701.C'],
 ['Calentadores de agua','Los instantáneos de hasta 15 litros cumplen IEC 60335-1 y 60335-2-35 con elementos calefactores recubiertos: los de elementos desnudos inmersos en el agua no están permitidos. Los acumulativos cumplen IEC 60335-1 y 60335-2-21 y no llevan zócalo de conexión: el cable ingresa al aparato y la conexión es inaccesible sin herramientas.','701.55.6 y 701.55.7'],
 ['Esquema de tableros del baño','Tablero principal de doble aislación obligatorio. Diferencial de 300 mA selectivo contra contactos indirectos aguas arriba, y 30 mA en los circuitos terminales. La bañera de hidromasaje se protege con diferencial de 30 mA de cabecera o dedicado.','Anexo 701.A, figuras 701.A.1 a 701.A.3'],
 ['Pública concurrencia','Umbrales de 50 personas ajenas al local, 50 empleados o 100 personas según el tipo. Muchos locales lo son siempre, sin importar la ocupación. La ocupación se calcula dividiendo la superficie de piso por el factor X, y se duplica en subsuelos distintos del primero. Ante la duda, el local se considera de pública concurrencia.','AEA 90364-7-718, 718.1.2, Tablas 718.I y 718.II'],
 ['Niveles de iluminación de emergencia','Evacuación 1 lux en el eje de la ruta, relación máx/mín menor a 40. Ambiente 0,5 lux en todo el espacio hasta 1 m de altura. Alto riesgo 30 lux a 80 cm o el 10 % de la normal, el mayor, relación menor a 10. Puntos con extintor o tablero, 5 lux. Reemplazo 30 lux a 80 cm.','718.556.2.1.2.1 a .3 y 718.556.2.1.3'],
 ['Autonomía y tiempo de respuesta','Evacuación y ambiente: mínimo 1 hora, con corte breve de 0,5 s. Reemplazo y potencia de emergencia: corte mediano de 15 s. La conmutación arranca si la tensión cae bajo 0,6 veces el nominal durante 0,5 s y vuelve con 0,85 veces durante más de 1 minuto.','718.556.2.6 y 718.556.2.5.1.1'],
 ['Circuitos de iluminación de seguridad','Máximo 15 luminarias por circuito terminal y demanda no mayor al 70 % de la corriente asignada de su protección. Al menos una boca de seguridad por ambiente y dos en circuitos separados si supera los 100 m². MBTS obligatoria por debajo de 2,25 m.','718.556.2.1.2'],
 ['Protecciones de emergencia','Esquema preferido IT con controlador permanente de aislación. NO se aplica diferencial de 30 mA ni corte automático: producirían la desconexión intempestiva de un servicio esencial. Contra contactos directos, aislación y barreras simultáneamente.','718.556.4, 718.556.5.1.1 y .1.2'],
 ['Resistencia al fuego de las canalizaciones','F30 para alarma de incendio, aviso a ocupantes e iluminación de emergencia. F90 para presurización de agua contra incendio, presurización de escaleras, extracción de humo y ascensores de bomberos. En rutas de evacuación, embutido con 15 mm de mortero no combustible.','718.556.6.3.1 y 718.556.6.4.2'],
 ['Suministro complementario','Seguridad 15 % de la potencia contratada, emergencia 25 %, duplicado más del 50 %. Si corresponden los dos, se instala el de emergencia.','718.3.21.2 y Tabla 718.III'],
 ['Verificaciones de emergencia','Mensual: iluminación, señalización, dispositivo de transferencia y grupo electrógeno (1 hora al 50 %). Anual: descarga de baterías. Registros firmados por 10 años y planilla visible a menos de 1 m del tablero seccional general.','718.556.10.2 y .10.3']
];
function vistaCriterios(){
  ST.vista='criterios'; btnVolver.hidden=false;
  tituloBarra.innerHTML='Criterios de aceptación<span>Con la cita de dónde sale cada uno</span>';
  var h='<div class="ficha"><h2>Contra qué se compara cada medición</h2>';
  h+='<div class="sint">Donde el criterio es práctico y no reglamentario, está dicho expresamente. Esa distinción importa cuando hay que defender un informe.</div>';
  h+='<input class="buscar" id="qc" type="search" autocomplete="off" aria-label="Buscar un criterio" '+
     'placeholder="Buscar: aislación, agrupamiento, zona 1…" value="'+esc(ST.filtroCrit||'')+'">';
  h+='<div id="listaCrit"></div></div>';
  app.innerHTML=h;
  var qi=document.getElementById('qc'), deb=null;
  qi.addEventListener('input', function(){
    var v=this.value;
    clearTimeout(deb);
    deb=setTimeout(function(){ ST.filtroCrit=v; pintarCriterios(); }, 150);
  });
  pintarCriterios();
  pintarNav();
}
function pintarCriterios(){
  var cont=document.getElementById('listaCrit');
  if(!cont) return;
  var q=(ST.filtroCrit||'').toLowerCase().trim(), n=0, cuerpo='';
  for(var i=0;i<CRITERIOS.length;i++){
    var c=CRITERIOS[i];
    if(q && (c[0]+' '+c[1]+' '+c[2]).toLowerCase().indexOf(q)<0) continue;
    n++;
    cuerpo+='<div class="eq"><b>'+esc(c[0])+'</b><div style="font-size:calc(15px * var(--fs));margin-top:6px">'+
            esc(c[1])+'</div><div class="cfg">'+esc(c[2])+'</div></div>';
  }
  var h='<div class="bloque"><h3>Criterios que usa la app <small>'+n+' de '+CRITERIOS.length+'</small></h3>';
  h+= n ? cuerpo : '<p class="vacio">Ningún criterio coincide con «'+esc(ST.filtroCrit)+'».</p>';
  h+='</div>';
  cont.innerHTML=h;
}

/* ---------- ajustes ---------- */
function vistaAjustes(){
  ST.vista='ajustes'; btnVolver.hidden=false;
  tituloBarra.innerHTML='Ajustes<span>Cómo se ve y cómo se guarda</span>';
  var a=ST.ajustes;
  var h='<div class="ficha"><h2>Ajustes</h2>';
  h+='<div class="aj"><b>Tema</b><p>Automático sigue lo que tenga configurado el teléfono. El oscuro sirve en sótanos y cámaras de inspección; el claro, con sol de frente.</p>'+
     '<div class="seg">'+
     '<button data-tema="auto" aria-pressed="'+(a.tema==='auto')+'">Automático</button>'+
     '<button data-tema="claro" aria-pressed="'+(a.tema==='claro')+'">Claro</button>'+
     '<button data-tema="oscuro" aria-pressed="'+(a.tema==='oscuro')+'">Oscuro</button></div></div>';
  h+='<div class="aj"><b>Tamaño del texto</b><p>Para leer con guantes puestos y el teléfono apoyado en el tablero.</p>'+
     '<div class="seg">'+
     '<button data-fs="1" aria-pressed="'+(a.fs==1)+'">Normal</button>'+
     '<button data-fs="1.15" aria-pressed="'+(a.fs==1.15)+'">Grande</button>'+
     '<button data-fs="1.3" aria-pressed="'+(a.fs==1.3)+'">Muy grande</button></div></div>';
  h+='<div class="aj"><b>Mantener la pantalla encendida</b><p>Mientras la app está abierta, para que no se apague en medio de una medición. Requiere que la app esté servida por https o instalada.</p>'+
     '<div class="seg">'+
     '<button data-wake="1" aria-pressed="'+(a.wake===true)+'">Sí</button>'+
     '<button data-wake="0" aria-pressed="'+(a.wake!==true)+'">No</button></div></div>';
  h+='<div class="aj"><b>Datos guardados</b><p>'+
     (ALM.ok ? 'Se guardan en este teléfono: la intervención en curso, los favoritos, los valores cargados en cada ficha y hasta 20 intervenciones archivadas. Nada sale del equipo. Si borrás los datos del navegador se pierde todo, así que conviene exportar un respaldo cada tanto.'
             : 'Este teléfono no está dejando guardar ('+esc(ALM.motivo)+'). Suele pasar al abrir el archivo directamente desde el almacenamiento o en una ventana privada. Todo funciona igual, pero se pierde al cerrar.')+
     '</p><div class="acciones"><button class="peligro" id="borrartodo">Borrar todo lo guardado</button></div></div>';
  h+='<div class="aj"><b>Respaldo</b><p>Todo lo guardado en este teléfono cabe en un archivo. Sirve para pasar la app a otro equipo, para recuperarla después de borrar los datos del navegador y para dejar copia de las intervenciones cerradas. El archivo no sale de tu teléfono si no lo mandás vos.</p>'+
     '<div class="acciones"><button class="pri" id="expo">Exportar a un archivo</button>'+
     '<button id="impo">Importar un respaldo</button></div>'+
     '<input type="file" id="impof" accept="application/json,.json" hidden>'+
     '<div id="impoPanel"></div></div>';
  h+='<div class="aj"><b>Instalarla en la pantalla de inicio</b><p>Desde el menú del navegador, «Agregar a pantalla de inicio». Queda con ícono propio, abre sin barra de direcciones y sigue funcionando sin señal.</p></div>';
  h+='<div class="pie"><b>Diagnóstico en obra — AEA 90364.</b> '+F.length+' fichas de falla, '+CALC.length+' cálculos y '+CRITERIOS.length+' criterios de aceptación. Un solo archivo, sin servidor y sin conexión.</div>';
  h+='</div>';
  app.innerHTML=h;
  app.querySelectorAll('[data-tema]').forEach(function(b){
    b.onclick=function(){ ST.ajustes.tema=this.dataset.tema; aplicarAjustes(); guardar(); vistaAjustes(); };
  });
  app.querySelectorAll('[data-fs]').forEach(function(b){
    b.onclick=function(){ ST.ajustes.fs=parseFloat(this.dataset.fs); aplicarAjustes(); guardar(); vistaAjustes(); };
  });
  app.querySelectorAll('[data-wake]').forEach(function(b){
    b.onclick=function(){ ST.ajustes.wake=this.dataset.wake==='1'; guardar();
      if(ST.ajustes.wake) pedirWake(); else soltarWake(); vistaAjustes(); };
  });
  var be=document.getElementById('expo');
  if(be) be.onclick=exportarRespaldo;
  var bi=document.getElementById('impo'), fi=document.getElementById('impof');
  if(bi && fi) bi.onclick=function(){ fi.value=''; fi.click(); };
  if(fi) fi.onchange=function(){
    var file=this.files && this.files[0];
    if(!file) return;
    var fr=new FileReader();
    fr.onload=function(){
      var p=document.getElementById('impoPanel');
      if(!p) return;
      var r=leerRespaldo(String(fr.result));
      if(r.error){ p.innerHTML='<div class="resp"><b>No se pudo leer el respaldo</b>'+esc(r.error)+'</div>'; return; }
      var n=r.datos;
      var nreg=(n.registro||[]).length, narc=(n.archivo||[]).length,
          nfav=(n.favoritos||[]).length, nval=Object.keys(n.valores||{}).length;
      p.innerHTML='<div class="resp"><b>'+esc(file.name)+'</b>'+
        nreg+' registro'+(nreg===1?'':'s')+' en la intervención en curso · '+
        narc+' intervención'+(narc===1?'':'es')+' archivada'+(narc===1?'':'s')+' · '+
        nfav+' favorito'+(nfav===1?'':'s')+' · '+nval+' ficha'+(nval===1?'':'s')+' con valores cargados'+
        (r.exportado?'<br>Exportado el '+esc(fechaAR(String(r.exportado).slice(0,10))):'')+
        '<div class="acciones"><button class="pri" id="impoFus">Fusionar</button>'+
        '<button id="impoRee">Reemplazar todo</button>'+
        '<button id="impoCan">Cancelar</button></div>'+
        '<b>Fusionar</b> agrega lo que falte y no pisa nada de lo que ya tenés cargado. '+
        '<b>Reemplazar</b> borra lo de este teléfono y deja exactamente lo del archivo.</div>';
      var bf=document.getElementById('impoFus'), br=document.getElementById('impoRee'), bc=document.getElementById('impoCan');
      if(bf) bf.onclick=function(){ aplicarRespaldo(n,'fusionar'); vistaAjustes(); pintarNav(); toast('Respaldo fusionado'); };
      if(br) br.onclick=function(){ aplicarRespaldo(n,'reemplazar'); aplicarAjustes(); vistaAjustes(); pintarNav(); toast('Respaldo importado'); };
      if(bc) bc.onclick=function(){ p.innerHTML=''; };
    };
    fr.onerror=function(){
      var p=document.getElementById('impoPanel');
      if(p) p.innerHTML='<div class="resp"><b>No se pudo abrir el archivo</b>Probá de nuevo o elegí otro.</div>';
    };
    fr.readAsText(file);
  };
  var bt=document.getElementById('borrartodo');
  if(bt) bt.onclick=function(){
    if(!confirm('¿Borrar la intervención en curso, el archivo y los favoritos de este teléfono?')) return;
    try{ localStorage.removeItem(CLAVE); }catch(e){}
    ST.registro=[]; ST.archivo=[]; ST.favoritos=[]; ST.recientes=[]; ST.guardados={}; ST.t0=null;
    ST.obra={cliente:'', dir:'', tipo:'', inst:'', mat:'', obs:'', fecha:hoyISO()};
    vistaAjustes(); pintarNav(); toast('Listo, quedó vacío');
  };
  pintarNav();
}

/* ---------- navegación ---------- */
var ICONOS={
  fallas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
  calculo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h2m3 0h3M8 15h2m3 0h3M8 19h8"/></svg>',
  informe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>',
  equipos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h5l2-3h4l2 3h5v13H3z"/><circle cx="12" cy="13" r="3.2"/></svg>',
  criterios:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h9M4.5 5h.01M9 12h9M4.5 12h.01M9 19h9M4.5 19h.01"/></svg>',
  ajustes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 2.6 7a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 7 2.6h.1A1.7 1.7 0 0 0 8.3 1V1a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 15 2.6h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1h.1a2 2 0 1 1 0 4H21a1.7 1.7 0 0 0-1.6 1z"/></svg>'
};
var NAVS=[
  {k:'inicio', t:'Fallas', i:'fallas'},
  {k:'calculo', t:'Cálculo', i:'calculo'},
  {k:'informe', t:'Informe', i:'informe'},
  {k:'equipos', t:'Equipos', i:'equipos'},
  {k:'criterios', t:'Criterios', i:'criterios'}
];
function pintarNav(){
  var actual = (ST.vista==='ficha') ? 'inicio' : (ST.vista==='calc' ? 'calculo' : ST.vista);
  var h='';
  NAVS.forEach(function(n){
    h+='<button data-nav="'+n.k+'"'+(actual===n.k?' aria-current="page"':'')+'>'+ICONOS[n.i]+
       '<span>'+n.t+'</span>'+
       (n.k==='informe' && ST.registro.length ? '<span class="badge">'+ST.registro.length+'</span>' : '')+
       '</button>';
  });
  elNav.innerHTML=h;
  elNav.querySelectorAll('[data-nav]').forEach(function(b){
    b.onclick=function(){ ir(this.dataset.nav); };
  });
}
function render(){
  window.scrollTo(0,0);
  if(ST.vista==='ficha') vistaFicha();
  else if(ST.vista==='calculo') vistaCalculo();
  else if(ST.vista==='calc') vistaCalc();
  else if(ST.vista==='informe') vistaInforme();
  else if(ST.vista==='equipos') vistaEquipos();
  else if(ST.vista==='criterios') vistaCriterios();
  else if(ST.vista==='ajustes') vistaAjustes();
  else vistaInicio();
}
function preparar(vista, arg){
  ST.editando=null;
  if(vista==='ficha'){
    var x=buscarFalla(arg);
    if(!x){ ST.vista='inicio'; return; }
    ST.falla=x; ST.vista='ficha';
    ST.valores = ST.guardados[x.id] ? JSON.parse(JSON.stringify(ST.guardados[x.id])) : {};
    ST.veredicto=null; ST.vals=null;
    marcarReciente(x.id);
    for(var i=0;i<ST.registro.length;i++) if(ST.registro[i].id===x.id && ST.registro[i].k==='F') ST.editando=i;
  } else if(vista==='calc'){
    var c=buscarCalc(arg);
    if(!c){ ST.vista='calculo'; return; }
    ST.calc=c; ST.vista='calc';
    ST.valores = ST.guardados['calc:'+c.id] ? JSON.parse(JSON.stringify(ST.guardados['calc:'+c.id])) : {};
    var vals=evaluarCampos(c.campos, ST.valores), r=null;
    try{ r=c.ev(vals); }catch(e){ r=null; }
    ST.veredicto=r; ST.vals=vals; ST.firmaCalc=firmaValores();
    for(var j=0;j<ST.registro.length;j++) if(ST.registro[j].id===c.id && ST.registro[j].k==='C') ST.editando=j;
  } else {
    ST.vista=vista;
    if(vista==='inicio'){ ST.triage=null; ST.filtro=''; }
  }
}
function ir(vista, arg){
  preparar(vista, arg);
  try{ history.pushState({v:ST.vista, a:arg}, '', ''); }catch(e){}
  render();
}
window.addEventListener('popstate', function(e){
  var s=e.state;
  if(s && s.v){ preparar(s.v, s.a); render(); }
  else { preparar('inicio'); render(); }
});
btnVolver.onclick=function(){
  if(ST.vista==='inicio' && (ST.triage!==null || ST.filtro)){ ST.triage=null; ST.filtro=''; vistaInicio(); return; }
  try{ if(history.length>1){ history.back(); return; } }catch(e){}
  ir('inicio');
};
document.getElementById('btnAjustes').onclick=function(){ ir('ajustes'); };

/* ---------- arranque ---------- */
aplicarAjustes();
if(ST.ajustes.wake) pedirWake();
try{ history.replaceState({v:'inicio'}, '', ''); }catch(e){}
render();
if(!ALM.ok){
  setTimeout(function(){ toast('Este teléfono no deja guardar: copiá el informe antes de cerrar'); }, 900);
}
</script>
</body>
</html>
