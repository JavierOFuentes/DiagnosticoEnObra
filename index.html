],
med:{campos:[
 {id:'nlum', lbl:'Cantidad de luminarias del circuito terminal', u:''},
 {id:'idem', lbl:'Demanda de potencia máxima simultánea del circuito, en corriente', u:'A'},
 {id:'inp', lbl:'Corriente asignada del dispositivo de protección del circuito', u:'A'},
 {id:'bat', lbl:'¿Son luminarias con batería de acumuladores incorporada?', tipo:'bool'},
 {id:'sup', lbl:'Superficie del ambiente servido', u:'m²'},
 {id:'nbocas', lbl:'Bocas de iluminación de seguridad en ese ambiente', u:''},
 {id:'ncirc', lbl:'Cantidad de circuitos distintos que las alimentan', u:''},
 {id:'baja', lbl:'¿Hay luminarias de seguridad a menos de 2,25 m o al alcance de la mano?', tipo:'bool'},
 {id:'mbts', lbl:'¿Esas luminarias están alimentadas con MBTS?', tipo:'bool'}
], ev:function(v){
 var li=[], e='ok', d='';
 var hay=false;
 if(v.nlum!==null){ hay=true; d+='<span class="num">'+f(v.nlum,0)+'</span> luminarias en el circuito (máximo 15). ';
   if(v.nlum>15){ e='mal'; li.push('El circuito alimenta '+f(v.nlum,0)+' luminarias y el máximo admitido es 15. Desdoblar el circuito.'); }
   else li.push('La cantidad de luminarias está dentro del máximo de 15.'); }
 if(v.idem!==null && v.inp!==null && v.inp>0){ hay=true;
   var p=v.idem/v.inp;
   d+='Demanda <span class="num">'+f(v.idem,1)+' A</span> sobre una protección de <span class="num">'+f(v.inp,0)+' A</span> = <span class="num">'+f(p*100,0)+' %</span> (máximo 70 %). ';
   if(v.bat===true) li.push('El límite del 70 % no se aplica a los cables de alimentación de las luminarias con batería de acumuladores incorporada. Verificar igual el máximo de 15 luminarias, que sí rige.');
   else if(p>0.70){ e='mal'; li.push('La demanda alcanza el '+f(p*100,0)+' % de la corriente asignada de la protección, por encima del 70 % admitido. Bajar la carga del circuito o subir la protección si el conductor lo admite.'); }
   else li.push('La demanda está por debajo del 70 % de la corriente asignada de la protección.');
 }
 if(v.sup!==null && v.nbocas!==null){ hay=true;
   var min = (v.sup>100) ? 2 : 1;
   d+='Ambiente de <span class="num">'+f(v.sup,0)+' m²</span> con <span class="num">'+f(v.nbocas,0)+'</span> boca(s) de seguridad (mínimo '+min+'). ';
   if(v.nbocas<min){ e='mal'; li.push('En locales o ambientes de pública concurrencia debe haber por lo menos una boca de iluminación de seguridad, y en los de más de 100 m² por lo menos dos, conectadas a circuitos separados. Acá faltan '+(min-v.nbocas)+'.'); }
   else if(min===2 && v.ncirc!==null && v.ncirc<2){ e='mal'; li.push('Hay dos bocas o más, pero alimentadas desde un solo circuito. En un ambiente de más de 100 m² tienen que estar conectadas a circuitos separados: si cae uno, el ambiente no queda a oscuras.'); }
   else li.push('La cantidad de bocas de seguridad verifica.');
 }
 if(v.baja===true){ hay=true;
   if(v.mbts===false){ e='mal'; li.push('Hay luminarias de seguridad al alcance de la mano, a menos de 2,25 m, sin alimentación con MBTS. La reglamentación exige que en esa situación se alimenten con muy baja tensión de seguridad. Corregirlo.'); }
   else if(v.mbts===true) li.push('Las luminarias bajas están alimentadas con MBTS, como corresponde.'); }
 if(!hay) return null;
 li.push('En ambientes y rutas de evacuación con más de una luminaria, las luminarias de la iluminación NORMAL deben conectarse en forma alternada a por lo menos dos circuitos provenientes de interruptores diferenciales independientes. Es un requisito de la iluminación normal, no de la de emergencia, y se pasa por alto muy seguido.');
 li.push('Los interruptores de la iluminación de emergencia van en el tablero seccional del área servida, y su posición «conectado» debe estar visiblemente indicada en el tablero o en la fuente de emergencia.');
 li.push('En lugares de trabajo de más de 100 m² o de alto riesgo, donde una falla súbita de la iluminación implique riesgo, las luminarias deben alimentarse con por lo menos dos sistemas de alimentación independientes. Uno de ellos puede estar incorporado a la propia luminaria.');
 return {e:e, t: e==='mal'?'El circuito no cumple':'El circuito cumple', d:d, li:li};
}},
sol:['Desdoblar los circuitos que superen las 15 luminarias o el 70 % de la corriente de su protección.','Agregar la segunda boca de seguridad y su circuito separado en ambientes de más de 100 m².','Pasar a MBTS las luminarias de seguridad que queden al alcance de la mano.','Repartir las luminarias de iluminación normal en forma alternada entre dos circuitos con diferenciales independientes.','Llevar los interruptores de emergencia al tablero seccional del área servida y señalizar la posición conectado.'],
cita:'AEA 90364-7-718 (2008), 718.556.2.1.2: máximo 15 luminarias por circuito terminal; demanda de potencia máxima simultánea no mayor al 70 % de la corriente asignada del dispositivo de protección, salvo para los cables de alimentación de luminarias con batería incorporada; al menos una boca de seguridad por ambiente de pública concurrencia y dos en circuitos separados si supera los 100 m²; MBTS obligatoria para luminarias a menos de 2,25 m o al alcance de la mano; dos sistemas de alimentación independientes en lugares de trabajo de más de 100 m² o de alto riesgo.'
});

F.push({
id:'E5', fam:'eme', t:'Suministro complementario de seguridad o de emergencia',
sint:'Determinar si el local necesita una segunda fuente de energía además de la normal, y de qué tamaño.',
causas:['Local que por su tipo u ocupación exige suministro complementario','Fuente existente subdimensionada respecto de la potencia contratada','Grupo electrógeno o batería que no arranca dentro del tiempo admitido','Habilitación que observa la falta de fuente de emergencia'],
eq:[EQ.ut219],
pasos:[
 'Determinar el tipo de local y su ocupación con la ficha E1.',
 'Anotar la potencia total contratada para el suministro normal.',
 'Anotar la potencia de la fuente complementaria existente, si la hay.',
 'Verificar el tipo de fuente: batería de acumuladores, grupo generador independiente, u otra alimentación desde la red pública efectivamente independizada de la normal.',
 'Cronometrar el tiempo de respuesta de la conmutación con un corte real de la alimentación normal.'
],
med:{campos:[
 {id:'tipo', lbl:'Tipo de local', tipo:'sel', opts:[
   ['espect','Espectáculos, actos o actividades recreativas'],
   ['reunion','Reunión o trabajo'],
   ['salud','Hospital, clínica, sanatorio, ambulatorio o centro de salud'],
   ['estacion','Estación de viajeros o aeropuerto'],
   ['garaje','Garaje subterráneo'],
   ['comercio','Establecimiento comercial o centro comercial'],
   ['estadio','Estadio o pabellón deportivo'],
   ['otro','Otro']]},
 {id:'ocup', lbl:'Ocupación prevista', u:'pers.'},
 {id:'nveh', lbl:'Cantidad de vehículos del garaje', u:''},
 {id:'sup', lbl:'Superficie del establecimiento comercial', u:'m²'},
 {id:'ptot', lbl:'Potencia total contratada para el suministro normal', u:'kVA'},
 {id:'pcompl', lbl:'Potencia de la fuente complementaria existente', ayuda:'Vacío si no hay', u:'kVA'},
 {id:'tresp', lbl:'Tiempo de respuesta medido de la conmutación', u:'s'}
], ev:function(v){
 if(!v.tipo) return null;
 var emerg=false, segur=false, motivo='';
 if(v.tipo==='salud'||v.tipo==='estacion'||v.tipo==='estadio'){ emerg=true; motivo='el tipo de local lo exige siempre'; }
 else if(v.tipo==='garaje'){ if(v.nveh===null) return null; if(v.nveh>100){ emerg=true; motivo='garaje subterráneo para '+f(v.nveh,0)+' vehículos, más de 100'; } }
 else if(v.tipo==='comercio'){ if(v.sup===null) return null; if(v.sup>2000){ emerg=true; motivo='establecimiento comercial de '+f(v.sup,0)+' m², más de 2000'; } }
 if(v.tipo==='espect'){ segur=true; motivo=motivo||'local de espectáculos, actos o actividades recreativas, cualquiera sea su ocupación'; }
 if(v.tipo==='reunion'){ if(v.ocup===null) return null; if(v.ocup>300){ segur=true; motivo=motivo||'local de reunión o trabajo con ocupación prevista de '+f(v.ocup,0)+' personas, más de 300'; } }
 if(!emerg && !segur) return {e:'ok', t:'No exige suministro complementario',
   d:'Con los datos cargados el local no queda entre los que exigen suministro complementario de seguridad ni de emergencia.',
   li:['La iluminación de emergencia se exige igual, por separado: ver fichas E2 y E3. Puede resolverse con luminarias autónomas de batería incorporada.','Si el rubro o la ocupación cambian, rehacer esta verificación.','La autoridad de aplicación local puede exigir más.']};
 var pide = emerg ? 'emergencia' : 'seguridad';
 var pct = emerg ? 25 : 15;
 var d = 'Corresponde suministro complementario de <span class="num">'+pide+'</span> porque '+motivo+'. Potencia receptora mínima: <span class="num">'+pct+' %</span> del total contratado para el suministro normal.';
 var li=[];
 if(emerg && segur) li.push('El local queda en los dos grupos. Cuando corresponden simultáneamente suministro de seguridad y de emergencia, se instala únicamente el de emergencia.');
 var e='ojo';
 if(v.ptot!==null){
   var req = v.ptot*pct/100;
   d += ' Sobre <span class="num">'+f(v.ptot,1)+' kVA</span> contratados, hacen falta al menos <span class="num">'+f(req,1)+' kVA</span>.';
   if(v.pcompl===null){ e='mal'; li.push('No hay fuente complementaria cargada. Si no existe, hay que instalarla: batería de acumuladores, grupo generador independiente de la alimentación normal, u otra alimentación desde la red pública efectivamente independizada de la normal.'); }
   else if(v.pcompl < req){ e='mal'; li.push('La fuente existente entrega '+f(v.pcompl,1)+' kVA y hacen falta '+f(req,1)+' kVA. Está subdimensionada: ampliarla o reemplazarla.'); }
   else { e='ok'; li.push('La fuente existente de '+f(v.pcompl,1)+' kVA cubre el mínimo exigido de '+f(req,1)+' kVA.'); }
 }
 if(v.tresp!==null){
   if(v.tresp>15){ e='mal'; li.push('El tiempo de respuesta medido es de '+f(v.tresp,1)+' s. Para los sistemas de reemplazo y de potencia de emergencia el máximo es 15 s (corte mediano); para evacuación y anti-pánico, 0,5 s (corte breve).'); }
   else li.push('El tiempo de respuesta de '+f(v.tresp,1)+' s está dentro del corte mediano de 15 s. Si esa misma fuente alimenta la iluminación de evacuación o anti-pánico, el límite baja a 0,5 s.');
 }
 li.push('La conmutación a emergencia debe arrancar automáticamente si la tensión normal cae por debajo de 0,6 veces su valor nominal durante al menos 0,5 s, y volver a la normal cuando ésta se recupere a por lo menos 0,85 veces el nominal durante más de un minuto.');
 li.push('Una fuente de emergencia no puede usarse para otros fines, salvo que su disponibilidad para los servicios de emergencia no se vea afectada. Y ningún circuito de emergencia puede quedar fuera de servicio por una falla en otro circuito que no sea de emergencia.');
 li.push('Las fuentes de emergencia se instalan como equipos fijos, accesibles sólo a personal BA4 y BA5, y en recintos ventilados en forma independiente para que los gases no lleguen a áreas ocupadas.');
 return {e:e, t: e==='mal'?'Exige suministro complementario y no cumple':(e==='ok'?'Exige suministro complementario y verifica':'Exige suministro complementario'), d:d, li:li};
}},
sol:['Instalar o ampliar la fuente complementaria hasta el porcentaje que corresponda: 15 % para seguridad, 25 % para emergencia.','Si corresponden ambos, instalar únicamente el de emergencia.','Verificar el tiempo de respuesta con un corte real y dejarlo cronometrado.','Alojar la fuente en recinto propio, ventilado en forma independiente y accesible sólo a personal autorizado.','Ensayar el grupo electrógeno una vez por mes, una hora al 50 % de su carga nominal.'],
cita:'AEA 90364-7-718 (2008), 718.3.21.2: suministro de seguridad mínimo 15 % de la potencia contratada, de emergencia 25 %, duplicado más del 50 %. 718.556.2.4 y Tabla 718.III: quiénes lo requieren. 718.352: clasificación de los tiempos de corte, sin corte, muy breve 0,15 s, breve 0,5 s, mediano 15 s y largo más de 15 s. 718.556.2.5.1.1: umbrales de conmutación de 0,6 y 0,85 veces la tensión nominal. 718.353: requisitos de las fuentes.'
});
F.push({
id:'E6', fam:'eme', t:'Protecciones y puesta a tierra de los circuitos de emergencia',
sint:'Los circuitos de emergencia se protegen distinto que el resto de la instalación. Acá es donde más se equivoca el que aplica la 7-771 por costumbre.',
causas:['Circuitos de emergencia protegidos con diferencial de 30 mA','Esquema TT o TN-S aplicado a los circuitos de emergencia','Falta de controlador permanente de aislación en esquema IT','Motores del sistema de incendio conectados por tomacorriente'],
eq:[EQ.ut511, EQ.f117v],
pasos:[
 'Identificar qué esquema de conexión a tierra tienen los circuitos de emergencia. El preferido es el IT.',

],
med:{campos:[
 {id:'ect', lbl:'Esquema de conexión a tierra de los circuitos de emergencia', tipo:'sel', opts:[['it','IT'],['tt','TT'],['tns','TN-S'],['nd','No está definido o no se sabe']]},
 {id:'cpa', lbl:'¿Hay controlador permanente de aislación con señal sonora y visual?', tipo:'bool'},
 {id:'pat', lbl:'Si el esquema es IT, ¿cómo se ponen a tierra las masas de los equipos?', tipo:'sel', opts:[['grupos','Por grupos o individualmente'],['general','En forma general, todas interconectadas'],['na','No aplica']]},
 {id:'dif', lbl:'¿Los circuitos de emergencia están protegidos con diferencial de 30 mA?', tipo:'bool'},
 {id:'medida', lbl:'Medida adoptada contra contactos indirectos', tipo:'sel', opts:[['it','IT con controlador permanente de aislación'],['equi','Interconexiones equipotenciales locales no conectadas a tierra'],['sep','Separación eléctrica'],['corte','Corte automático de la alimentación']]},
 {id:'directos', lbl:'¿Hay aislación de las partes activas Y barreras o envolturas, las dos a la vez?', tipo:'bool'},
 {id:'fijo', lbl:'¿Los motores del sistema de extinción están conectados en forma fija?', tipo:'bool'}
], ev:function(v){
 var li=[], e='ok', d='';
 var hay=false;
 if(v.ect){ hay=true; d+='Esquema declarado: <span class="num">'+v.ect.toUpperCase()+'</span>. ';
   if(v.ect==='it'){
     li.push('El esquema IT es el preferido para las instalaciones eléctricas de emergencia: ante la primera falla no se corta la alimentación, que es exactamente lo que se busca en un sistema del que depende la evacuación.');
     if(v.cpa===false){ e='mal'; li.push('Falta el controlador permanente de aislación. En esquema IT es obligatorio y debe indicar la primera falla a tierra mediante una señal sonora y otra visual. El controlador no corta la alimentación: avisa.'); }
     else if(v.cpa===true) li.push('El controlador permanente de aislación está. Verificar que la señal llegue al menos al recinto de la bomba de incendio o de los presurizadores de las rutas de evacuación.');
     if(v.pat==='grupos') li.push('Con puesta a tierra de las masas por grupos o individual, las protecciones deben elegirse para cumplir con un esquema TT, que es en lo que se convierte la instalación después de la primera falla.');
     else if(v.pat==='general') li.push('Con puesta a tierra general de todas las masas interconectadas, las protecciones deben elegirse para cumplir con un esquema TN, que es en lo que se convierte la instalación después de la primera falla.');
   } else if(v.ect==='nd'){ e='mal'; li.push('El esquema no está definido. Sin eso no se puede elegir la protección: definirlo y dejarlo asentado en el unifilar.'); }
   else { if(e!=='mal') e='ojo'; li.push('El esquema preferido para las instalaciones de emergencia es el IT, no el '+v.ect.toUpperCase()+'. Si se mantiene el actual, hay que justificar por qué y verificar que ante la primera falla no se corte la alimentación de un servicio del que depende la evacuación.'); }
 }
 if(v.dif===true){ hay=true; e='mal';

   li.push('La medida adoptada contra contactos indirectos es el corte automático de la alimentación, que no corresponde en circuitos de emergencia. Las tres admitidas son: esquema IT con controlador permanente de aislación, interconexiones equipotenciales locales no conectadas a tierra, o separación eléctrica.'); }
 else if(v.medida){ hay=true; li.push('La medida adoptada está entre las tres admitidas para circuitos de emergencia.');
   if(v.medida==='equi') li.push('Con interconexión equipotencial local no conectada a tierra, las canalizaciones metálicas y los conductos de agua, aire o vapor que ingresen al recinto deben estar interrumpidos galvánicamente del exterior, con aislaciones incombustibles o encerradas en cajas capaces de resistir un fuego exterior de 950 °C durante 120 minutos.'); }
 if(v.directos===false){ hay=true; e='mal';
   li.push('Contra contactos directos se exigen las dos medidas simultáneamente: aislación de las partes activas Y barreras o envolturas. No es una u otra.'); }
 else if(v.directos===true){ hay=true; li.push('Las dos medidas contra contactos directos están aplicadas, como exige la reglamentación.'); }
 if(v.fijo===false){ hay=true; e='mal';

 if(!hay) return null;
 li.push('La protección contra sobrecargas puede omitirse cuando la pérdida de la alimentación puede causar un peligro mayor; en ese caso conviene supervisar la aparición de sobrecargas en lugar de cortar.');

 li.push('Si un equipo se alimenta desde dos fuentes distintas y necesita conductor de protección, ese conductor debe conectarse a los conductores de protección de ambos circuitos.');
 return {e:e, t: e==='mal'?'Las protecciones no corresponden':(e==='ojo'?'Revisar el esquema adoptado':'Las protecciones corresponden'), d:d, li:li};
}},
sol:['Sacar los diferenciales de 30 mA de los circuitos de emergencia: producen desconexiones intempestivas de un servicio esencial.','Adoptar esquema IT con controlador permanente de aislación, con señal sonora y visual de primera falla.','Aplicar simultáneamente aislación de partes activas y barreras o envolturas contra contactos directos.','Conectar en forma fija todos los motores del sistema de extinción.','Dejar el tablero seccional preparado para medir aislación circuito por circuito.'],
cita:'AEA 90364-7-718 (2008), 718.556.4: el esquema de conexión a tierra preferido es el IT, con controlador permanente de aislación que indique la primera falla con señal sonora y visual. 718.556.5.1.1: contra contactos directos, aislación de partes activas y barreras o envolturas utilizadas simultáneamente, y no se aplica la protección complementaria con diferencial de 30 mA o menor. 718.556.5.1.2: contra contactos indirectos, IT con CPA, interconexiones equipotenciales locales no conectadas a tierra o separación eléctrica, y no el corte automático. 718.556.5.2.1: los tableros deben permitir medir la aislación de cada circuito de salida.'

F.push({

eq:[EQ.ir],

med:{campos:[

 {id:'compart', lbl:'¿Comparte el mismo cable o el mismo recorrido con circuitos de servicio normal?', tipo:'bool'},

 {id:'rutainst', lbl:'Forma de instalación en la ruta de evacuación', tipo:'sel', opts:[

 {id:'multi', lbl:'¿Cada cable multiconductor está asociado a un solo circuito de emergencia?', tipo:'bool'}
], ev:function(v){
 if(!v.serv) return null;
 var F30={alarma:1,aviso:1,ilum:1}, F90={agua:1,presur:1,humo:1,ascbomb:1};
 var exige = F90[v.serv] ? 90 : (F30[v.serv] ? 30 : 0);

 if(v.hueco===true){ e='mal';

 if(v.rutainst==='vistacom'){ e='mal';

 else if(v.rutainst==='emb') li.push('La canalización embutida en la ruta debe quedar cubierta por un mínimo de 15 mm de mortero no combustible, y la sección remanente de la pared o losa, descontando la canalización, debe mantener el tiempo de resistencia al incendio requerido.');

 if(v.multi===false){ if(e!=='mal') e='mal';

 li.push('En las cajas de escalera y sus salidas al exterior que formen parte de la ruta sólo se permiten las canalizaciones que alimenten exclusivamente los servicios de esas cajas de escalera o la detección y aviso de incendio.');

 return {e:e, t: e==='mal'?'La canalización no cumple':'La canalización cumple', d:d, li:li};
}},

cita:'AEA 90364-7-718 (2008), 718.556.6.3.1: F30 para alarma de incendio, advertencia a visitantes y empleados e iluminación de emergencia; F90 para presurización del agua contra incendio, presurización de escaleras y huecos de ascensores de bomberos, extracción de humo y calor y ascensores para bomberos. 718.556.6.3.2: tipos de cable admitidos. 718.556.6.1: independencia de los circuitos, prohibición de atravesar BE2 y BE3, un solo circuito por cable multiconductor, prohibición en huecos de ascensor y conductos de ventilación. 718.556.6.2: cables IRAM 62266 y 62267 y canalizaciones no propagantes donde no se exige funcionamiento durante el incendio. 718.556.6.4: canalizaciones permitidas en los medios de escape, con los 15 mm de mortero y el F90 de plenos y cielorrasos.'

/* Resolución tolerante de instrumentos: toma la ficha de equipo de la app
   si existe, y omite en silencio la que no. */
function _eq(){ var r=[],i,k; for(i=0;i<arguments.length;i++){ k=arguments[i];
  if(typeof EQ!=='undefined' && EQ[k]) r.push(EQ[k]); } return r; }

/* ---------- Dibujo de zonas (SVG inline, sin dependencias) ---------- */
var Z_COL={0:'#ef8080',1:'#f6b96b',2:'#f2df72',3:'#a9d7b4'};

function _zesc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function svgZonasBano(p){
  /* p: {x1,x2,hz1,hc,hf,prof,L,hs,art,tab,htab,recorte} en metros */
  var W=p.x2+0.80, H=Math.max(p.hc,p.hz1)+0.35;
  var s=Math.min(600/W, 330/H), ox=84, oy=22;
  var X=function(m){return ox+m*s;}, Y=function(m){return oy+(H-0.35-m)*s;};
  var o=[], r=function(x0,y0,x1,y1,c,op){
    var a=X(x0),b=Y(y1),w=(x1-x0)*s,h=(y1-y0)*s;
    if(w<=0.5||h<=0.5) return;
    o.push('<rect x="'+a.toFixed(1)+'" y="'+b.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+c+'" opacity="'+(op||1)+'"/>');
  };
  var t=function(x,y,txt,anc,sz,col){
    o.push('<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" font-family="ui-sans-serif,system-ui,sans-serif" font-size="'+(sz||11)+'" fill="'+(col||'#1d2327')+'" text-anchor="'+(anc||'middle')+'">'+_zesc(txt)+'</text>');
  };
  var ln=function(x0,y0,x1,y1,col,dash){
    o.push('<line x1="'+X(x0).toFixed(1)+'" y1="'+Y(y0).toFixed(1)+'" x2="'+X(x1).toFixed(1)+'" y2="'+Y(y1).toFixed(1)+'" stroke="'+(col||'#4a545c')+'" stroke-width="1"'+(dash?' stroke-dasharray="4 3"':'')+'/>');
  };

  o.push('<rect x="0" y="0" width="'+(W*s+ox+18).toFixed(0)+'" height="'+(H*s+oy+30).toFixed(0)+'" fill="#fbfaf7"/>');
  /* zona 3 de fondo */
  r(0,0,W,p.hc,Z_COL[3],0.55);
  /* zona 2 */
  r(p.x1,0,p.x2,p.hc,Z_COL[2],0.95);
  /* zona 1 */
  r(0,0,p.x1,p.hz1,Z_COL[1],0.95);
  /* zona 0 */
  if(p.art==='duchaS'){ r(0,0,p.x1,0.10,Z_COL[0],1); }
  else { r(0,p.hf,p.L,p.hf+p.prof,Z_COL[0],1); }

  /* artefacto */
  if(p.art!=='duchaS'){
    o.push('<path d="M'+X(0)+' '+Y(p.hf+p.prof)+' L'+X(0)+' '+Y(p.hf)+' L'+X(p.L)+' '+Y(p.hf)+' L'+X(p.L)+' '+Y(p.hf+p.prof)+'" fill="none" stroke="#2b3238" stroke-width="2"/>');
    ln(0,p.hf,p.L,p.hf,'#2b3238');
  }
  /* flor / salida de agua */
  o.push('<circle cx="'+X(0.13).toFixed(1)+'" cy="'+Y(p.hs).toFixed(1)+'" r="4" fill="#2b3238"/>');
  t(X(0.13)+8,Y(p.hs)-5,(p.art==='duchaS'||p.dl!=='no')?(p.dl==='movil'?'conexión del flexible':'flor fija'):'salida de agua','start',10,'#2b3238');

  /* piso, pared, cielorraso */
  o.push('<rect x="'+X(0).toFixed(1)+'" y="'+Y(0).toFixed(1)+'" width="'+(W*s).toFixed(1)+'" height="7" fill="#8d9298"/>');
  o.push('<rect x="'+(X(0)-9).toFixed(1)+'" y="'+Y(p.hc).toFixed(1)+'" width="9" height="'+(p.hc*s).toFixed(1)+'" fill="#8d9298"/>');
  o.push('<rect x="'+X(0).toFixed(1)+'" y="'+(Y(p.hc)-7).toFixed(1)+'" width="'+(W*s).toFixed(1)+'" height="7" fill="#8d9298"/>');

  /* tabique fijo que limita zonas */
  if(p.tab){
    o.push('<rect x="'+X(p.x1-0.03).toFixed(1)+'" y="'+Y(p.htab).toFixed(1)+'" width="'+Math.max(4,0.06*s).toFixed(1)+'" height="'+(p.htab*s).toFixed(1)+'" fill="#5b666e"/>');
  }

  /* cotas */
  var xc=p.x1+ (p.x2-p.x1)/2;
  ln(p.x1,p.hc*0.62,p.x2,p.hc*0.62,'#2b3238');
  t(X(xc),Y(p.hc*0.62)-6,'0,60 m','middle',11);
  o.push('<line x1="'+(ox-16)+'" y1="'+Y(p.hz1).toFixed(1)+'" x2="'+X(p.x1).toFixed(1)+'" y2="'+Y(p.hz1).toFixed(1)+'" stroke="#2b3238" stroke-width="1.4" stroke-dasharray="5 3"/>');
  t(ox-12,Y(p.hz1)+4,f(p.hz1,2)+' m','end',11);
  t(ox-12,Y(p.hz1)+18,'techo z.1','end',9,'#5b666e');
  if(p.hf>0.02){ ln(0,p.hf,W-0.2,p.hf,'#8d9298',true); t(X(W-0.2),Y(p.hf)-4,'base = fondo','end',9,'#5b666e'); }

  /* etiquetas de zona */
  if(p.art!=='duchaS'&&p.prof>0.15) t(X(p.L/2),Y(p.hf+p.prof/2)+4,'0','middle',13,'#5a1414');
  else if(p.art==='duchaS') t(X(p.x1)+16,Y(0.05)+4,'0','start',11,'#5a1414');
  t(X(Math.min(p.x1,p.L)/2+ (p.art==='duchaS'?p.x1/2- p.x1/2:0)),Y(p.hz1*0.72),'1','middle',14,'#6a3b06');
  t(X(xc),Y(p.hc*0.85),'2','middle',14,'#5e5209');
  if(W-p.x2>0.35) t(X(p.x2+(W-p.x2)/2),Y(p.hc*0.5),'3','middle',14,'#1d4c2c');
  return '<svg viewBox="0 0 '+(W*s+ox+18).toFixed(0)+' '+(H*s+oy+30).toFixed(0)+'" width="100%" style="max-width:100%;border-radius:8px;display:block">'+o.join('')+'</svg>';
}

function svgZonasPileta(p){
  /* pileta de cocina / de lavar / bidé / lavabo — figuras 701.B.6 a B.9 */
  var L=p.L, W=L+0.15*2+0.55, H=p.hb+0.40+0.45;
  var s=Math.min(600/W,290/H), ox=52, oy=20;
  var X=function(m){return ox+m*s;}, Y=function(m){return oy+(H-0.30-m)*s;};
  var o=[];
  var r=function(x0,y0,x1,y1,c,op){var a=X(x0),b=Y(y1),w=(x1-x0)*s,h=(y1-y0)*s;
    if(w<=0.5||h<=0.5)return; o.push('<rect x="'+a.toFixed(1)+'" y="'+b.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+c+'" opacity="'+(op||1)+'"/>');};
  var t=function(x,y,txt,anc,sz,col){o.push('<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" font-family="ui-sans-serif,system-ui,sans-serif" font-size="'+(sz||11)+'" fill="'+(col||'#1d2327')+'" text-anchor="'+(anc||'middle')+'">'+_zesc(txt)+'</text>');};
  o.push('<rect x="0" y="0" width="'+(W*s+ox+18).toFixed(0)+'" height="'+(H*s+oy+26).toFixed(0)+'" fill="#fbfaf7"/>');
  /* zona 1: 0,15 m a cada lado, 0,40 m por encima, y todo el volumen por debajo hasta el piso */
  r(0.30,0,0.30+L+0.30,p.hb+0.40,Z_COL[1],0.95);
  /* zona 0: el interior de la pileta */
  r(0.45,p.hb-p.prof,0.45+L,p.hb,Z_COL[0],1);
  o.push('<path d="M'+X(0.45)+' '+Y(p.hb)+' L'+X(0.45)+' '+Y(p.hb-p.prof)+' L'+X(0.45+L)+' '+Y(p.hb-p.prof)+' L'+X(0.45+L)+' '+Y(p.hb)+'" fill="none" stroke="#2b3238" stroke-width="2"/>');
  /* mesada */
  o.push('<rect x="'+X(0.30).toFixed(1)+'" y="'+(Y(p.hb)-3).toFixed(1)+'" width="'+((L+0.30)*s).toFixed(1)+'" height="4" fill="#2b3238"/>');
  /* piso */
  o.push('<rect x="'+X(0).toFixed(1)+'" y="'+Y(0).toFixed(1)+'" width="'+(W*s).toFixed(1)+'" height="7" fill="#8d9298"/>');
  /* cotas */
  o.push('<line x1="'+X(0.30).toFixed(1)+'" y1="'+Y(p.hb+0.40).toFixed(1)+'" x2="'+X(0.30+L+0.30).toFixed(1)+'" y2="'+Y(p.hb+0.40).toFixed(1)+'" stroke="#2b3238" stroke-width="1.4" stroke-dasharray="5 3"/>');
  t(X(0.30+(L+0.30)/2),Y(p.hb+0.40)-6,'0,40 m sobre el borde','middle',11);
  t(X(0.375),Y(p.hb+0.18),'0,15','middle',10);
  t(X(0.30+L+0.45),Y(p.hb+0.18),'0,15','middle',10);
  t(X(0.45+L/2),Y(p.hb-p.prof/2)+4,'0','middle',13,'#5a1414');
  t(X(0.45+L/2),Y(p.hb*0.45),'1','middle',14,'#6a3b06');
  return '<svg viewBox="0 0 '+(W*s+ox+18).toFixed(0)+' '+(H*s+oy+26).toFixed(0)+'" width="100%" style="max-width:100%;border-radius:8px;display:block">'+o.join('')+'</svg>';
}

/* ---------- utilidades ---------- */
function f(n, dec){
  if(n===null||n===undefined||isNaN(n)) return '—';
  var d = (dec===undefined) ? (Math.abs(n)>=100?0:1) : dec;
  return n.toFixed(d).replace('.', ',');
}
function num(s){
  if(s===null||s===undefined) return null;
  s = String(s).trim().replace(/\s/g,'').replace(',', '.');
  if(s==='') return null;
  var n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function esc(s){
  return String(s===null||s===undefined?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function dosD(n){ return (n<10?'0':'')+n; }
function hoyISO(){ var d=new Date(); return d.getFullYear()+'-'+dosD(d.getMonth()+1)+'-'+dosD(d.getDate()); }
function fechaAR(iso){
  var m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3]+'/'+m[2]+'/'+m[1] : (iso||'');
}
function horaDe(ts){ var d=new Date(ts); return dosD(d.getHours())+':'+dosD(d.getMinutes()); }

/* Tabla 770-B.XI (= Tabla 771-H.XII, tomada de la Tabla 8 de IEC 60898-1) —
   potencia máxima disipada por polo a corriente nominal. Se lee por LÍMITE
   SUPERIOR de banda: un interruptor de 12 A cae en 10 < In ≤ 16 y disipa
   3,5 W, no 3 W. Sobre 125 A la tabla no llega y el dato lo da el fabricante. */
var TAB_PDPOLO = [[10,3],[16,3.5],[25,4.5],[32,6],[40,7.5],[50,9],[63,13],[100,15],[125,20]];
function wPorPolo(inA){
  if(inA===null || inA===undefined || !(inA>0)) return null;
  for(var i=0;i<TAB_PDPOLO.length;i++) if(inA<=TAB_PDPOLO[i][0]) return TAB_PDPOLO[i][1];
  return null;
}
/* Factor de utilización del circuito de entrada, por convención 0,85
   (770-B.3 y Anexo 771-H). Va sólo a la cabecera, nunca a las salidas. */
var KE_ENTRADA = 0.85;
function pdAparato(a){
  if(!a) return null;
  var w = (a.w!==null && a.w!==undefined && String(a.w)!=='') ? num(a.w) : wPorPolo(a.in);
  if(w===null || isNaN(w)) return null;
  return {w:w, pd: w*(a.p||1)*(a.n||1), propio:!!(a.w!==null && a.w!==undefined && String(a.w)!=='')};
}
function opcionesIn(){
  var h='', i;

  return h;
}
function filasAparatos(l){
  l = Array.isArray(l)?l:[];
  if(!l.length) return '<li><span class="d">Todavía no cargaste ningún interruptor. Agregalos abajo y la Σ Pd se arma sola con la Tabla 770-B.XI.</span></li>';
  var h='', i, a, r;
  for(i=0;i<l.length;i++){
    a=l[i]; r=pdAparato(a);
    h+='<li><span class="d">'+((a.n||1)>1?(a.n+' u. '):'')+(a.p||1)+'×'+f(a.in,0)+' A · '+
       (a.rol==='cab'?'cabecera':'salida')+
       (r ? ' · '+f(r.w,1)+' W/polo'+(r.propio?' (fabricante)':'')
          : ' · <b>fuera de la Tabla 770-B.XI</b>')+
       '</span><span class="w">'+(r?f(r.pd,1)+' W':'—')+'</span>'+
       '<button type="button" data-apdel="'+i+'" aria-label="Quitar este aparato">×</button></li>';
  }
  return h;
}
function sumaAparatos(l){
  l = Array.isArray(l)?l:[];
  var tot=0, n=0, i, r;
  for(i=0;i<l.length;i++){ r=pdAparato(l[i]); if(r){ tot+=r.pd; n+=(l[i].n||1); } }
  if(!n) return 'Σ Pd = —';
  return 'Σ Pd = '+f(tot,1)+' W · '+n+' aparato'+(n===1?'':'s');
}
function textoAparatos(l){
  l = Array.isArray(l)?l:[];
  if(!l.length) return '—';
  var p=[], i, a;
  for(i=0;i<l.length;i++){ a=l[i]; p.push(((a.n||1)>1?(a.n+' u. '):'')+(a.p||1)+'×'+f(a.in,0)+' A'+(a.rol==='cab'?' cab.':'')); }
  return p.join(' · ')+' → '+sumaAparatos(l).replace('Σ Pd = ','Σ Pd ');
}

/* Barras horizontales con una línea de límite opcional */
function gBarras(o){

  for(i=0;i<bs.length;i++){
    var b=bs[i], w=Math.max(2, Math.min(ancho, (b.val/max)*ancho));

/* Anillo (dona) para el reparto de resultados */
function gDona(items, centro, sub){
  var W=340, H=150, cx=75, cy=75, r=52, gr=17, total=0;
  items.forEach(function(i){ total+=i.v; });
  var s=svgAbre(W,H);
  if(!total){ s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#E1E7EB" stroke-width="'+gr+'"/>'; }
  var ang=-Math.PI/2, i;
  for(i=0;i<items.length;i++){
    if(!items[i].v) continue;
    var a2=ang+(items[i].v/total)*Math.PI*2;
    var x1=cx+r*Math.cos(ang), y1=cy+r*Math.sin(ang), x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
    var grande=(a2-ang)>Math.PI?1:0;
    if(items[i].v===total){
      s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+items[i].c+'" stroke-width="'+gr+'"/>';
    } else {
      s+='<path d="M'+x1.toFixed(2)+' '+y1.toFixed(2)+' A'+r+' '+r+' 0 '+grande+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+
         '" fill="none" stroke="'+items[i].c+'" stroke-width="'+gr+'" stroke-linecap="butt"/>';
    }
    ang=a2;
  }
  s+=txt(cx, cy+4, centro, {a:'middle', fs:27, b:true, m:true, c:'#1B2733'});
  s+=txt(cx, cy+22, sub, {a:'middle', fs:10.5, c:'#5D6E7C'});

  for(i=0;i<items.length;i++){
    s+='<rect x="152" y="'+(y-9)+'" width="11" height="11" rx="2" fill="'+items[i].c+'"/>';
    s+=txt(170, y, items[i].t, {fs:11.5, c:'#41525F'});
    s+=txt(W-10, y, String(items[i].v), {a:'end', fs:11.5, b:true, m:true, c:'#1B2733'});
    y+=24;
  }
  s+='</svg>';
  return '<div class="graf">'+s+'</div>';
}
/* Triángulo de potencias, antes y después de compensar */
function gTriangulo(P,Q1,Q2){
  var W=340, H=190, ox=42, oy=H-34, esc0=Math.max(P, Q1, 1);
  var k=Math.min((W-ox-70)/esc0, (oy-24)/esc0);
  var s=svgAbre(W,H);
  s+='<line x1="'+ox+'" y1="'+oy+'" x2="'+(W-16)+'" y2="'+oy+'" stroke="#C9D2D9"/>';
  s+='<line x1="'+ox+'" y1="'+oy+'" x2="'+ox+'" y2="14" stroke="#C9D2D9"/>';
  var xp=ox+P*k;
  function tri(Q,color,dash){
    var yq=oy-Q*k;
    return '<path d="M'+ox+' '+oy+' L'+xp.toFixed(1)+' '+oy+' L'+xp.toFixed(1)+' '+yq.toFixed(1)+' Z" fill="'+
      color+'22" stroke="'+color+'" stroke-width="2"'+(dash?' stroke-dasharray="5 3"':'')+'/>';
  }
  s+=tri(Q1, GC.mal, true);
  s+=tri(Q2, GC.ok, false);
  s+=txt(ox+(xp-ox)/2, oy+15, 'P = '+f(P,1)+' kW', {a:'middle', fs:11, b:true, c:'#1B2733'});
  s+=txt(xp+6, oy-Q1*k+4, 'Q antes '+f(Q1,1), {fs:10.5, c:GC.mal, b:true});
  s+=txt(xp+6, oy-Q2*k+4, 'Q después '+f(Q2,1), {fs:10.5, c:GC.ok, b:true});
  s+=txt(ox-6, 20, 'kVAr', {a:'end', fs:10, c:'#8496A2'});
  s+='</svg>';
  return '<div class="graf">'+s+leyenda([{c:GC.mal,t:'Situación actual'},{c:GC.ok,t:'Con el capacitor'}])+'</div>';
}
/* Barra apilada contra un tope declarado */
function gApilada(partes, tope, unidad){
  var W=340, H=104, iz=14, ancho=W-28, alto=30;

  s+='<rect x="'+iz+'" y="34" width="'+ancho+'" height="'+alto+'" rx="3" fill="#E1E7EB"/>';

function buscarFalla(id){ for(var i=0;i<F.length;i++){ if(F[i].id===id) return F[i]; } return null; }
function buscarCalc(id){ for(var i=0;i<CALC.length;i++){ if(CALC[i].id===id) return CALC[i]; } return null; }
function nombreFam(id){ for(var i=0;i<FAMILIAS.length;i++){ if(FAMILIAS[i].id===id) return FAMILIAS[i].n; } return ''; }
function xref(t){
  return String(t).replace(/\b([Ff]icha)\s+([A-Z]{1,2}\d{1,2})\b/g, function(todo, pal, id){
    return buscarFalla(id) ? pal+' <button type="button" class="xref" data-id="'+id+'">'+id+'</button>' : todo;
  });

function toast(msg){
  var v=document.getElementById('toast'); if(v) v.parentNode.removeChild(v);
  var t=document.createElement('div'); t.className='toast'; t.id='toast'; t.textContent=msg;
  t.setAttribute('role','status');
  document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 2400);
}

/* ============================================================
   CALCULADORAS DE OBRA
   ============================================================ */
function opcSecc(hasta){
  return SECCIONES.filter(function(s){ return !hasta || s<=hasta; })
    .map(function(s){ return [String(s), f(s,s<10?1:0)+' mm²']; });
}
function factorTemp(t, aisl){
  for(var i=0;i<TAB_TEMP.length;i++) if(TAB_TEMP[i][0]===t) return TAB_TEMP[i][aisl==='xlpe'?2:1];
  return null;
}
function factorAgrup(n){
  var r=null;
  for(var i=0;i<TAB_AGRUP.length;i++){ if(TAB_AGRUP[i][0]<=n) r=TAB_AGRUP[i][1]; }
  return r;
}
function izTabla(s, tres){
  for(var i=0;i<TAB_IZ.length;i++) if(TAB_IZ[i][0]===s) return tres?TAB_IZ[i][2]:TAB_IZ[i][1];
  return null;
}
function proximaSeccion(s){
  for(var i=0;i<SECCIONES.length;i++) if(SECCIONES[i]>s) return SECCIONES[i];
  return null;
}

var CALC = [

/* ---------- K1 · caída de tensión ---------- */
{
id:'K1', t:'Caída de tensión', s:'ΔU por el método del gradiente, y la sección que hace falta',
ver:['C1','A3'],
campos:[
 {id:'sis', lbl:'Sistema', tipo:'sel', opts:[['mono','Monofásico — 220 V'],['tri','Trifásico — 380 V']]},
 {id:'mat', lbl:'Material del conductor', tipo:'sel', opts:[['cu','Cobre'],['al','Aluminio']]},
 {id:'reg', lbl:'Régimen de la carga', tipo:'sel', opts:[
    ['com','Carga común — cos φ = 0,8'],['arr','Arranque de motor — cos φ = 0,3']]},
 {id:'i', lbl:'Corriente de proyecto IB', ayuda:'Si la dejás vacía se calcula desde la potencia', u:'A'},
 {id:'p', lbl:'Potencia (opcional, para sacar IB)', u:'W'},
 {id:'l', lbl:'Longitud del circuito', ayuda:'Distancia entre los dos puntos, no el largo total de conductor. Con el GLM 50-27 CG, medir el recorrido del caño tramo por tramo y sumar: la línea recta da una caída menor que la real', u:'m'},
 {id:'s', lbl:'Sección del conductor', tipo:'sel', opts:opcSecc(120)},
 {id:'lim', lbl:'Límite que le corresponde', tipo:'sel', opts:[
    ['3','3 % — iluminación (y tomacorrientes en 7-770)'],
    ['5','5 % — circuito específico de motores, en régimen'],
    ['15','15 % — motores, durante el arranque'],
    ['1','1 % — circuito seccional'],
    ['2','2 % — terminal sin motores, medido desde el tablero seccional'],
    ['4','4 % — terminal con motores, desde el tablero seccional']]}
],
ev:function(v){
  var s=num(v.s), L=num(v.l), I=num(v.i), P=num(v.p);
  var sis=v.sis||'mono', mat=v.mat||'cu', reg=v.reg||'com';
  var U = sis==='tri' ? U_LIN : UN, cosf = reg==='arr' ? 0.3 : 0.8;
  if(I===null && P!==null) I = sis==='tri' ? P/(Math.sqrt(3)*U*cosf) : P/(U*cosf);
  if(s===null || L===null || I===null) return null;
  var gdc;
  if(reg==='arr'){
    if(s>70) return {e:'ojo', t:'Fuera de la tabla de arranque',
      d:'La tabla de gradientes para arranque de motores llega hasta 70 mm². Para secciones mayores hay que ir a la expresión completa ΔU = k·I·L·(R·cos φ + X·sen φ).', li:[]};
    gdc = GDC_ARRAN[sis][mat][s<=25?0:1];
  } else {
    gdc = GDC_COMUN[sis][mat];
  }
  var du = gdc*I*L/s, pc = du/U*100;
  var lim = parseFloat(v.lim||'3');
  var e = pc<=lim ? 'ok' : 'mal';
  /* sección mínima que cumple */
  var smin=null, i;
  for(i=0;i<SECCIONES.length;i++){
    var sc=SECCIONES[i];
    if(reg==='arr' && sc>70) break;
    var g = reg==='arr' ? GDC_ARRAN[sis][mat][sc<=25?0:1] : GDC_COMUN[sis][mat];
    if(g*I*L/sc/U*100 <= lim){ smin=sc; break; }
  }
  var lmax = lim*U*s/(100*gdc*I);
  var li=[
    'Gradiente aplicado: GDC = '+f(gdc,4).replace('0,','0,')+' V·mm²/(A·m), de la tabla del 771.19.7 c) para '+
      (sis==='tri'?'trifásico':'monofásico')+' en '+(mat==='cu'?'cobre':'aluminio')+
      (reg==='arr'?' durante el arranque (cos φ = 0,3)':' con carga común (cos φ = 0,8)')+'.',
    'ΔU = GDC · I · L / S = '+f(gdc,4)+' × '+f(I,1)+' A × '+f(L,0)+' m / '+f(s,1)+' mm² = '+f(du,2)+' V.',
    'Con esta sección y esta corriente, el circuito admite hasta '+f(lmax,0)+' m antes de pasarse del '+f(lim,0)+' %.'
  ];
  if(e==='mal'){
    li.push(smin ? 'La sección mínima que cumple con esta longitud y esta corriente es '+f(smin,smin<10?1:0)+' mm².'
                 : 'Ninguna sección de la tabla alcanza: hay que acortar el recorrido, subir la tensión de alimentación o repartir la carga.');
  }
  li.push('771.19.7 pide además cargar los circuitos de tomacorrientes en el extremo más alejado, y los de iluminación con el 66 % de la carga total en ese extremo.');
  return {
    e:e,
    t: e==='ok' ? 'Cumple: '+f(pc,2)+' % ≤ '+f(lim,0)+' %' : 'No cumple: '+f(pc,2)+' % > '+f(lim,0)+' %',
    d:'Caída de <span class="num">'+f(du,2)+' V</span> sobre '+f(U,0)+' V.',
    kpis:[
      {k:'Caída', v:f(pc,2), u:'%', e:e},
      {k:'ΔU', v:f(du,2), u:'V'},
      {k:'Corriente', v:f(I,1), u:'A'},
      {k:'Largo máximo', v:f(lmax,0), u:'m'}
    ],
    svg:gBarras({barras:[{lbl:'ΔU del circuito', val:pc, color:e==='ok'?GC.ok:GC.mal, txt:f(pc,2)+' %'}],
                 lim:{v:lim, lbl:'límite '+f(lim,0)+' %'}, max:Math.max(pc,lim)*1.3, alto:30}),
    li:li
  };
},
cita:'AEA 90364-7-771, 771.13 b) y 771.19.7 — máximas caídas admisibles y método c) del gradiente de caída GDC. AEA 90364-7-770, 770.15.6 para viviendas (iluminación y tomacorrientes 3 %). En 7-771 el circuito seccional no debe exceder el 1 %, de donde salen el 2 % y el 4 % de los terminales medidos desde el tablero seccional.'
},

/* ---------- K2 · sección, Iz y protección ---------- */
{
id:'K2', t:'Sección, Iz y calibre de la protección', s:'IB ≤ In ≤ Iz con agrupamiento y temperatura',
ver:['P5','P1','N3'],
campos:[
 {id:'s', lbl:'Sección del conductor', tipo:'sel', opts:opcSecc(300)},
 {id:'car', lbl:'Conductores cargados del circuito', tipo:'sel', opts:[
    ['2','2 cargados + PE — monofásico'],['3','3 cargados + N + PE — trifásico']]},
 {id:'ta', lbl:'Temperatura ambiente', tipo:'sel', opts:[
    ['10','10 °C'],['15','15 °C'],['20','20 °C'],['25','25 °C'],['30','30 °C'],['35','35 °C'],
    ['40','40 °C — referencia de la tabla'],['45','45 °C'],['50','50 °C'],['55','55 °C'],['60','60 °C']]},
 {id:'ncirc', lbl:'Circuitos agrupados en la misma canalización', ayuda:'Contando este. 1 = va solo', u:''},
 {id:'ib', lbl:'Corriente de proyecto IB', u:'A'},
 {id:'in', lbl:'Calibre del interruptor In', tipo:'sel', opts:SERIE_IN.map(function(x){ return [String(x), x+' A']; })}
],
ev:function(v){
  var s=num(v.s), tres=v.car==='3', ta=num(v.ta), nc=num(v.ncirc), ib=num(v.ib), In=num(v.in);
  if(s===null) return null;
  var iz0=izTabla(s, tres);
  if(iz0===null) return null;
  var ft = ta===null ? 1 : factorTemp(ta,'pvc');
  if(ft===null) return {e:'ojo', t:'Temperatura fuera de la columna PVC',
    d:'La columna de PVC de la Tabla 771.16.II.a llega hasta 60 °C. Por encima de eso hay que ir a un conductor de otra aislación.', li:[]};
  var fa = (nc===null||nc<=1) ? 1 : factorAgrup(Math.round(nc));
  if(fa===null) fa=0.38;
  var iz = iz0*ft*fa;
  var li=[], e='ok', t='';
  li.push('Iz de tabla a 40 °C para '+f(s,s<10?1:0)+' mm² con '+(tres?'3 conductores cargados':'2 conductores cargados')+': '+f(iz0,0)+' A.');
  li.push('Factor por temperatura ('+(ta===null?40:ta)+' °C, PVC): '+f(ft,2)+'. Factor por agrupamiento ('+(nc||1)+' circuito'+((nc||1)>1?'s':'')+'): '+f(fa,2)+'.');
  li.push('Iz corregida = '+f(iz0,0)+' × '+f(ft,2)+' × '+f(fa,2)+' = '+f(iz,1)+' A.');
  if(nc!==null && nc>3) li.push('Para más de 3 circuitos en un mismo caño la Tabla 771.16.II.b se queda corta: el factor sale de la Tabla 771.16.IV ítem 1, que la propia Reglamentación declara aplicable al método B1 de la 771.16.I.');
  if(ib!==null && In!==null){
    if(ib>In){ e='mal'; t='No cumple: IB > In'; li.push('El interruptor de '+f(In,0)+' A va a disparar por sobrecarga con la corriente de proyecto de '+f(ib,1)+' A.'); }
    else if(In>iz){ e='mal'; t='No cumple: In > Iz corregida';
      li.push('El conductor admite '+f(iz,1)+' A y el interruptor deja pasar hasta '+f(In,0)+' A: el conductor se puede recalentar sin que la protección actúe.');
      var smin=null;
      for(var i=0;i<SECCIONES.length;i++){
        var izc=izTabla(SECCIONES[i], tres);
        if(izc!==null && izc*ft*fa >= In){ smin=SECCIONES[i]; break; }
      }
      if(smin) li.push('Con este agrupamiento y esta temperatura, la sección mínima que soporta un interruptor de '+f(In,0)+' A es '+f(smin,smin<10?1:0)+' mm².');
    }
    else { e='ok'; t='Coordinación correcta: '+f(ib,1)+' ≤ '+f(In,0)+' ≤ '+f(iz,1)+' A'; }
  } else { e='ojo'; t='Iz corregida: '+f(iz,1)+' A'; li.push('Cargá IB y el calibre del interruptor para verificar la cadena completa IB ≤ In ≤ Iz.'); }
  var bs=[];
  if(ib!==null) bs.push({lbl:'IB proyecto', val:ib, color:GC.cel, txt:f(ib,1)+' A'});
  if(In!==null) bs.push({lbl:'In interruptor', val:In, color:GC.ink, txt:f(In,0)+' A'});
  bs.push({lbl:'Iz de tabla', val:iz0, color:GC.gris, txt:f(iz0,0)+' A'});
  bs.push({lbl:'Iz corregida', val:iz, color:(In!==null&&In>iz)?GC.mal:GC.ok, txt:f(iz,1)+' A'});
  return {e:e, t:t, d:'', kpis:[
      {k:'Iz corregida', v:f(iz,1), u:'A', e:e},
      {k:'Factor total', v:f(ft*fa,2), u:''},
      {k:'Iz de tabla', v:f(iz0,0), u:'A'}
    ], svg:gBarras({barras:bs, max:Math.max(iz0,In||0,ib||0)*1.2}), li:li};
},
cita:'AEA 90364-7-771: Tabla 771.16.I (Iz a 40 °C, conductores aislados en cañería, método B1), Tabla 771.16.II.a (temperatura), Tabla 771.16.II.b y Tabla 771.16.IV ítem 1 (agrupamiento), y 771.19.3 d) para la cadena IB ≤ In ≤ Iz.'
},

/* ---------- K3 · ocupación de caño ---------- */
{
id:'K3', t:'Ocupación de la cañería', s:'Qué caño admite los conductores del grupo',
ver:['N3'],
campos:[
 {id:'s1', lbl:'Sección — grupo 1', tipo:'sel', opts:opcSecc(70)},
 {id:'n1', lbl:'Cantidad de conductores cargados de esa sección', ayuda:'Sin contar el PE', u:''},
 {id:'s2', lbl:'Sección — grupo 2 (opcional)', tipo:'sel', opts:opcSecc(70)},
 {id:'n2', lbl:'Cantidad del grupo 2', u:''},
 {id:'spe', lbl:'Sección del conductor de protección', tipo:'sel', opts:opcSecc(70)},
 {id:'tipo', lbl:'Qué aloja el caño', tipo:'sel', opts:[
    ['term','Circuitos terminales'],['secc','Circuitos principales o seccionales']]}
],
ev:function(v){
  var s1=num(v.s1), n1=num(v.n1), s2=num(v.s2), n2=num(v.n2), spe=num(v.spe);
  if(s1===null||n1===null||n1<1) return null;
  var mezcla = (s2!==null && n2!==null && n2>0 && s2!==s1);
  var area = n1*(COND_A[s1]||0) + (mezcla ? n2*(COND_A[s2]||0) : 0) + (spe!==null ? (COND_A[spe]||0) : 0);
  var li=[], e, t, elegido=null, ocup=null;
  if(!mezcla){
    var n = n1 + ((s2!==null && n2!==null && s2===s1) ? n2 : 0);
    for(var i=0;i<CANOS.length;i++){
      if(CANOS[i].c[s1] !== undefined && CANOS[i].c[s1] >= n){ elegido=CANOS[i]; break; }
    }
    if(elegido){
      ocup = area/elegido.s*100;
      e='ok'; t='Entra en caño '+elegido.n;
      li.push('La Tabla 771.12.IX admite hasta '+elegido.c[s1]+' conductores de '+f(s1,s1<10?1:0)+' mm² más el PE en un caño '+elegido.n+'.');
      li.push('Ocupación resultante: '+f(ocup,1)+' % de la sección interna del caño ('+f(elegido.s,0)+' mm²).');
    } else {
      e='mal'; t='Ningún caño de la tabla admite ese grupo';
      li.push('La Tabla 771.12.IX no llega a '+n+' conductores de '+f(s1,s1<10?1:0)+' mm². Hay que repartir el grupo en dos canalizaciones — y si el grupo se divide, cambia también el factor de agrupamiento del cálculo K2.');
    }
  } else {
    /* secciones mezcladas: la tabla oficial no cubre el caso, se va al criterio de área */
    for(var j=0;j<CANOS.length;j++){
      if(area <= CANOS[j].s*0.35){ elegido=CANOS[j]; break; }
    }
    if(elegido){
      ocup = area/elegido.s*100;
      e='ojo'; t='Estimado: caño '+elegido.n;
      li.push('Con secciones mezcladas la Tabla 771.12.IX no aplica directamente. Se usó el criterio general de la misma cláusula: el área total ocupada, incluida la aislación, no debe superar el 35 % de la sección interna del caño.');
      li.push('Área de los conductores: '+f(area,1)+' mm². El 35 % del caño '+elegido.n+' es '+f(elegido.s*0.35,1)+' mm².');
      li.push('Marcado como ESTIMADO: la sección interna sale del valor tabulado del caño, no de una medición del caño real.');
    } else {
      e='mal'; t='Ni el caño más grande de la tabla alcanza';
      li.push('Los '+f(area,1)+' mm² de conductores superan el 35 % del RL 51. Hay que repartir en más de una canalización.');
    }
  }
  li.push(v.tipo==='secc'
    ? 'Para circuitos principales o seccionales el diámetro interno mínimo es 15 mm (RL 19, RS 19) y 200 mm² para otras formas.'
    : 'Para circuitos terminales el diámetro interno mínimo es 13 mm (RL 16, RS 16) y 150 mm² para otras formas.');
  li.push('No está permitido instalar un solo conductor aislado o un cable unipolar por dentro de un caño metálico.');
  var bs=[], graf;
  if(!mezcla){
    var nreq = n1 + ((s2!==null && n2!==null && s2===s1) ? n2 : 0);
    CANOS.forEach(function(c){
      if(c.c[s1]===undefined) return;                     /* la tabla no lo tabula para esa sección */
      bs.push({lbl:c.n, val:c.c[s1], color: c===elegido ? GC.ok : (c.c[s1]>=nreq ? GC.gris : '#D7DEE4'),
               txt:c.c[s1]+'+PE'});
    });
    graf = gBarras({barras:bs, alto:15, iz:56, lim:{v:nreq, lbl:'hacen falta '+nreq},
      ley:[{c:GC.ok,t:'el que corresponde'},{c:GC.gris,t:'también entra'},{c:'#D7DEE4',t:'no alcanza'}]});
  } else {
    CANOS.forEach(function(c){
      bs.push({lbl:c.n, val:c.s*0.35, color: c===elegido ? GC.ok : (area<=c.s*0.35 ? GC.gris : '#D7DEE4'),
               txt:f(c.s*0.35,0)+' mm²'});
    });
    graf = gBarras({barras:bs, alto:15, iz:56, lim:{v:area, lbl:'hacen falta '+f(area,0)+' mm²'},
      ley:[{c:GC.ok,t:'el que corresponde'},{c:GC.gris,t:'también entra'},{c:'#D7DEE4',t:'no alcanza'}]});
  }
  return {e:e, t:t, d:'', kpis:[
    {k:'Área de conductores', v:f(area,1), u:'mm²'},
    ocup!==null?{k:'Ocupación', v:f(ocup,1), u:'%', e:ocup>40?'mal':'ok'}:{k:'Ocupación', v:'—', u:''},
    {k:'Caño', v:elegido?elegido.n.replace(' ',''):'—', u:''}
  ], svg:graf, li:li};
},
cita:'AEA 90364-7-771, 771.12.IX — máxima cantidad de conductores por canalización, con el diámetro exterior y la sección total de cada conductor; y el criterio general de la misma cláusula: para los casos no previstos en las tablas, el área ocupada incluida la aislación no debe superar el 35 % de la sección interna del caño.'
},

/* ---------- K4 · grado de electrificación ---------- */
{
id:'K4', t:'Grado de electrificación y circuitos mínimos', s:'Por superficie y por demanda de potencia',
ver:['N8','N4','N7'],
campos:[
 {id:'tipo', lbl:'Tipo de inmueble', tipo:'sel', opts:[
    ['viv','Vivienda'],['loc','Oficina o local comercial'],['otr','Local de otras características']]},
 {id:'cub', lbl:'Superficie cubierta', u:'m²'},
 {id:'semi', lbl:'Superficie semicubierta', ayuda:'Computa al 50 %', u:'m²'},
 {id:'dpms', lbl:'DPMS — demanda de potencia máxima simultánea (opcional)', u:'kVA'}
],
ev:function(v){
  var cub=num(v.cub), semi=num(v.semi)||0, dpms=num(v.dpms), tipo=v.tipo||'viv';
  if(cub===null) return null;
  var sup = cub + semi*0.5;
  var grados=['Mínimo','Medio','Elevado','Superior'];
  var us = tipo==='viv' ? [60,130,200] : [30,75,150];
  var ud = tipo==='viv' ? [3.7,7,11] : [4.5,7.8,12.2];
  var gs = sup<=us[0]?0 : sup<=us[1]?1 : sup<=us[2]?2 : 3;
  var gd = dpms===null ? -1 : (dpms<=ud[0]?0 : dpms<=ud[1]?1 : dpms<=ud[2]?2 : 3);
  var g = Math.max(gs, gd);
  var circ = tipo==='otr' ? [3,4,6,8][g] : [2,3,5,6][g];
  var li=[
    'Superficie computada: '+f(cub,1)+' m² cubiertos + '+f(semi,1)+' m² semicubiertos al 50 % = '+f(sup,1)+' m².',
    'Por superficie corresponde grado '+grados[gs]+'.'
  ];
  if(gd>=0){
    li.push('Por DPMS de '+f(dpms,2)+' kVA corresponde grado '+grados[gd]+'.');
    li.push(gd>gs ? 'Manda la demanda: el grado adoptado es el más exigente de los dos.'
                  : (gs>gd ? 'Manda la superficie: el grado adoptado es el más exigente de los dos.'
                           : 'Los dos criterios coinciden.'));
  } else {
    li.push('Sin la DPMS el grado sale sólo de la superficie. Cargala para verificar que no lo empuje hacia arriba: manda siempre el criterio más exigente.');
  }
  li.push('Circuitos mínimos para grado '+grados[g]+': '+circ+'.');
  li.push('En todos los grados hacen falta al menos dos circuitos de iluminación, y tienen que depender de interruptores diferenciales distintos.');
  if(tipo!=='viv') li.push('Si el inmueble fue proyectado como vivienda, rigen los umbrales de vivienda aunque hoy funcione como local (771.8.3.1).');
  return {e:'info', t:'Grado '+grados[g]+' — '+circ+' circuitos como mínimo', d:'',
    kpis:[{k:'Superficie', v:f(sup,1), u:'m²'},{k:'Grado', v:grados[g], u:''},{k:'Circuitos mínimos', v:String(circ), u:''}],
    svg:gEscala({max:us[2]*1.6, val:sup, etiq:f(sup,0)+' m²', tramos:[
      {hasta:us[0], lbl:'Mínimo', c:'#BFD8E6'},{hasta:us[1], lbl:'Medio', c:'#8FBFD8'},
      {hasta:us[2], lbl:'Elevado', c:'#5C9EC0'},{hasta:us[2]*1.6, lbl:'Superior', c:'#2E7FA8'}]}),
    li:li};
},
cita:'AEA 90364-7-770, Tablas 770.7.I y 770.7.II. AEA 90364-7-771, Tablas 771.8.I, 771.8.II, 771.8.IV, 771.8.V y 771.8.X, y 771.8.3.1 sobre inmuebles proyectados como vivienda. La superficie es la cubierta más el 50 % de la semicubierta; entre superficie y DPMS manda el criterio más exigente.'
},

/* ---------- K5 · puesta a tierra ---------- */
{
id:'K5', t:'Puesta a tierra: Ra admisible', s:'El límite que le corresponde y la tensión de contacto',
ver:['T1','T2','T5'],
campos:[
 {id:'idn', lbl:'Sensibilidad del diferencial IΔn', tipo:'sel', opts:[
    ['10','10 mA'],['30','30 mA'],['100','100 mA'],['300','300 mA'],['500','500 mA']]},
 {id:'ra', lbl:'Resistencia de puesta a tierra medida', ayuda:'Con el telurímetro, electrodo desconectado', u:'Ω'}
],
ev:function(v){
  var idn=num(v.idn), ra=num(v.ra);
  if(idn===null) return null;
  var porUL = UL/(idn/1000);
  var lim = Math.min(40, porUL);
  var li=[
    'Ra × IΔn ≤ UL: con IΔn = '+f(idn,0)+' mA y UL = '+UL+' V, el bucle admitiría hasta '+f(porUL,0)+' Ω.',
    'La 771.3.3.1 fija además un techo de 40 Ω que no depende del diferencial. Manda el menor de los dos: '+f(lim,1)+' Ω.'
  ];
  if(ra===null){
    li.push('Cargá la resistencia medida para el veredicto. El ensayo se hace con el electrodo desconectado de la instalación, por el método de caída de potencial, con la pica de tensión al 62 % de la distancia al electrodo de corriente.');
    return {e:'info', t:'Límite admisible: '+f(lim,1)+' Ω', d:'',
      kpis:[{k:'Ra máxima', v:f(lim,1), u:'Ω'},{k:'Por UL/IΔn', v:f(porUL,0), u:'Ω'},{k:'Tope 771.3.3.1', v:'40', u:'Ω'}],
      li:li};
  }
  var uc = ra*(idn/1000);
  var e = ra<=lim ? 'ok' : 'mal';
  li.push('Tensión de contacto previsible ante una falla franca a masa: Uc = Ra × IΔn = '+f(ra,1)+' Ω × '+f(idn,0)+' mA = '+f(uc,2)+' V.');
  if(e==='mal'){
    li.push('Con '+f(ra,1)+' Ω el electrodo no cumple. Antes de agregar jabalinas, verificar la conexión del conductor de puesta a tierra y la cámara de inspección: una toma floja o sulfatada explica más mediciones altas que el terreno.');
    li.push('Si el terreno no da, las salidas son: más jabalinas en paralelo separadas al menos su longitud, jabalina más profunda, o tratamiento del terreno. Bajar IΔn no arregla la puesta a tierra, sólo corre el límite.');
  } else {
    li.push('Repetir la medición en la época seca del año: es cuando la resistividad del terreno es mayor y el valor sube.');
  }
  return {e:e, t: e==='ok' ? 'Cumple: '+f(ra,1)+' Ω ≤ '+f(lim,1)+' Ω' : 'No cumple: '+f(ra,1)+' Ω > '+f(lim,1)+' Ω',
    d:'Tensión de contacto previsible <span class="num">'+f(uc,2)+' V</span> contra un límite de '+UL+' V.',
    kpis:[{k:'Ra medida', v:f(ra,1), u:'Ω', e:e},{k:'Ra máxima', v:f(lim,1), u:'Ω'},
          {k:'Uc previsible', v:f(uc,2), u:'V', e:uc<=UL?'ok':'mal'}],
    svg:gBarras({barras:[{lbl:'Ra medida', val:ra, color:e==='ok'?GC.ok:GC.mal, txt:f(ra,1)+' Ω'}],
      lim:{v:lim, lbl:'límite '+f(lim,0)+' Ω'}, max:Math.max(ra,lim)*1.35, alto:30}),
    li:li, pel:(e==='mal')};
},
cita:'AEA 90364-7-771, 771.3.3.1 y Tabla 771.3.I — resistencia de puesta a tierra no mayor a 40 Ω, con el objetivo de fondo de que Ra × IΔn no supere la tensión de contacto límite. UL = 24 V por Ley 19587 y Decretos 351/79 y 911/96. Método de caída de potencial de la Figura 770.19.A.'
},

/* ---------- K6 · desbalance de fases ---------- */
{
id:'K6', t:'Desbalance de fases y corriente de neutro', s:'Reparto entre R, S y T',
ver:['B1','B2'],
campos:[
 {id:'ir', lbl:'Corriente de la fase R', u:'A'},
 {id:'is', lbl:'Corriente de la fase S', u:'A'},
 {id:'it', lbl:'Corriente de la fase T', u:'A'},
 {id:'inn', lbl:'Corriente medida en el neutro (opcional)', u:'A'}
],
ev:function(v){
  var a=num(v.ir), b=num(v.is), c=num(v.it), inn=num(v.inn);
  if(a===null||b===null||c===null) return null;
  var med=(a+b+c)/3;
  if(med<=0) return {e:'info', t:'Sin carga', d:'Las tres fases están en cero.', li:[]};
  var dmax=Math.max(Math.abs(a-med),Math.abs(b-med),Math.abs(c-med));
  var des=dmax/med*100;
  var teo=Math.sqrt(Math.max(0, a*a+b*b+c*c - a*b - b*c - c*a));
  var e = des<=10 ? 'ok' : (des<=20 ? 'ojo' : 'mal');
  var li=[
    'Corriente media: '+f(med,1)+' A. Desvío máximo respecto de la media: '+f(dmax,1)+' A.',
    'Corriente de neutro teórica para cargas equilibradas en fase: IN = √(IR²+IS²+IT² − IR·IS − IS·IT − IT·IR) = '+f(teo,1)+' A.'
  ];
  if(inn!==null){
    li.push('Neutro medido: '+f(inn,1)+' A contra '+f(teo,1)+' A teóricos.');
    if(inn > teo*1.3 + 1) li.push('El neutro lleva bastante más de lo que explica el desbalance. Eso apunta a armónicas de orden 3 y múltiplos, que en el neutro se suman en vez de cancelarse: fuentes conmutadas, LED, variadores. Ver ficha B2.');
  }
  li.push('El 10 % es un criterio de campo, no un valor reglamentario: la 771 pide mantener el sistema lo más equilibrado posible con una adecuada distribución de circuitos.');
  if(e!=='ok') li.push('Para reequilibrar conviene pasar circuitos entre fases mirando la demanda simultánea, no la cantidad de bocas.');
  return {e:e, t: e==='ok' ? 'Reparto aceptable: '+f(des,1)+' % de desbalance'
                           : 'Desbalance del '+f(des,1)+' %', d:'',
    kpis:[{k:'Desbalance', v:f(des,1), u:'%', e:e},{k:'Media', v:f(med,1), u:'A'},
          {k:'Neutro teórico', v:f(teo,1), u:'A'}],
    svg:gBarras({barras:[
      {lbl:'Fase R', val:a, color:GC.cel, txt:f(a,1)+' A'},
      {lbl:'Fase S', val:b, color:GC.cel, txt:f(b,1)+' A'},
      {lbl:'Fase T', val:c, color:GC.cel, txt:f(c,1)+' A'},
      {lbl:'Neutro'+(inn!==null?' (medido)':' (teórico)'), val:(inn!==null?inn:teo), color:GC.vio,
       txt:f(inn!==null?inn:teo,1)+' A'}
    ], lim:{v:med, lbl:'media '+f(med,1)+' A'}}),
    li:li};
},
cita:'AEA 90364-7-771, 771.9 y 771.8: la distribución de circuitos debe procurar el mayor equilibrio posible entre fases. El umbral del 10 % es un criterio de campo. Sobre la corriente de neutro con contenido armónico, 771.16.2.4 y la Nota 1 de la Tabla 771.16.II.b (el neutro se cuenta como conductor cargado si el THD supera el 15 %).'
},

/* ---------- K7 · disipación térmica del tablero ---------- */
{
id:'K7', t:'Disipación térmica del tablero', s:'Ptot contra la Pde declarada del gabinete',
ver:['C2','B5'],
campos:[
 {id:'ap', lbl:'Aparatos del tablero', tipo:'aparatos',
  ayuda:'Cargá cada interruptor con su In y sus polos: la Σ Pd sale de la Tabla 770-B.XI. Marcá cuál es el de cabecera. Si preferís, saltealo y cargá la Σ Pd a mano más abajo.'},
 {id:'pd', lbl:'Σ Pd de las protecciones', ayuda:'Sólo si no cargaste la lista de arriba. Suma de (W por polo × cantidad de polos) de cada interruptor, Tabla 770-B.XI', u:'W'},
 {id:'crit', lbl:'Criterio de simultaneidad K', tipo:'sel', opts:[
    ['tabla','Tabla 771.20.II — según cantidad de salidas'],
    ['real','Inq / Inu real — 0,85 × In cabecera / Σ In salidas'],
    ['uno','K = 1 — sin diversidad, el más exigente']]},
 {id:'sal', lbl:'Cantidad de salidas del tablero', ayuda:'Si cargaste la lista, se cuentan solas', u:''},
 {id:'incab', lbl:'In del interruptor de cabecera', ayuda:'Sólo para el criterio Inq/Inu; sale de la lista si la cargaste', u:'A'},
 {id:'insal', lbl:'Σ In de las salidas', ayuda:'Sólo para el criterio Inq/Inu; sale de la lista si la cargaste', u:'A'},
 {id:'pau', lbl:'Pau — disipación de los aparatos que no son protecciones', ayuda:'Transformadores de campanilla, fuentes, ojos de buey', u:'W'},
 {id:'pde', lbl:'Pde declarada del gabinete', ayuda:'Dato de chapa del fabricante, IEC 60670-24', u:'W'}
],
ev:function(v){
  var pd=num(v.pd), sal=num(v.sal), inc=num(v.incab), ins=num(v.insal), pau=num(v.pau)||0, pde=num(v.pde);
  var ap = Array.isArray(v.ap) ? v.ap : [];
  /* La lista de aparatos manda; si está vacía, vale la Σ Pd cargada a mano. */
  var usaLista=false, pdCab=0, pdSal=0, nSal=0, inSal=0, inCab=null, fuera=0, tetra=false, i, a, r;
  for(i=0;i<ap.length;i++){
    a=ap[i]; r=pdAparato(a);
    if(!r){ fuera++; continue; }
    if((a.p||1)===4) tetra=true;
    if(a.rol==='cab'){ pdCab+=r.pd; if(inCab===null) inCab=a.in; }
    else { pdSal+=r.pd; nSal+=(a.n||1); inSal+=(a.in||0)*(a.n||1); }
  }
  usaLista = (pdCab+pdSal)>0;
  if(!usaLista && fuera && pd===null){
    return {e:'ojo', t:'Falta el dato del fabricante',
      d:'Cargaste '+fuera+' aparato'+(fuera===1?'':'s')+' que la Tabla 770-B.XI no cubre: la tabla llega hasta 125 A.',
      kpis:[],
      li:['Por encima de 125 A la potencia disipada por polo la declara el fabricante del interruptor. Cargala en «W por polo del fabricante» al agregar el aparato y el cálculo sale igual.',
          'La otra opción es saltear la lista y cargar la Σ Pd total a mano, más abajo.']};
  }
  if(!usaLista && pd===null) return null;
  var crit=v.crit||'tabla', K=1, li=[];
  if(crit==='tabla'){
    var nsal = (sal!==null) ? sal : (usaLista && nSal>0 ? nSal : null);
    if(nsal===null) return null;
    K = nsal<=1 ? 1 : (nsal<=3 ? 0.8 : (nsal<=5 ? 0.7 : (nsal<=9 ? 0.6 : 0.5)));
    li.push('K = '+f(K,2)+' por Tabla 771.20.II, para '+f(nsal,0)+' salida'+(nsal===1?'':'s')+'.'+
            (sal===null && usaLista ? ' Contadas de la lista de aparatos.' : ''));
  } else if(crit==='real'){
    var ic = (inc!==null) ? inc : (usaLista ? inCab : null);
    var iu = (ins!==null) ? ins : (usaLista && inSal>0 ? inSal : null);
    if(ic===null || iu===null || iu<=0) return null;
    K = Math.min(1, 0.85*ic/iu);
    li.push('K = 0,85 × '+f(ic,0)+' A / '+f(iu,0)+' A = '+f(K,3)+', como en la Tabla 771-H.XIV.');
  } else {
    li.push('K = 1: sin diversidad. Es lo que corresponde si en la cabecera hay un diferencial o un seccionador en lugar de un termomagnético, porque entonces Inq = Inu.');
  }
  var pdp, veinte, ptot, pdTot;
  if(usaLista){
    pdTot = pdCab+pdSal;
    pdp = pdCab*KE_ENTRADA*KE_ENTRADA + pdSal*K*K;
    li.unshift('Σ Pd = '+f(pdTot,1)+' W, armada con la Tabla 770-B.XI'+
      (pdCab>0 ? ': '+f(pdCab,1)+' W en la cabecera y '+f(pdSal,1)+' W en las salidas.'
               : ', toda en las salidas: no marcaste ningún aparato como cabecera.'));
  } else {
    pdTot = pd;
    pdp = pd*K*K;
  }
  veinte = 0.2*pdp; ptot = pdp + veinte + pau;
  if(usaLista && pdCab>0){
    li.push('Pdp = Σ(Pd cabecera × Ke²) + Σ(Pd salidas × K²) = '+f(pdCab,1)+' × 0,85² + '+f(pdSal,1)+' × '+f(K,3)+'² = '+f(pdp,2)+' W.');
    li.push('El factor de utilización Ke = 0,85 va únicamente al circuito de entrada; a las salidas les corresponde K², como en la Tabla 771-H.XIV. Si la cabecera es un diferencial o un seccionador, cargala igual como cabecera pero adoptá K = 1.');
  } else if(usaLista){
    li.push('Pdp = Σ Pd × K² = '+f(pdSal,1)+' W × '+f(K,3)+'² = '+f(pdp,2)+' W.');
    li.push('Si marcás cuál es el interruptor de cabecera, a ese se le aplica Ke = 0,85 en lugar de K, como en la Tabla 771-H.XIV. Sin cabecera marcada, todo el tablero se calcula con K.');
  } else {
    li.push('Pdp = Σ Pd × K² = '+f(pd,1)+' W × '+f(K,3)+'² = '+f(pdp,2)+' W.');
  }
  li.push('Ptot = Pdp + 0,2·Pdp + Pau = '+f(pdp,2)+' + '+f(veinte,2)+' + '+f(pau,1)+' = '+f(ptot,2)+' W.');
  li.push('El 20 % cubre conexiones, borneras, tomacorrientes, relés, seccionadores y los propios diferenciales: los interruptores diferenciales no se suman aparte.');
  if(tetra) li.push('En los tetrapolares se computaron los 4 polos. La nota b de la Tabla 771-H.XIV deja al proyectista elegir 3 o 4; 4 es el criterio conservador. Si adoptás 3, cargá el aparato como tripolar.');
  if(fuera) li.push(fuera+' aparato'+(fuera===1?'':'s')+' quedó fuera del cálculo: la Tabla 770-B.XI llega hasta 125 A, y por encima de esa corriente el dato lo tiene que dar el fabricante. Cargalo con la W por polo de catálogo.');
  var e, t;
  if(pde===null){ e='info'; t='Ptot = '+f(ptot,1)+' W'; li.push('Cargá la Pde declarada del gabinete para el veredicto. Es un dato de chapa que certifica el fabricante bajo IEC 60670-24: no se puede deducir del tablero.'); }
  else if(ptot<=pde){ e='ok'; t='Verifica: '+f(ptot,1)+' W ≤ '+f(pde,0)+' W'; }
  else { e='mal'; t='No verifica: '+f(ptot,1)+' W > '+f(pde,0)+' W';
    li.push('Hay que pedir un gabinete con Pde de al menos '+f(Math.ceil(ptot),0)+' W, o repartir el equipamiento en dos envolventes.'); }
  li.push('Conviene correr los tres criterios de K: la diferencia entre el más laxo y el más exigente cambia el resultado por un factor grande, y el que se adopte tiene que quedar escrito en la memoria.');
  var kpis=[{k:'K adoptado', v:f(K,3), u:''},{k:'Pdp', v:f(pdp,1), u:'W'},{k:'Ptot', v:f(ptot,1), u:'W', e:e}];
  if(usaLista) kpis.unshift({k:'Σ Pd', v:f(pdTot,1), u:'W'});
  return {e:e, t:t, d:'',
    kpis:kpis,
    svg:gApilada([{v:pdp, c:GC.cel, t:'Pdp'},{v:veinte, c:GC.ojo, t:'20 % de Pdp'},{v:pau, c:GC.vio, t:'Pau'}], pde, 'W'),
    li:li};
},
cita:'AEA 90364-7-771, 771.20.4 y Anexo 771-H, Tablas 771-H.XIII y 771-H.XIV; Tabla 771.20.II para el factor de simultaneidad K; Tabla 770-B.XI (= 771-H.XII, de la Tabla 8 de IEC 60898-1) para la potencia disipada por polo, leída por límite superior de banda. El factor de utilización Ke = 0,85 se aplica sólo al circuito de entrada. La Pde de la envolvente la declara y certifica el fabricante según IEC 60670-24.'
},

/* ---------- K8 · factor de potencia ---------- */
{
id:'K8', t:'Compensación del factor de potencia', s:'kVAr que hacen falta y corriente que se ahorra',
ver:['B4'],
campos:[
 {id:'p', lbl:'Potencia activa P', u:'kW'},
 {id:'c1', lbl:'cos φ actual', ayuda:'El que marca el analizador o la factura', u:''},
 {id:'c2', lbl:'cos φ objetivo', ayuda:'Las distribuidoras suelen penalizar por debajo de 0,95', u:''},
 {id:'sis', lbl:'Sistema', tipo:'sel', opts:[['mono','Monofásico — 220 V'],['tri','Trifásico — 380 V']]}
],
ev:function(v){
  var P=num(v.p), c1=num(v.c1), c2=num(v.c2), sis=v.sis||'tri';
  if(P===null||c1===null) return null;
  if(c1<=0||c1>1) return {e:'ojo', t:'cos φ fuera de rango', d:'El factor de potencia va entre 0 y 1.', li:[]};
  if(c2===null) c2=0.95;
  if(c2<=0||c2>1) return {e:'ojo', t:'cos φ objetivo fuera de rango', d:'El factor de potencia va entre 0 y 1.', li:[]};
  var U = sis==='tri' ? U_LIN : UN, k = sis==='tri' ? Math.sqrt(3) : 1;
  var t1=Math.tan(Math.acos(c1)), t2=Math.tan(Math.acos(c2));
  var Q1=P*t1, Q2=P*t2, Qc=Q1-Q2;
  var S1=P/c1, S2=P/c2, I1=S1*1000/(k*U), I2=S2*1000/(k*U);
  var li=[
    'Q actual = P · tan φ₁ = '+f(P,2)+' kW × '+f(t1,3)+' = '+f(Q1,2)+' kVAr.',
    'Q deseada = P · tan φ₂ = '+f(P,2)+' kW × '+f(t2,3)+' = '+f(Q2,2)+' kVAr.',
    'Capacitor necesario: Qc = P (tan φ₁ − tan φ₂) = '+f(Qc,2)+' kVAr.',
    'La corriente de línea baja de '+f(I1,1)+' A a '+f(I2,1)+' A: una reducción del '+f((1-I2/I1)*100,1)+' %.'
  ];
  if(Qc<=0) li.push('El cos φ actual ya es mejor que el objetivo: no hace falta compensar. Sobrecompensar lleva el sistema a capacitivo y también se penaliza.');
  li.push('Compensar no reduce la potencia activa ni la energía facturada: reduce la reactiva, la corriente y por lo tanto las pérdidas y la caída de tensión de la línea.');
  li.push('Con cargas electrónicas y variadores hay que verificar el contenido armónico antes de poner capacitores: pueden entrar en resonancia con la red y hay que ir a filtros o reactancias de bloqueo.');
  return {e:'info', t:(Qc>0?'Hacen falta '+f(Qc,2)+' kVAr':'No hace falta compensar'), d:'',
    kpis:[{k:'Capacitor', v:f(Math.max(0,Qc),2), u:'kVAr'},{k:'S antes', v:f(S1,2), u:'kVA'},
          {k:'S después', v:f(S2,2), u:'kVA'},{k:'Corriente', v:f(I1,1)+'→'+f(I2,1), u:'A'}],
    svg:gTriangulo(P, Q1, Math.max(0,Q2)), li:li};
},
cita:'La exigencia de factor de potencia y su penalización las fija cada distribuidora en su cuadro tarifario, no la AEA 90364. El cálculo es el clásico Qc = P (tan φ₁ − tan φ₂). La verificación de armónicas antes de compensar sale del criterio de 771.16.2.4 sobre contenido armónico.'
},

/* ---------- K9 · potencia, corriente y calibre ---------- */
{
id:'K9', t:'Potencia, corriente y calibre', s:'Conversión rápida y el interruptor que sigue',
ver:['P1','P5'],
campos:[
 {id:'sis', lbl:'Sistema', tipo:'sel', opts:[
    ['mono','Monofásico — 220 V'],['tri','Trifásico — 380 V'],['otra','Otra tensión']]},
 {id:'u', lbl:'Tensión (sólo si elegiste «otra»)', u:'V'},
 {id:'cos', lbl:'cos φ', ayuda:'0,85 es el valor que sugiere la Reglamentación a falta de dato', u:''},
 {id:'p', lbl:'Potencia', ayuda:'Cargá potencia o corriente, la que tengas', u:'W'},
 {id:'i', lbl:'Corriente', u:'A'}
],
ev:function(v){
  var sis=v.sis||'mono', U=num(v.u), cos=num(v.cos), P=num(v.p), I=num(v.i);
  if(cos===null) cos=0.85;
  if(cos<=0||cos>1) return {e:'ojo', t:'cos φ fuera de rango', d:'El factor de potencia va entre 0 y 1.', li:[]};
  var k=1;
  if(sis==='tri'){ U=U_LIN; k=Math.sqrt(3); }
  else if(sis==='mono'){ U=UN; }
  if(U===null||U<=0) return null;
  if(P===null && I===null) return null;
  if(P===null) P = k*U*I*cos;
  else if(I===null) I = P/(k*U*cos);
  var S=k*U*I/1000;
  var In=null, i;
  for(i=0;i<SERIE_IN.length;i++) if(SERIE_IN[i]>=I){ In=SERIE_IN[i]; break; }
  var li=[
    (sis==='tri' ? 'P = √3 · U · I · cos φ' : 'P = U · I · cos φ')+' = '+f(P,0)+' W con U = '+f(U,0)+' V y cos φ = '+f(cos,2)+'.',
    'Potencia aparente S = '+f(S,2)+' kVA.',
    In ? 'El primer calibre normalizado de la serie IEC 60898-1 que queda por encima de la corriente es '+In+' A.'
       : 'La corriente supera el mayor calibre de la serie cargada acá (125 A): corresponde ir a un interruptor en caja moldeada.'
  ];
  li.push('Este calibre es sólo el punto de partida: hay que verificarlo contra la Iz corregida del conductor con el cálculo K2, y contra la caída de tensión con el K1.');
  return {e:'info', t:f(I,1)+' A · '+f(P,0)+' W', d:'',
    kpis:[{k:'Corriente', v:f(I,1), u:'A'},{k:'Potencia', v:f(P,0), u:'W'},
          {k:'Aparente', v:f(S,2), u:'kVA'},{k:'Calibre siguiente', v:In?String(In):'—', u:In?'A':''}],
    svg:gBarras({barras:SERIE_IN.slice(0,10).map(function(x){
        return {lbl:x+' A', val:x, color: x===In?GC.ok:(x<I?'#E1E7EB':GC.gris), txt:''};
      }), lim:{v:I, lbl:'IB = '+f(I,1)+' A'}, alto:13, iz:44, max:Math.max(63,I*1.2),
      ley:[{c:GC.ok,t:'el que corresponde'},{c:'#E1E7EB',t:'queda por debajo de IB'}]}),
    li:li};
},

function ligarAparatos(destino, alRecalcular){
  app.querySelectorAll('[data-ap]').forEach(function(box){
    var id=box.getAttribute('data-ap');
    function lista(){ return Array.isArray(destino[id])?destino[id]:[]; }
    function ligarBorrado(){
      box.querySelectorAll('[data-apdel]').forEach(function(b){
        b.onclick=function(){
          var l=lista().slice();
          l.splice(parseInt(this.getAttribute('data-apdel'),10),1);
          destino[id]=l; repintar(); if(alRecalcular) alRecalcular(true);
        };
      });
    }
    function repintar(){
      var ul=box.querySelector('.apar-lista');
      if(ul) ul.innerHTML=filasAparatos(lista());
      var s=box.querySelector('.apar-sum');
      if(s) s.textContent=sumaAparatos(lista());
      ligarBorrado();
    }
    var add=box.querySelector('[data-apadd]');
    if(add) add.onclick=function(){
      function val(k){ var el=box.querySelector('[data-apf="'+k+'"]'); return el?el.value:''; }
      var inA=num(val('in')), p=parseInt(val('p'),10)||1, n=parseInt(String(val('n')).replace(',','.'),10)||1;
      var w=String(val('w')).trim(), rol=(val('rol')==='cab')?'cab':'sal';
      if(!(inA>0)) return;
      if(n<1) n=1;
      if(n>40) n=40;
      var l=lista().slice();
      l.push({in:inA, p:p, n:n, rol:rol, w:(w===''?null:w)});
      destino[id]=l;
      var we=box.querySelector('[data-apf="w"]'); if(we) we.value='';
      repintar(); if(alRecalcular) alRecalcular(true);
    };
    ligarBorrado();
  });
}
function ligarCampos(destino, alRecalcular){
  app.querySelectorAll('[data-c]').forEach(function(el){
    el.addEventListener('input', function(){ destino[this.dataset.c] = this.value; if(alRecalcular) alRecalcular(); });
  });
  app.querySelectorAll('[data-b]').forEach(function(el){
    el.onclick=function(){
      var c=this.dataset.b, val=this.dataset.v==='1';
      destino[c] = (destino[c]===val) ? null : val;
      if(alRecalcular) alRecalcular();
    };
  });
}
function evaluarCampos(campos, valores){
  var vals={}, i, c, raw;
  for(i=0;i<campos.length;i++){
    c=campos[i]; raw=valores[c.id];
    if(c.tipo==='bool') vals[c.id] = (raw===true||raw===false) ? raw : null;
    else if(c.tipo==='sel') vals[c.id] = raw ? raw : null;
    else if(c.tipo==='aparatos') vals[c.id] = Array.isArray(raw) ? raw : [];
    else vals[c.id] = num(raw);
  }
  return vals;
}

    if(c.tipo==='aparatos'){ if(!val.length) continue; txt = textoAparatos(val); }
    else if(c.tipo==='bool') txt = val ? 'sí' : 'no';
    else if(c.tipo==='sel'){ txt=val; for(o=0;o<c.opts.length;o++) if(String(c.opts[o][0])===String(val)) txt=c.opts[o][1]; }
    else txt = f(val,2)+(c.u?' '+c.u:'');
    out.push(c.lbl.replace(/\s*\(opcional[^)]*\)/i,'')+': '+txt);
  }
  return out;
}

/* Repinta sólo el bloque de resultado. El botón de guardar es un nodo fijo:
   si se reemplazara en cada repintado, un toque que cae justo entre el
   mousedown y el mouseup se pierde y el guardado no llega a dispararse. */
function pintarSalida(){
  var cont=document.getElementById('salidaVer'), g=document.getElementById('guardar');
  if(!cont) return;
  if(!ST.veredicto){ cont.innerHTML=''; if(g) g.hidden=true; return; }
  cont.innerHTML = pintarVeredicto(ST.veredicto);
  cont.querySelectorAll('.xref[data-id]').forEach(function(b){ b.onclick=function(){ ir('ficha', this.dataset.id); }; });
  if(g){
    var yaEsta = ST.editando!==null && ST.registro[ST.editando];
    g.hidden=false; g.disabled=false;
    g.textContent = yaEsta ? 'Actualizar en el informe' : 'Guardar en el informe';
  }
}
function guardarValores(){
  if(ST.vista==='ficha' && ST.falla){ ST.guardados[ST.falla.id]=JSON.parse(JSON.stringify(ST.valores)); guardar(); }
  else if(ST.vista==='calc' && ST.calc){ ST.guardados['calc:'+ST.calc.id]=JSON.parse(JSON.stringify(ST.valores)); guardar(); }
}
function diagnosticar(){
  var x=ST.falla, vals=evaluarCampos(x.med.campos, ST.valores), r=null;
  try{ r = x.med.ev(vals); }catch(err){ r=null; }
  guardarValores();
  if(!r){ toast('Faltan datos para diagnosticar'); ST.veredicto=null; ST.vals=null; pintarSalida(); return; }
  ST.veredicto=r; ST.vals=vals;
  pintarSalida();
  var el=document.querySelector('.ver');
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}
function guardarRegistro(){
  var esFicha = ST.vista==='ficha';
  var x = esFicha ? ST.falla : ST.calc, v = ST.veredicto;
  if(!v||!x) return;
  var campos = esFicha ? x.med.campos : x.campos;
  if(!ST.t0) ST.t0=Date.now();
  var item = {
    k: esFicha?'F':'C', id:x.id, t:x.t, fam: esFicha?nombreFam(x.fam):'Cálculo de obra',
    e:v.e, ver:v.t, lect:lecturas(campos, ST.vals), ts:Date.now(), hora:horaDe(Date.now())
  };
  if(ST.editando!==null && ST.registro[ST.editando] && ST.registro[ST.editando].id===x.id){
    item.ts=ST.registro[ST.editando].ts; item.hora=ST.registro[ST.editando].hora;
    ST.registro[ST.editando]=item;
    toast('Actualizado en el informe');
  } else {
    ST.registro.push(item);
    ST.editando=ST.registro.length-1;
    toast('Guardado en el informe ('+ST.registro.length+')');
  }
  guardar();
  var g=document.getElementById('guardar');
  if(g){ g.textContent='Guardado ✓'; g.disabled=true; }
  pintarNav();
}

      clearTimeout(deb); recalcularCalc();
    });
  });
  app.querySelectorAll('[data-b]').forEach(function(el){
    el.onclick=function(){
      var k=this.dataset.b, val=this.dataset.v==='1';
      ST.valores[k]=(ST.valores[k]===val)?null:val;

  ST.firmaCalc=firmaValores();
  pintarSalidaCalc();

function firmaValores(){ try{ return JSON.stringify(ST.valores); }catch(e){ return String(Math.random()); } }
function recalcularCalc(forzar){
  var c=ST.calc;
  if(!c) return;
  var firma=firmaValores();
  /* Sin cambios reales no se repinta: si no, el «change» que dispara un campo
     al perder el foco reemplaza el botón justo cuando lo estás tocando. */
  if(!forzar && firma===ST.firmaCalc) return;
  ST.firmaCalc=firma;
  var vals=evaluarCampos(c.campos, ST.valores), r=null;
  try{ r=c.ev(vals); }catch(e){ r=null; }
  ST.veredicto=r; ST.vals=vals;
  guardarValores();
  pintarSalidaCalc();
}
function pintarSalidaCalc(){
  var cont=document.getElementById('salidaVer'), g=document.getElementById('guardar');

    return;

  cont.innerHTML = pintarVeredicto(ST.veredicto);
  cont.querySelectorAll('.xref[data-id]').forEach(function(b){ b.onclick=function(){ ir('ficha', this.dataset.id); }; });
  if(g){
    var yaEsta = ST.editando!==null && ST.registro[ST.editando];
    g.hidden=false; g.disabled=false;
    g.textContent = yaEsta ? 'Actualizar en el informe' : 'Guardar en el informe';
  }
}

function cerrarIntervencion(){
